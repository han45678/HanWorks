<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>街友本色 I - 煙屁股大作戰 | True Hobo I: Butt Brawl</title>
    <!-- 分頁小圖示（內嵌，免得瀏覽器去抓不存在的 favicon.ico） -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚬</text></svg>">
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- 內建漫畫原圖（與本檔放在同一個資料夾；缺少時自動改用程式繪製的備援美術） -->
    <script src="phaser_2d_art.js"></script>
    <!-- Google Fonts：中文 Noto Serif TC、英文 Noto Serif（全站統一） -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Serif:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            /* 手機點擊時不要整個畫布閃一下灰色 */
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #080a0f;
            overflow: hidden;
            font-family: "Noto Serif", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
            touch-action: none;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            /* --ad-reserve：底部廣告要讓出的高度，由 layoutAdBar() 設定（廣告放左下角或收起時為 0） */
            height: calc(100vh - var(--ad-reserve, 0px));
            height: calc(100dvh - var(--ad-reserve, 0px));
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #161c24 0%, #05070a 100%);
        }

        /* 置中交給 Phaser 的 autoCenter（canvas margin）；這裡不要再用 flex 置中，否則會疊加位移、畫布偏一邊 */
        #phaser-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* 底部小橫幅廣告（320×50）：不疊在遊戲上，並與遊戲保持 Google 建議的 150px 以上距離 */
        #ad-bar {
            position: fixed;
            bottom: 8px;
            left: 50%;
            width: 320px;
            height: 50px;
            transform: translateX(-50%);
            z-index: 20;
        }

        body.ad-corner #ad-bar {
            left: 16px;
            transform: none;
        }

        body.ad-hidden #ad-bar {
            display: none;
        }

        /* 右上角音樂按鈕（原本用 Tailwind CDN，全頁只剩這顆按鈕在用，改成手寫樣式） */
        #top-bar {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #btn-mute {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font: inherit;
            font-size: 12px;
            line-height: 16px;
            font-weight: 700;
            color: #fbbf24;
            background: rgba(28, 25, 23, 0.85);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: background-color 0.15s;
        }

        #btn-mute:hover {
            background: #292524;
        }

        #mute-text {
            display: none;
        }

        @media (min-width: 640px) {
            #mute-text {
                display: inline;
            }
        }

        canvas {
            display: block;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 15px rgba(255, 100, 30, 0.18);
            border-radius: 6px;
        }

        /* Persistent Cover Video Layer */
        #cover-video-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 12;
            object-fit: cover;
            border-radius: 6px;
            transition: opacity 0.6s ease;
            opacity: 0;
        }

        .comic-stroke {
            text-shadow:
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000,
                0px 4px 12px rgba(0, 0, 0, 0.9);
        }

        .neon-glow-red {
            text-shadow: 0 0 10px #ff3b1f, 0 0 22px #ff1100, 2px 2px 0 #000;
        }

        /* Custom scrollbar for modal */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #111827;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <div id="game-wrapper">
        <!-- Persistent Video Element (plays cover video visually on CoverScene, stays alive for continuous music when entering game) -->
        <video id="cover-video-layer" playsinline loop preload="auto"></video>

        <!-- Phaser Game Canvas Mount -->
        <div id="phaser-container"></div>

        <!-- 右上角音樂開關 -->
        <div id="top-bar">
            <button id="btn-mute">
                <span id="mute-icon">🔊</span> <span id="mute-text">街頭搖滾 BGM</span>
            </button>

        </div>

    </div>

    <script>
        /**
         * ============================================================================
         * 1. CONTINUOUS ROCK & STREET AMBIENT SOUND ENGINE + TAIWANESE HOKKIEN VOICE
         * ============================================================================
         * Ensures music starts on the Cover Screen and NEVER stops or resets when
         * transitioning into the story and gameplay. Also handles authentic Taiwanese
         * Hokkien (台語) burn voice exclamations + sizzle/inhale sound effects.
         */
        class StreetAudioEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.isPlayingBGM = false;
                this.hasCustomVideoAudio = false;
                this.bgmStep = 0;
                this.bgmTimer = null;
                this.inhaleNode = null;
                this.inhaleGain = null;
                this.rainGain = null;

                // Taiwanese Hokkien Burn Lines (台式閩南語燙傷語音台詞)
                this.taiwaneseBurnLines = [
                    { text: "啊娘喂！燒啦！燙死林北啦！", tts: "啊娘喂！休啦！燙死林北啦！", pitch: 1.15, rate: 1.25 },
                    { text: "靠北喔！燒燙燙！嘴唇起水泡啦！", tts: "靠北喔！休燙燙！嘴唇起水泡啦！", pitch: 1.05, rate: 1.3 },
                    { text: "夭壽骨喔！燒到手指頭啦！痛死！", tts: "夭壽骨喔！休到手指頭啦！痛死！", pitch: 1.2, rate: 1.28 },
                    { text: "林老師咧！這支菸頭有夠燒！", tts: "林老師咧！這支菸頭有夠休！", pitch: 0.95, rate: 1.25 },
                    { text: "哎喲喂呀！燒到嘴角臭火乾啦！", tts: "哎喲喂呀！休到嘴角臭火搭啦！", pitch: 1.1, rate: 1.22 }
                ];
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            startContinuousBGM() {
                this.init();
                // Also ensure cover video plays unmuted if user uploaded/loaded a video with sound
                const videoEl = document.getElementById('cover-video-layer');
                if (videoEl && videoEl.src && this.hasCustomVideoAudio) {
                    videoEl.muted = this.isMuted;
                    videoEl.volume = 0.85;
                    videoEl.play().catch(() => { });
                }

                if (this.isPlayingBGM) return;
                this.isPlayingBGM = true;

                // Start continuous subtle night street rain / neon hum ambience
                this.startRainAmbience();

                // Grunge / Taiwanese Street Rock Guitar & Bass Riff Sequencer (matches the cover video's gritty rock riff)
                // Riff pattern in E minor pentatonic (E2, G2, A2, Bb2, A2, G2, E2)
                const riffNotes = [
                    { freq: 82.41, dur: 0.22, accent: true },   // E2
                    { freq: 82.41, dur: 0.18, accent: false },  // E2
                    { freq: 98.00, dur: 0.24, accent: true },   // G2
                    { freq: 110.00, dur: 0.24, accent: true },  // A2
                    { freq: 116.54, dur: 0.20, accent: true },  // Bb2 (blues gritty flat 5)
                    { freq: 110.00, dur: 0.22, accent: false }, // A2
                    { freq: 98.00, dur: 0.24, accent: true },   // G2
                    { freq: 82.41, dur: 0.32, accent: true },   // E2
                    { freq: 82.41, dur: 0.18, accent: false },  // E2
                    { freq: 110.00, dur: 0.24, accent: true },  // A2
                    { freq: 123.47, dur: 0.25, accent: true },  // B2
                    { freq: 116.54, dur: 0.20, accent: true },  // Bb2
                    { freq: 110.00, dur: 0.22, accent: false }, // A2
                    { freq: 98.00, dur: 0.22, accent: true },   // G2
                    { freq: 73.42, dur: 0.25, accent: true },   // D2
                    { freq: 82.41, dur: 0.35, accent: true }    // E2
                ];

                const stepIntervalMs = 240; // 125 BPM eighth-note rock groove
                this.bgmTimer = setInterval(() => {
                    if (this.isMuted || !this.ctx) return;
                    // If user loaded a custom video with its own audio track and it's actively playing, lower synth volume so video BGM shines
                    const videoEl = document.getElementById('cover-video-layer');
                    const videoAudioActive = (this.hasCustomVideoAudio && videoEl && !videoEl.paused && !videoEl.muted);
                    const masterVol = videoAudioActive ? 0.04 : 0.18;

                    const step = riffNotes[this.bgmStep % riffNotes.length];
                    this.playGrungeGuitarNote(step.freq, step.dur, step.accent, masterVol);
                    if (this.bgmStep % 2 === 0) {
                        this.playDrumKickOrSnare((this.bgmStep % 4 === 2) ? 'snare' : 'kick', masterVol * 1.1);
                    }
                    this.bgmStep++;
                }, stepIntervalMs);
            }

            startRainAmbience() {
                if (!this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 2;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = noiseBuffer;
                    whiteNoise.loop = true;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 950;
                    filter.Q.value = 0.7;

                    this.rainGain = this.ctx.createGain();
                    this.rainGain.gain.value = this.isMuted ? 0 : 0.025;

                    whiteNoise.connect(filter);
                    filter.connect(this.rainGain);
                    this.rainGain.connect(this.ctx.destination);
                    whiteNoise.start(0);
                } catch (e) { }
            }

            playGrungeGuitarNote(freq, duration, accent, maxGain = 0.18) {
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;

                // Root + Fifth power chord oscillators
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                osc1.type = 'sawtooth';
                osc2.type = 'square';
                osc1.frequency.setValueAtTime(freq, now);
                osc2.frequency.setValueAtTime(freq * 1.498, now); // Power fifth

                // Overdrive waveshaper
                const shaper = this.ctx.createWaveShaper();
                const curve = new Float32Array(256);
                for (let i = 0; i < 256; i++) {
                    const x = (i * 2) / 256 - 1;
                    curve[i] = Math.tanh(x * (accent ? 6.5 : 4.0));
                }
                shaper.curve = curve;

                // Cabinet lowpass filter
                const cabFilter = this.ctx.createBiquadFilter();
                cabFilter.type = 'lowpass';
                cabFilter.frequency.setValueAtTime(accent ? 1850 : 1300, now);

                const gain = this.ctx.createGain();
                const peak = accent ? maxGain : maxGain * 0.7;
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(peak, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc1.connect(shaper);
                osc2.connect(shaper);
                shaper.connect(cabFilter);
                cabFilter.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration + 0.02);
                osc2.stop(now + duration + 0.02);
            }

            playDrumKickOrSnare(type, vol = 0.18) {
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;
                if (type === 'kick') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(36, now + 0.12);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else {
                    // Snare burst
                    const bufSize = this.ctx.sampleRate * 0.1;
                    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.4));
                    const src = this.ctx.createBufferSource();
                    src.buffer = buf;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 400;
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(vol * 0.65, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    src.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    src.start(now);
                }
            }

            // Lighter flint strike sound ("chk-chk-fwoosh")
            playLighterFlick() {
                this.init();
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;
                const bufSize = this.ctx.sampleRate * 0.35;
                const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) {
                    const env = i < bufSize * 0.15 ? 1.0 : Math.exp(-(i - bufSize * 0.15) / (bufSize * 0.3));
                    data[i] = (Math.random() * 2 - 1) * env;
                }
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(3200, now);
                filter.frequency.exponentialRampToValueAtTime(800, now + 0.32);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                src.start(now);
            }

            // Continuous tobacco crackling sound while holding/inhaling
            setInhaleSound(isInhaling, heatRatio = 0.5) {
                this.init();
                if (!this.ctx || this.isMuted) {
                    if (this.inhaleGain) this.inhaleGain.gain.value = 0;
                    return;
                }
                if (isInhaling) {
                    if (!this.inhaleNode) {
                        const bufSize = this.ctx.sampleRate * 1.5;
                        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                        const data = buf.getChannelData(0);
                        for (let i = 0; i < bufSize; i++) {
                            // Crackling tobacco pop texture
                            const crackle = Math.random() > 0.96 ? (Math.random() * 2 - 1) * 2.5 : (Math.random() * 2 - 1) * 0.35;
                            data[i] = crackle;
                        }
                        this.inhaleNode = this.ctx.createBufferSource();
                        this.inhaleNode.buffer = buf;
                        this.inhaleNode.loop = true;

                        this.inhaleFilter = this.ctx.createBiquadFilter();
                        this.inhaleFilter.type = 'bandpass';
                        this.inhaleFilter.frequency.value = 1200;

                        this.inhaleGain = this.ctx.createGain();
                        this.inhaleGain.gain.value = 0.08;

                        this.inhaleNode.connect(this.inhaleFilter);
                        this.inhaleFilter.connect(this.inhaleGain);
                        this.inhaleGain.connect(this.ctx.destination);
                        this.inhaleNode.start(0);
                    }
                    const targetFreq = 900 + heatRatio * 1800;
                    this.inhaleFilter.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.05);
                    this.inhaleGain.gain.setTargetAtTime(0.08 + heatRatio * 0.14, this.ctx.currentTime, 0.05);
                } else if (this.inhaleGain) {
                    this.inhaleGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.06);
                }
            }

            // Trigger Taiwanese Hokkien Burn Voice + Sizzle Sound!
            playTaiwaneseBurnVoice() {
                this.init();
                const line = this.taiwaneseBurnLines[Math.floor(Math.random() * this.taiwaneseBurnLines.length)];

                if (!this.isMuted && this.ctx) {
                    const now = this.ctx.currentTime;
                    // 1. Hot skin sizzle sound ("Tssss!")
                    const sizzleBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.4, this.ctx.sampleRate);
                    const ch = sizzleBuf.getChannelData(0);
                    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ch.length * 0.35));
                    const sizzleSrc = this.ctx.createBufferSource();
                    sizzleSrc.buffer = sizzleBuf;
                    const sizzleFilter = this.ctx.createBiquadFilter();
                    sizzleFilter.type = 'highpass';
                    sizzleFilter.frequency.value = 2800;
                    const sizzleGain = this.ctx.createGain();
                    sizzleGain.gain.setValueAtTime(0.45, now);
                    sizzleGain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
                    sizzleSrc.connect(sizzleFilter);
                    sizzleFilter.connect(sizzleGain);
                    sizzleGain.connect(this.ctx.destination);
                    sizzleSrc.start(now);

                    // 2. Synthesized vocal pain grunt/cry fallback ("Ah-niang-wei! Sio-lah!")
                    const vOsc = this.ctx.createOscillator();
                    const vGain = this.ctx.createGain();
                    vOsc.type = 'sawtooth';
                    // Taiwanese exclamation pitch contour
                    vOsc.frequency.setValueAtTime(290, now + 0.05);
                    vOsc.frequency.linearRampToValueAtTime(420, now + 0.18); // "啊娘~"
                    vOsc.frequency.linearRampToValueAtTime(240, now + 0.34); // "喂~"
                    vOsc.frequency.setValueAtTime(380, now + 0.38);          // "燒(Sio)!"
                    vOsc.frequency.exponentialRampToValueAtTime(170, now + 0.68); // "啦!"

                    const formant = this.ctx.createBiquadFilter();
                    formant.type = 'bandpass';
                    formant.frequency.setValueAtTime(850, now);
                    formant.Q.value = 3.5;

                    vGain.gain.setValueAtTime(0.001, now);
                    vGain.gain.linearRampToValueAtTime(0.28, now + 0.06);
                    vGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                    vOsc.connect(formant);
                    formant.connect(vGain);
                    vGain.connect(this.ctx.destination);
                    vOsc.start(now + 0.05);
                    vOsc.stop(now + 0.72);
                }

                // 3. Web Speech API with Taiwanese Mandarin/Hokkien phonetic inflection
                if (!this.isMuted && 'speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(line.tts);
                        utter.lang = 'zh-TW';
                        utter.pitch = line.pitch;
                        utter.rate = line.rate;
                        utter.volume = 1.0;
                        const voices = window.speechSynthesis.getVoices();
                        const twVoice = voices.find(v => v.lang.includes('TW') || v.name.includes('Taiwan') || v.name.includes('Meijia') || v.name.includes('Hsiao'));
                        if (twVoice) utter.voice = twVoice;
                        window.speechSynthesis.speak(utter);
                    } catch (e) { }
                }

                return line.text;
            }

            playCoughWarning() {
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(95, now + 0.18);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.21);
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                if (this.rainGain && this.ctx) {
                    this.rainGain.gain.setValueAtTime(this.isMuted ? 0 : 0.025, this.ctx.currentTime);
                }
                const videoEl = document.getElementById('cover-video-layer');
                if (videoEl) {
                    videoEl.muted = this.isMuted;
                }
                return this.isMuted;
            }
        }

        const audioEngine = new StreetAudioEngine();

        /**
         * ============================================================================
         * 2. HIGH-DETAIL PROCEDURAL COMIC ARTWORK GENERATOR (FALLBACK FOR 0.jpg ~ 6.jpg)
         * ============================================================================
         * Recreates the exact dark ink-and-watercolor Taiwanese street comic aesthetic
         * of 0.jpg, 1.jpg, 2.jpg, 3.jpg, 4.jpg, 5.jpg, and 6.jpg on HTML5 Canvas
         * so the game is 100% playable and visually authentic immediately, while also
         * supporting hot-swapping with the user's actual image files.
         */
        class ComicArtGenerator {
            static generateAllTextures(scene) {
                const W = 540, H = 960;
                const configs = [
                    { key: 'img0', drawFn: (ctx) => ComicArtGenerator.drawScene0_NeonStreet(ctx, W, H) },
                    { key: 'img1', drawFn: (ctx) => ComicArtGenerator.drawScene1_AlleyFar(ctx, W, H, false) },
                    { key: 'img2', drawFn: (ctx) => ComicArtGenerator.drawScene1_AlleyFar(ctx, W, H, true) },
                    { key: 'img3', drawFn: (ctx) => ComicArtGenerator.drawScene3_AshtrayClose(ctx, W, H, false) },
                    { key: 'img4', drawFn: (ctx) => ComicArtGenerator.drawScene3_AshtrayClose(ctx, W, H, true) },

            // Helper: Gritty comic ink crosshatching & vignette
            static applyComicFinish(ctx, W, H) {
                // Ink hatching lines
                ctx.save();
                ctx.strokeStyle = 'rgba(0,0,0,0.22)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 120; i++) {
                    const x = (i * 37) % W;
                    const y = (i * 83) % H;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + 8, y + 24);
                    ctx.stroke();
                }
                // Dark comic vignette border
                const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, H * 0.65);
                vig.addColorStop(0, 'rgba(0,0,0,0)');
                vig.addColorStop(1, 'rgba(4,6,10,0.68)');
                ctx.fillStyle = vig;
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }

            static drawNeonSign(ctx, x, y, w, h, bgColor, borderColor, text, textColor = '#fff', vertical = true) {
                ctx.save();
                ctx.shadowColor = bgColor;
                ctx.shadowBlur = 16;
                ctx.fillStyle = bgColor;
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 3;
                ctx.fillRect(x, y, w, h);
                ctx.strokeRect(x, y, w, h);
                ctx.shadowBlur = 0;

                ctx.fillStyle = textColor;
                ctx.font = `900 ${vertical ? Math.floor(w * 0.62) : Math.floor(h * 0.58)}px ${FONT_SERIF}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (vertical) {
                    const chars = text.split('');
                    const step = h / (chars.length + 0.6);
                    chars.forEach((ch, idx) => {
                        ctx.fillText(ch, x + w / 2, y + step * (idx + 0.8));
                    });
                } else {
                    ctx.fillText(text, x + w / 2, y + h / 2);
                }
                ctx.restore();
            }

        const FxTextures = {
            generate(scene) {
                const make = (key, w, h, draw) => {
                    if (scene.textures.exists(key)) return;
                    const canvasTex = scene.textures.createCanvas(key, w, h);
                    draw(canvasTex.getContext(), w, h);
                    canvasTex.refresh();
                };

                // 柔光圓：霓虹、菸頭、路燈光暈
                make('fx-glow', 128, 128, (ctx, w, h) => {
                    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
                    g.addColorStop(0, 'rgba(255,255,255,1)');
                    g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
                    g.addColorStop(0.6, 'rgba(255,255,255,0.12)');
                    g.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, w, h);
                });

                // 煙霧團：幾顆柔邊圓疊出不規則的雲
                make('fx-smoke', 128, 128, (ctx, w, h) => {
                    for (let i = 0; i < 9; i++) {
                        const a = (i / 9) * Math.PI * 2;
                        const r = 18 + (i % 3) * 7;
                        const cx = w / 2 + Math.cos(a) * 16;
                        const cy = h / 2 + Math.sin(a) * 14;
                        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r + 14);
                        g.addColorStop(0, 'rgba(255,255,255,0.32)');
                        g.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.fillStyle = g;
                        ctx.fillRect(0, 0, w, h);
                    }
                });

                make('fx-rain', 4, 64, (ctx, w, h) => {
                    const g = ctx.createLinearGradient(0, 0, 0, h);
                    g.addColorStop(0, 'rgba(200,225,255,0)');
                    g.addColorStop(1, 'rgba(200,225,255,0.9)');
                    ctx.fillStyle = g;
                    ctx.fillRect(1, 0, 2, h);
                });

                make('fx-spark', 16, 16, (ctx, w, h) => {
                    const g = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
                    g.addColorStop(0, 'rgba(255,255,230,1)');
                    g.addColorStop(0.4, 'rgba(255,190,80,0.9)');
                    g.addColorStop(1, 'rgba(255,80,0,0)');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, w, h);
                });

                // 暗角（黑）與燙傷閃紅（紅）分開做，Canvas renderer 不支援 tint
                const vignette = (rgb) => (ctx, w, h) => {
                    const g = ctx.createRadialGradient(w / 2, h * 0.48, w * 0.32, w / 2, h * 0.5, h * 0.62);
                    g.addColorStop(0, `rgba(${rgb},0)`);
                    g.addColorStop(1, `rgba(${rgb},1)`);
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, w, h);
                };
                make('fx-vignette', 270, 480, vignette('0,0,0'));
                make('fx-vignette-red', 270, 480, vignette('220,20,0'));

                // 底片顆粒：黑白雜點各帶隨機透明度
                make('fx-grain', 128, 128, (ctx, w, h) => {
                    const img = ctx.createImageData(w, h);
                    for (let i = 0; i < img.data.length; i += 4) {
                        const v = Math.random() < 0.5 ? 0 : 255;
                        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
                        img.data[i + 3] = Math.random() * 90;
                    }
                    ctx.putImageData(img, 0, 0);
                });

                // 漫畫網點
                make('fx-halftone', 10, 10, (ctx) => {
                    ctx.fillStyle = 'rgba(60,40,20,0.22)';
                    ctx.beginPath();
                    ctx.arc(5, 5, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        };

        // 燙度計漸層依各菸蒂的黃金區間產生（下綠→黃金區→上紅）
        function ensureHeatTexture(scene, butt) {
            const key = `fx-heat-${butt.id}`;
            if (scene.textures.exists(key)) return key;
            const w = 40, h = 600;
            const canvasTex = scene.textures.createCanvas(key, w, h);
            const ctx = canvasTex.getContext();
            const lo = butt.sweetMin / 100;
            const hi = butt.sweetMax / 100;
            const g = ctx.createLinearGradient(0, h, 0, 0);
            g.addColorStop(0, '#15803d');
            g.addColorStop(lo - 0.08, '#65a30d');
            g.addColorStop(lo, '#facc15');
            g.addColorStop(hi, '#f59e0b');
            g.addColorStop(Math.min(1, hi + 0.04), '#f97316');
            g.addColorStop(1, '#dc2626');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(w * 0.18, 0, w * 0.14, h);
            canvasTex.refresh();
            return key;
        }

        function hexColor(str) {

        function setupView(scene) {
            scene.cameras.main.setZoom(RENDER_SCALE).centerOn(GAME_W / 2, GAME_H / 2);

        // 依原圖比例鋪滿畫面（cover），不再硬拉成 540x960
        function fitCover(img) {
            const s = Math.max(GAME_W / img.width, GAME_H / img.height);
            img.setPosition(GAME_W / 2, GAME_H / 2).setScale(s);
            img.baseScale = s;
            return img;
        }

        function addArtImage(scene, key, depth = 0) {
            return fitCover(scene.add.image(GAME_W / 2, GAME_H / 2, key).setDepth(depth));
        }

        // 以 focus 為定點慢慢推近（Ken Burns），focus 在畫面上的位置維持不動
        function kenBurns(scene, img, focus, zoom = 1.06, duration = 6000, yoyo = false) {
            scene.tweens.killTweensOf(img);
            const s = img.baseScale;
            img.setPosition(GAME_W / 2, GAME_H / 2).setScale(s);
            scene.tweens.add({
                targets: img,
                scale: s * zoom,
                x: focus.x + (GAME_W / 2 - focus.x) * zoom,
                y: focus.y + (GAME_H / 2 - focus.y) * zoom,
                duration,
                ease: 'Sine.easeInOut',
                yoyo,
                repeat: yoyo ? -1 : 0
            });
        }

        // 記錄物件在原圖上的座標，之後用 syncToArt 讓它跟著鏡頭推移
        function trackArt(obj) {
            obj.artX = obj.x;
            obj.artY = obj.y;
            obj.artScaleX = obj.scaleX;
            obj.artScaleY = obj.scaleY;
            return obj;
        }

        function syncToArt(img, objs) {
            const k = img.scale / img.baseScale;
            objs.forEach(o => {
                if (!o.active) return;
                o.x = img.x + (o.artX - GAME_W / 2) * k;
                o.y = img.y + (o.artY - GAME_H / 2) * k;
                o.setScale(o.artScaleX * k, o.artScaleY * k);
            });
        }

        // 霓虹招牌：ADD 光暈 + 偶爾接觸不良的閃爍
        function addNeonGlow(scene, signs, depth = 3) {
            const objs = [];
            (signs || []).forEach(sign => {
                const glow = scene.add.image(sign.x, sign.y, 'fx-glow')
                    .setDisplaySize(sign.w * 2.6 + 30, sign.h * 1.5 + 30)
                    .setTint(sign.color)
                    .setBlendMode(ADD)
                    .setDepth(depth);
                const dim = scene.add.rectangle(sign.x, sign.y, sign.w, sign.h, 0x000000, 1)
                    .setAlpha(0)
                    .setDepth(depth);
                const base = Phaser.Math.FloatBetween(0.32, 0.46);
                glow.setAlpha(base);

                const flicker = () => {
                    if (!glow.active) return;
                    if (Math.random() < 0.12) {
                        const steps = [[0, 0.05, 0.55], [60, base + 0.15, 0], [120, 0.08, 0.45], [190, base, 0]];
                        steps.forEach(([delay, glowAlpha, dimAlpha]) => {
                            scene.time.delayedCall(delay, () => {
                                if (!glow.active) return;
                                glow.setAlpha(glowAlpha);
                                dim.setAlpha(dimAlpha);
                            });
                        });
                    } else {
                        glow.setAlpha(base + Phaser.Math.FloatBetween(-0.06, 0.06));
                    }
                    scene.time.delayedCall(Phaser.Math.Between(140, 1100), flicker);
                };
                flicker();
                objs.push(trackArt(glow), trackArt(dim));
            });
            return objs;
        }

        function addLampGlow(scene, lamp, depth = 3) {
            if (!lamp) return [];

        // 暗角 + 底片顆粒，讓整體更接近原圖的漫畫印刷質感

        function setEmitting(emitter, on) {

        // 漫畫分格：黑色粗框 + 錯位黑影（x, y 為左上角），回傳組成的所有物件
        function drawComicPanel(scene, x, y, w, h, opts = {}) {
            const depth = opts.depth ?? 20;
            const shadow = opts.shadow ?? 6;
            const parts = [];
            const g = scene.add.graphics().setDepth(depth);
            if (shadow) {
                g.fillStyle(0x000000, 0.85);
                g.fillRect(x + shadow, y + shadow, w, h);
            }
            g.fillStyle(opts.fill ?? 0x0d1017, opts.alpha ?? 0.92);
            g.fillRect(x, y, w, h);
            parts.push(g);
            if (opts.halftone) {
                parts.push(scene.add.tileSprite(x + w / 2, y + h / 2, w, h, 'fx-halftone')
                    .setTileScale(0.6)
                    .setAlpha(0.7)
                    .setDepth(depth));
            }
            const frame = scene.add.graphics().setDepth(depth);
            frame.lineStyle(opts.border ?? 3, 0x000000, 1);
            frame.strokeRect(x, y, w, h);
            if (opts.accent !== undefined) {
                frame.lineStyle(1.5, opts.accent, opts.accentAlpha ?? 0.9);
                frame.strokeRect(x + 5, y + 5, w - 10, h - 10);
            }
            parts.push(frame);
            return parts;
        }

        // 色塊標籤（章節名、副標題）
        function addTagLabel(scene, x, y, label, opts = {}) {

        function createComicButton(scene, x, y, w, h, label, opts = {}) {
            const shadow = opts.shadow ?? 6;
            const g = scene.add.graphics();
            g.fillStyle(0x000000, 0.9);

            g.strokeRect(-w / 2, -h / 2, w, h);

                fontFamily: FONT_UI,
                fontSize: opts.fontSize ?? '22px',

            }).setOrigin(0.5);

        // 中文沒有空白可斷行，依實際字寬手動換行
        function wrapCJK(text, font, maxWidth) {
            const ctx = wrapCJK.ctx || (wrapCJK.ctx = document.createElement('canvas').getContext('2d'));
            ctx.font = font;
            return text.split('\n').map(para => {
                const lines = [];
                let line = '';
                for (const ch of para) {
                    if (line && ctx.measureText(line + ch).width > maxWidth) {
                        lines.push(line);
                        line = ch;
                    } else {
                        line += ch;
                    }
                }
                lines.push(line);
                return lines.join('\n');
            }).join('\n');
        }

        // 台語罵聲在「！」處斷成兩行（取兩行長度最平均的位置），讓爆炸框可以窄一點
        function splitShout(line) {
            const chars = Array.from(line);
            let best = line;
            let bestMax = chars.length;
            chars.forEach((ch, i) => {
                if (ch !== '！' || i === chars.length - 1) return;
                const longest = Math.max(i + 1, chars.length - i - 1);
                if (longest < bestMax) {
                    bestMax = longest;
                    best = `${chars.slice(0, i + 1).join('')}\n${chars.slice(i + 1).join('')}`;
                }
            });
            return best;
        }

        // 燙到時的漫畫爆炸對話框，tail 指向嘴巴
        function drawShoutBurst(g, w, h, tail) {
            const spikes = 16;
            const pts = [];
            for (let i = 0; i < spikes * 2; i++) {
                const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                const r = i % 2 === 0 ? 1 + ((i * 7) % 5) * 0.025 : 0.8;
                pts.push({ x: Math.cos(a) * (w / 2) * r, y: Math.sin(a) * (h / 2) * r });
            }
            const tailPts = [
                { x: tail.baseX - 24, y: tail.baseY },
                { x: tail.baseX + 24, y: tail.baseY },
                { x: tail.x, y: tail.y }
            ];
            const offset = (list, d) => list.map(p => ({ x: p.x + d, y: p.y + d }));
            g.fillStyle(0x000000, 0.85);
            g.fillPoints(offset(tailPts, 6), true);
            g.fillPoints(offset(pts, 7), true);
            g.fillStyle(0xffffff, 1);
            g.fillPoints(tailPts, true);
            g.lineStyle(4, 0x000000, 1);
            g.strokePoints(tailPts, true, true);
            g.fillStyle(0xffffff, 1);
            g.fillPoints(pts, true);
            g.fillStyle(0xfde047, 1);
            g.fillPoints(pts.map(p => ({ x: p.x * 0.82, y: p.y * 0.82 })), true);
            g.fillStyle(0xffffff, 1);
            g.fillEllipse(0, 0, w * 0.74, h * 0.62);
            g.lineStyle(4, 0x000000, 1);
            g.strokePoints(pts, true, true);
        }

        function loadEmbeddedArt(scene) {
            const art = window.STREET_COMIC_ART || {};
            const keys = Object.keys(art).filter(key => !scene.textures.exists(key));
            return Promise.all(keys.map(key => new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    if (!scene.textures.exists(key)) scene.textures.addImage(key, img);
                    resolve();
                };
                img.onerror = () => resolve();
                img.src = art[key];
            })));
        }

        // 先載入網頁字型再建立文字，避免 Canvas 文字先用系統字型畫好就定型
        function loadWebFonts() {
            if (!document.fonts || !document.fonts.load) return Promise.resolve();
            const sample = [
                '街友本色煙屁股大作戰阿睿的巷弄菸屁股生存戰台灣街頭寫實黑色幽默大作點擊進入遊戲跳過劇情繼續挑選',
                '剩餘時間總分菸蒂長度燙度黃金過癮區壓住此處不放抽煙太燙前要適時放開最終得分結算',
                ...CIGARETTE_BUTTS.map(b => b.name + b.desc + b.difficultyLabel)
            ].join('');
            const jobs = [
                ...[400, 700, 900].flatMap(weight => [
                    document.fonts.load(`${weight} 20px "Noto Serif TC"`, sample),
                    document.fonts.load(`${weight} 20px "Noto Serif"`, 'True Hobo I: Butt Brawl Combo 0123456789.s%x()|+-')
                ])
            ].map(p => p.catch(() => { }));
            return Promise.race([Promise.all(jobs), new Promise(resolve => setTimeout(resolve, 3000))]);
        }

                this.input.on('pointerdown', () => {
                    if (this.typing) {
                        this.finishTyping();

                    }

                    if (this.currentSlideIndex < this.slides.length) {
                        this.showSlide(this.currentSlideIndex);

            showSlide(idx) {
                const s = this.slides[idx];

                // 新圖放上層淡入，舊圖留在下層
                const incoming = this.bgBack;
                this.bgBack = this.bgFront;
                this.bgFront = incoming;
                incoming.setTexture(s.img);
                fitCover(incoming);
                incoming.setDepth(1).setAlpha(idx === 0 ? 1 : 0);
                this.bgBack.setDepth(0);
                kenBurns(this, incoming, s.focus, 1.07, 7000);
                if (idx > 0) {
                    this.tweens.add({ targets: incoming, alpha: 1, duration: 450 });
                }

                // 該分鏡的霓虹 / 路燈 / 鐵盤閃光
                this.slideFx.forEach(o => o.destroy());
                const fx = ART_FX[s.img] || {};
                this.slideFx = [...addNeonGlow(this, fx.neon, 3), ...addLampGlow(this, fx.lamp, 3)];
                if (s.img === 'img0') {
                    const ember = ART_FX.img0.ember;
                    const glow = this.add.image(ember.x, ember.y, 'fx-glow').setTint(0xff6a1a).setBlendMode(ADD).setScale(0.3).setAlpha(0.6).setDepth(4);
                    this.tweens.add({ targets: glow, alpha: 0.3, duration: 800, yoyo: true, repeat: -1 });
                    this.slideFx.push(trackArt(glow));
                }
                if (fx.treasure) {
                    const glow = this.add.image(fx.treasure.x, fx.treasure.y, 'fx-glow')
                        .setTint(0xffc46b).setBlendMode(ADD).setDisplaySize(260, 90).setAlpha(0.15).setDepth(4);
                    this.tweens.add({ targets: glow, alpha: 0.45, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
                    const glints = this.add.particles(fx.treasure.x, fx.treasure.y, 'fx-spark', {
                        x: { min: -55, max: 55 },
                        y: { min: -18, max: 14 },
                        scale: { start: 0.6, end: 0 },
                        alpha: { start: 1, end: 0 },
                        lifespan: 520,
                        frequency: 170,
                        tint: 0xfff1b0,
                        blendMode: ADD
                    }).setDepth(5);
                    this.slideFx.push(trackArt(glow), trackArt(glints));
                }

                // 章節標籤
                if (this.chapterTag) this.chapterTag.destroy();
                this.chapterTag = addTagLabel(this, 0, this.boxY, s.title, { fontSize: '15px', angle: -2, depth: 23 });
                this.chapterTag.x = this.boxX + 14 + this.chapterTag.boxW / 2;

                this.progressDots.forEach((dot, i) => dot.setFillStyle(i === idx ? 0xb91c1c : 0xd6cdb4, 1));
                this.nextPrompt.setText(idx === this.slides.length - 1 ? '點擊挑選菸屁股 ▶' : '點擊繼續 ▶');
                this.typeText(s.text);
            }

            typeText(fullText) {
                if (this.typeTimer) this.typeTimer.remove();
                this.fullText = fullText;
                this.typedLen = 0;
                this.typing = true;
                this.storyTxt.setText('');
                this.nextPrompt.setVisible(false);
                this.typeTimer = this.time.addEvent({
                    delay: 32,
                    loop: true,
                    callback: () => {
                        this.typedLen++;
                        this.storyTxt.setText(this.fullText.slice(0, this.typedLen));
                        if (this.typedLen >= this.fullText.length) this.finishTyping();
                    }
                });
            }

            finishTyping() {
                if (this.typeTimer) {
                    this.typeTimer.remove();
                    this.typeTimer = null;
                }
                this.storyTxt.setText(this.fullText);
                this.typing = false;
                this.nextPrompt.setVisible(true);
            }

            update() {
                syncToArt(this.bgFront, this.slideFx);
            }
        }

        // ----------------------------------------------------------------------------

                    const a1 = a0 + (Math.PI * 2 / seg) * 0.6;
                    g.lineStyle(8, 0x000000, 0.7);
                    g.beginPath();
                    g.arc(0, 0, r, a0, a1);
                    g.strokePath();
                    g.lineStyle(4, color, 0.95);
                    g.beginPath();
                    g.arc(0, 0, r, a0, a1);

            createGauges(W, H, butt) {

            checkPointerHold(pointer, isInitialDown) {
                if (this.isGameOver || this.isBurnStunned) return;

                // 攝影機有放大，要換算回 540x960 的世界座標
                const p = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
                const dist = Phaser.Math.Distance.Between(p.x, p.y, this.holdCenterX, this.holdCenterY);
                if (dist <= this.holdRadius * 1.15) {
                    if (!this.isInhaling) {
                        this.isInhaling = true;
                        if (isInitialDown) {
                            audioEngine.init();
                        }
                    }
                } else {
                    // Dragged finger/cursor outside the same position -> stop inhaling
                    this.stopInhaling();
                }
            }

            stopInhaling() {
                if (this.isInhaling && this.inhaleDuration > 0.35 && !this.isGameOver) {
                    // 放開時從嘴角吐出一口煙，吸越久煙越多
                    this.exhaleSmoke.explode(Math.min(24, Math.round(8 + this.inhaleDuration * 6)));
                }
                this.isInhaling = false;
                this.inhaleDuration = 0;
                audioEngine.setInhaleSound(false);
            }

            triggerBurnPenalty() {
                const butt = GAME_STATE.selectedButt;
                this.isInhaling = false;
                this.inhaleDuration = 0;
                this.isBurnStunned = true;
                this.burnCount++;
                this.combo = 0;
                this.score = Math.max(0, this.score - butt.burnPenalty);
                audioEngine.setInhaleSound(false);

                // Play authentic Taiwanese Hokkien burn voice ("啊娘喂！燒啦！")
                const spokenLine = audioEngine.playTaiwaneseBurnVoice();

                // Screen shake、紅色閃光、火星四濺、嗆出一口煙
                this.cameras.main.shake(380, 0.024);
                this.damageFlash.setAlpha(0.3);
                this.redVignette.setAlpha(1);
                this.tweens.add({ targets: this.damageFlash, alpha: 0, duration: 380 });
                this.tweens.add({ targets: this.redVignette, alpha: 0, duration: 900, ease: 'Quad.easeIn' });
                this.sparks.explode(26);
                this.exhaleSmoke.explode(10);

                // 硬切到燙傷反應圖，帶一點放大的衝擊感
                if (this.imgBurn) {
                    const s = this.imgBurn.baseScale;
                    this.tweens.killTweensOf(this.imgBurn);
                    this.imgBurn.setAlpha(1).setScale(s * 1.06);
                    this.tweens.add({ targets: this.imgBurn, scale: s, duration: 260, ease: 'Back.easeOut' });
                    // 冷卻 1.25 秒結束前淡回原圖
                    this.time.delayedCall(980, () => {
                        this.tweens.add({ targets: this.imgBurn, alpha: 0, duration: 240 });
                    });
                }

                // 爆炸對話框
                this.sbText.setText(`🔥 ${splitShout(spokenLine)}`);
                this.sbSub.setText(`（燙到手跟嘴唇 -${butt.burnPenalty} 分）`);
                this.tweens.killTweensOf(this.burst);
                this.burst.setAlpha(1).setScale(0.5).setAngle(-8);
                this.tweens.add({
                    targets: this.burst,
                    scale: 1,
                    angle: 0,
                    duration: 220,
                    ease: 'Back.easeOut',
                    onComplete: () => {
                        this.tweens.add({
                            targets: this.burst,
                            alpha: 0,
                            delay: 1150,
                            duration: 300
                        });
                    }
                });

                this.spawnFloatingText(this.holdCenterX, this.holdCenterY - 50, `💥 燒燙燙！-${butt.burnPenalty}`, '#ef4444');

                // Force 1.25s cooldown where Ah-Rui shakes his burned hand
                this.time.delayedCall(1250, () => {
                    this.isBurnStunned = false;
                    this.heat = Math.min(this.heat, 55);
                });
            }

            spawnFloatingText(x, y, msg, color = '#fde047') {
                const txt = this.add.text(x, y, msg, {
                    fontFamily: FONT_UI,
                    fontSize: '19px',
                    fontStyle: '900',
                    color: color,
                    stroke: '#000000',
                    strokeThickness: 5
                }).setOrigin(0.5).setDepth(35).setScale(0.7);

                this.tweens.add({ targets: txt, scale: 1, duration: 120, ease: 'Back.easeOut' });
                this.tweens.add({
                    targets: txt,
                    y: y - 55,
                    alpha: 0,
                    duration: 750,
                    onComplete: () => txt.destroy()
                });
            }

            update(time, delta) {
                if (this.isGameOver) return;
                const dt = delta / 1000;
                const butt = GAME_STATE.selectedButt;
                const W = GAME_W;

                // 1. Update 60-Second Countdown
                this.timeLeft = Math.max(0, this.timeLeft - dt);
                this.timerTxt.setText(`${this.timeLeft.toFixed(1)}s`);
                if (this.timeLeft <= 10) {
                    this.timerTxt.setColor('#ef4444');
                }

                // Shrink visual cigarette butt paper over the 60 seconds
                const paperW = Math.max(8, (this.timeLeft / 60) * 150);
                this.cigBarPaper.width = paperW;
                this.cigBarEmber.x = this.cigBarX + paperW;
                this.cigBarGlow.x = this.cigBarEmber.x;

                if (this.timeLeft <= 0) {
                    this.finishGame();
                    return;
                }

                // 2. Handle Inhaling vs Releasing Physics
                const inhalingNow = this.isInhaling && !this.isBurnStunned;
                let deprived = false;
                if (inhalingNow) {
                    this.idleTime = 0;
                    this.inhaleDuration += dt;

                    // Increase heat (higher quality butts heat up faster + slight ember turbulence)
                    const jitter = 1 + Math.sin(time * 0.015) * 0.15;
                    this.heat = Math.min(100, this.heat + butt.heatRate * jitter * dt);

                    // Switch visual to 6.jpg (glowing ember)
                    this.imgInhale.setAlpha(Phaser.Math.Linear(this.imgInhale.alpha, 1, 0.22));
                    const heatRatio = this.heat / 100;
                    const flick = 0.85 + Math.random() * 0.15;
                    this.emberCore.setAlpha((0.55 + heatRatio * 0.45) * flick).setScale(0.2 + heatRatio * 0.12);
                    this.emberHalo.setAlpha((0.35 + heatRatio * 0.4) * flick).setScale(0.6 + heatRatio * 0.7);
                    setEmitting(this.inhaleSmoke, true);
                    setEmitting(this.sparks, true);

                    audioEngine.setInhaleSound(true, heatRatio);

                    // Continuous Carrying / Inhaling Score Gain (一直有攜帶/吸食就會加分)
                    const inSweetSpot = (this.heat >= butt.sweetMin && this.heat <= butt.sweetMax);
                    const zoneBonus = inSweetSpot ? 2.5 : 1.0;
                    if (inSweetSpot) {
                        this.goldenTime += dt;
                    }

                    this.combo += dt * 4;
                    if (Math.floor(this.combo) > this.maxCombo) {
                        this.maxCombo = Math.floor(this.combo);
                    }
                    const comboMult = 1 + Math.min(2.0, Math.floor(this.combo) * 0.05);
                    const pointsEarned = 42 * butt.scoreMultiplier * zoneBonus * comboMult * dt;
                    this.score += pointsEarned;

                    // Occasional floating feedback in Golden Sweet Spot
                    if (inSweetSpot && Math.random() < 0.08) {
                        this.spawnFloatingText(
                            this.emberX + Phaser.Math.Between(-30, 30),
                            this.emberY - 30,
                            `過癮！+${Math.round(pointsEarned * 8)}`,
                            '#fbbf24'
                        );
                    }

                    this.statusTxt.setText(
                        inSweetSpot
                            ? '🔥 黃金過癮區！分數 2.5 倍狂飆中！(注意別破百燙傷)'
                            : '💨 正在猛吸菸屁股… 持續加分中！'
                    );
                    this.statusTxt.setColor(inSweetSpot ? '#fde047' : '#86efac');

                    // Check if Heat hit 100% -> BURN!
                    if (this.heat >= 100) {
                        this.triggerBurnPenalty();
                    }
                } else {
                    // Not Inhaling -> Cool down ember & switch back to 5.jpg
                    this.heat = Math.max(0, this.heat - butt.coolRate * dt);
                    this.imgInhale.setAlpha(Phaser.Math.Linear(this.imgInhale.alpha, 0, 0.18));
                    // 沒在吸：菸頭只剩微弱餘燼
                    this.emberCore.setAlpha(0);
                    this.emberHalo.setAlpha(0.1 + Math.sin(time * 0.004) * 0.04).setScale(0.45);
                    setEmitting(this.inhaleSmoke, false);
                    setEmitting(this.sparks, false);

                    if (!this.isBurnStunned) {
                        this.idleTime += dt;
                        // Nicotine Deprivation Penalty (太久沒吸到煙也會扣分: threshold 2.0 seconds)
                        const maxSafeIdle = 2.0;
                        const craveRatio = Math.min(1, this.idleTime / maxSafeIdle);
                        this.cravingBar.width = craveRatio * (W - 44);

                        if (this.idleTime >= maxSafeIdle) {
                            deprived = true;
                            this.combo = 0;
                            const penaltyRate = 35 * butt.scoreMultiplier;
                            this.score = Math.max(0, this.score - penaltyRate * dt);
                            this.statusTxt.setText('⚠️ 太久沒吸到煙！菸癮發作空虛扣分中！快壓住抽菸！');
                            this.statusTxt.setColor('#fca5a5');

                            this.depriveTicks += dt;
                            if (this.depriveTicks >= 0.9) {
                                this.depriveTicks = 0;
                                audioEngine.playCoughWarning();
                                this.spawnFloatingText(this.holdCenterX, this.holdCenterY, '💨 太久沒吸扣分！', '#f87171');
                            }
                        } else {
                            this.statusTxt.setText('👆 壓住中央圈圈不放抽煙屁股 (超過 2 秒沒吸會扣分)');
                            this.statusTxt.setColor('#e7e5e4');
                        }
                    } else {
                        this.statusTxt.setText('🥵 燙傷甩手冷卻中… 啊娘喂好燙！');
                        this.statusTxt.setColor('#f87171');
                    }
                }

                if (this.isInhaling) {
                    this.cravingBar.width = 0;
                }
                this.craveVignette.setAlpha(deprived
                    ? 0.24 + Math.sin(time * 0.008) * 0.1
                    : Phaser.Math.Linear(this.craveVignette.alpha, 0, 0.1));

                // 壓按圈顏色跟著溫度區間變化
                let ringColor = 0xfbbf24;
                if (this.isBurnStunned) {
                    ringColor = 0xef4444;
                } else if (inhalingNow) {
                    ringColor = this.heat >= 88 ? 0xef4444 : (this.heat >= butt.sweetMin ? 0xfde047 : 0x4ade80);
                }
                if (ringColor !== this.holdRingColor) this.drawHoldRing(ringColor);
                this.holdZone.setScale(Phaser.Math.Linear(this.holdZone.scaleX, inhalingNow ? 0.93 : 1, 0.2));
                this.holdLabel.setAlpha(Phaser.Math.Linear(this.holdLabel.alpha, inhalingNow ? 0.35 : 1, 0.15));

                // 3. Update Right Heat Gauge Visuals
                const fillH = Math.max(2, (this.heat / 100) * this.gaugeH);
                const texW = this.heatFill.frame.width;
                const texH = this.heatFill.frame.height;
                const cropH = (texH * fillH) / this.gaugeH;
                this.heatFill.setCrop(0, texH - cropH, texW, cropH);
                this.heatMarker.y = this.gaugeY + this.gaugeH / 2 - fillH;
                this.heatPctTxt.setText(`${Math.round(this.heat)}%`);
                this.heatPctTxt.setColor(this.heat >= 88 ? '#f87171' : '#ffffff');
                this.gaugeDanger.setAlpha(this.heat >= 88 ? 0.4 + Math.sin(time * 0.025) * 0.25 : 0);

                // 4. Update Score & Combo Text
                this.scoreTxt.setText(`${Math.floor(this.score)}`);
                this.comboTxt.setText(this.combo >= 2 ? `🔥 連吸 Combo x${Math.floor(this.combo)}` : '');
            }

            finishGame() {
                this.isGameOver = true;
                audioEngine.setInhaleSound(false);

                GAME_STATE.lastResult = {
                    score: Math.floor(this.score),
                    butt: GAME_STATE.selectedButt,
                    burnCount: this.burnCount,
                    maxCombo: this.maxCombo,
                    goldenTime: this.goldenTime.toFixed(1)
                };

                this.cameras.main.fadeOut(500, 0, 0, 0);
                this.time.delayedCall(520, () => {
                    this.scene.start('ResultScene');
                });
            }
        }

                type: Phaser.AUTO,
                parent: 'phaser-container',
                width: GAME_W * RENDER_SCALE,
                height: GAME_H * RENDER_SCALE,
                backgroundColor: '#080a0f',
                // 手機長壓抽菸時不要跳出系統長按選單（電腦版右鍵也一併關閉）
                disableContextMenu: true,
                scale: {
                    mode: Phaser.Scale.FIT,
                    autoCenter: Phaser.Scale.CENTER_BOTH
                },
                scene: [BootScene, CoverScene, StoryScene, SelectButtScene, PlayScene, ResultScene]
            };

            phaserGame = new Phaser.Game(config);

            // Bind Mute / Unmute Button
            const btnMute = document.getElementById('btn-mute');
            const muteIcon = document.getElementById('mute-icon');
            btnMute.addEventListener('click', () => {
                audioEngine.startContinuousBGM();
                const muted = audioEngine.toggleMute();
                muteIcon.textContent = muted ? '🔇' : '🔊';
            });

            // Bind Custom Asset Loader Modal (Allows user to drop their 0.jpg~6.jpg & video file directly)
            const modal = document.getElementById('asset-modal');
            const btnOpenAssets = document.getElementById('btn-open-assets');
            const btnCloseAssets = document.getElementById('btn-close-assets');
            const btnConfirmAssets = document.getElementById('btn-confirm-assets');
            const fileInput = document.getElementById('file-input-assets');
            const statusList = document.getElementById('asset-status-list');

            // 「載入原圖/影片」按鈕與彈窗已從頁面移除時，就不綁定以下功能
            if (!modal || !btnOpenAssets) return;

            btnOpenAssets.addEventListener('click', () => {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            });

            const closeModal = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            };
            btnCloseAssets.addEventListener('click', closeModal);
            btnConfirmAssets.addEventListener('click', closeModal);

            fileInput.addEventListener('change', (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;

                statusList.innerHTML = '';
                files.forEach((file) => {
                    const url = URL.createObjectURL(file);
                    const nameLower = file.name.toLowerCase();

                    if (file.type.startsWith('video/') || nameLower.endsWith('.mp4') || nameLower.endsWith('.webm')) {
                        const videoEl = document.getElementById('cover-video-layer');
                        videoEl.src = url;
                        videoEl.muted = audioEngine.isMuted;
                        videoEl.play().catch(() => { });
                        GAME_STATE.customVideoLoaded = true;
                        audioEngine.hasCustomVideoAudio = true;

                        // If currently on CoverScene, show the video overlay immediately
                        const coverScene = phaserGame.scene.getScene('CoverScene');
                        if (coverScene && coverScene.scene.isActive()) {
                            coverScene.syncVideoOverlay(true);
                        }
                        const log = document.createElement('div');
                        log.className = 'text-amber-300 font-bold';
                        log.textContent = `🎬 已載入封面影片與持續音樂：${file.name}`;
                        statusList.appendChild(log);
                    } else if (file.type.startsWith('image/')) {
                        // Match 0.jpg ~ 7.jpg by digit in filename（7 = 燙到的反應圖）
                        const match = nameLower.match(/([0-7])/);
                        if (match) {
                            const idx = match[1];
                            const texKey = `img${idx}`;
                            const img = new Image();
                            img.onload = () => {
                                if (phaserGame.textures.exists(texKey)) {
                                    phaserGame.textures.remove(texKey);
                                }
                                phaserGame.textures.addImage(texKey, img);
                            };
                            img.src = url;
                            const log = document.createElement('div');
                            log.className = 'text-emerald-400';
                            log.textContent = `🖼️ 已替換場景圖片 ${idx}.jpg ➔ ${file.name}`;
                            statusList.appendChild(log);
                        }
                    }
                });
            });
        };
    </script>

    <!-- game：底部小橫幅廣告（320×50）。寬螢幕放左下角、窄螢幕放正下方並讓出空間，都與遊戲保持 150px 以上距離；沒有廣告可放時自動收起 -->
    <div id="ad-bar">
        <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px"
            data-ad-client="ca-pub-9815906908978353" data-ad-slot="6817299480"></ins>
    </div>
    <script>
        // Google 強烈建議遊戲頁的廣告離遊戲至少 150px，避免誤觸被判定為無效流量
        const AD_W = 320;
        const AD_H = 50;
        const AD_MARGIN = 8;
        const AD_GAP = 150;

        function layoutAdBar() {
            const body = document.body;
            let reserve = 0;
            if (!body.classList.contains('ad-hidden')) {
                // 遊戲全高顯示時的畫布寬度（9:16）；兩側空白放得下廣告 + 150px 就移到左下角，遊戲不用縮小
                const canvasW = Math.min(window.innerWidth, window.innerHeight * 9 / 16);
                const corner = (window.innerWidth - canvasW) / 2 >= 16 + AD_W + AD_GAP;
                body.classList.toggle('ad-corner', corner);
                if (!corner) reserve = AD_H + AD_MARGIN + AD_GAP;
            }
            document.documentElement.style.setProperty('--ad-reserve', `${reserve}px`);
            if (phaserGame) {
                phaserGame.scale.getParentBounds();
                phaserGame.scale.refresh();
            }
        }

        function hideAdBar() {
            document.body.classList.add('ad-hidden');
            layoutAdBar();
        }

        layoutAdBar();
        window.addEventListener('resize', layoutAdBar);

        // 沒有廣告可投放（例如網站尚未通過 AdSense 審核）時收起，把空間還給遊戲
        const adSlot = document.querySelector('#ad-bar .adsbygoogle');
        new MutationObserver(() => {
            if (adSlot.getAttribute('data-ad-status') === 'unfilled') hideAdBar();
        }).observe(adSlot, { attributes: true, attributeFilter: ['data-ad-status'] });
