    <!-- ===== 內部版本號 =====
         每次更新遊戲（JS、CSS、圖片、音檔、影片有任何變動）就把 APP_VERSION 改成新的號碼。
         所有檔案的網址都會帶上 ?v=版本號，號碼一變就是新網址，玩家的瀏覽器和 GitHub Pages 的 CDN 都會重新下載；
         玩家拿到舊的 index.html 時，js/main.js 的 checkForNewVersion() 會發現並自動換成新版。 -->
    <script>
        window.APP_VERSION = '1.0.0';

        // 網址加上 ?v=版本號（雙擊開檔 file:// 時不加：本機檔案不會被快取，加了反而可能讀不到）
        window.withVersion = function (url) {
            if (location.protocol === 'file:') return url;
            return url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + encodeURIComponent(window.APP_VERSION);
        };

        // 依序載入帶版本號的 CSS / JS（用 document.write 才會跟寫死的 <link>、<script> 一樣同步、照順序載入）
        window.loadVersioned = function (urls) {
            urls.forEach(function (url) {
                var src = window.withVersion(url);
                document.write(/\.css$/.test(url)
                    ? '<link rel="stylesheet" href="' + src + '">'
                    : '<script src="' + src + '"><\/script>');
            });
        };

        loadVersioned(['./css/style.css']);
    </script>
