<body>

    <div id="game-wrapper">
        <!-- Phaser Game Canvas Mount -->
        <div id="phaser-container"></div>

        <!-- 右上角音樂開關 -->
        <div id="top-bar">
            <button id="btn-mute">
                <span id="mute-icon">🔊</span> <span id="mute-text">街頭搖滾 BGM</span>
            </button>

        </div>

    </div>

    <script>
        /**
         * ============================================================================
         * 1. CONTINUOUS ROCK & STREET AMBIENT SOUND ENGINE + TAIWANESE HOKKIEN VOICE
         * ============================================================================
         * Ensures music starts on the Cover Screen and NEVER stops or resets when
         * transitioning into the story and gameplay. Also handles authentic Taiwanese
         * Hokkien (台語) burn voice exclamations + sizzle/inhale sound effects.
         */
        class StreetAudioEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.isPlayingBGM = false;
                // 封面影片自帶點菸聲 + 搖滾樂，封面期間先讓合成搖滾停下，離開封面再接手
                this.duckBGM = false;
                this.bgmStep = 0;
                this.bgmTimer = null;
                this.inhaleNode = null;
                this.inhaleGain = null;
                this.rainGain = null;

                // Taiwanese Hokkien Burn Lines (台式閩南語燙傷語音台詞)
                // audio：真人配音檔（放在根目錄，念的內容要跟 text 一樣；text 是畫面上的字幕）；
                // 有任何一個音檔載得到，就只從有音檔的台詞裡挑；全部沒有才用瀏覽器男聲念 tts（華語諧音），pitch 壓低讓聲音粗一點
                this.taiwaneseBurnLines = [
                    { text: "啊娘喂！燒啦！燙死林北啦！", tts: "啊娘喂！休啦！燙死林北啦！", pitch: 0.8, rate: 1.25, audio: './audio01.mp3' },
                    { text: "靠北喔！燒燙燙！嘴唇起水泡啦！", tts: "靠北喔！休燙燙！嘴唇起水泡啦！", pitch: 0.75, rate: 1.3, audio: './audio02.mp3' },
                    { text: "夭壽骨喔！燒到手指頭啦！痛死！", tts: "夭壽骨喔！休到手指頭啦！痛死！", pitch: 0.85, rate: 1.28, audio: './audio03.mp3' },
                    { text: "林老師咧！這支菸頭有夠燒！", tts: "林老師咧！這支菸頭有夠休！", pitch: 0.7, rate: 1.25 },
                    { text: "哎喲喂呀！燒到嘴角臭火乾啦！", tts: "哎喲喂呀！休到嘴角臭火搭啦！", pitch: 0.78, rate: 1.22 }
                ];
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    // 配音檔要有 AudioContext 才能解碼
                    VoiceClips.decodeAll();
                    // 先叫一次讓 Chrome 開始載入語音清單（第一次常回空陣列，第一次燙嘴就挑不到男聲）
                    if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 燙嘴台詞的瀏覽器語音：男聲由低沉到一般排序，Apple 的 Rocko → Grandpa → Reed → Eddy（Mac、iPhone），
            // 微軟的 YunJhe、Zhiwei（Windows）；都沒有才退回其他台灣中文語音（多半是女聲，例如 Chrome 的 Google 國語、Mac 的美佳）
            pickBurnVoice() {
                const voices = window.speechSynthesis.getVoices();
                const twVoices = voices.filter(v => /^zh[-_]TW$/i.test(v.lang));
                for (const name of ['Rocko', 'Grandpa', 'Reed', 'Eddy', 'YunJhe', 'Zhiwei']) {
                    const male = twVoices.find(v => v.name.includes(name));
                    if (male) return male;
                }
                return voices.find(v => v.lang.includes('TW') || v.name.includes('Taiwan') || v.name.includes('Meijia') || v.name.includes('Hsiao')) || null;
            }

            startContinuousBGM() {
                this.init();
                if (this.isPlayingBGM) return;
                this.isPlayingBGM = true;

                // Start continuous subtle night street rain / neon hum ambience
                this.startRainAmbience();

                // Grunge / Taiwanese Street Rock Guitar & Bass Riff Sequencer (matches the cover video's gritty rock riff)
                // Riff pattern in E minor pentatonic (E2, G2, A2, Bb2, A2, G2, E2)
                const riffNotes = [
                    { freq: 82.41, dur: 0.22, accent: true },   // E2
                    { freq: 82.41, dur: 0.18, accent: false },  // E2
                    { freq: 98.00, dur: 0.24, accent: true },   // G2
                    { freq: 110.00, dur: 0.24, accent: true },  // A2
                    { freq: 116.54, dur: 0.20, accent: true },  // Bb2 (blues gritty flat 5)
                    { freq: 110.00, dur: 0.22, accent: false }, // A2
                    { freq: 98.00, dur: 0.24, accent: true },   // G2
                    { freq: 82.41, dur: 0.32, accent: true },   // E2
                    { freq: 82.41, dur: 0.18, accent: false },  // E2
                    { freq: 110.00, dur: 0.24, accent: true },  // A2
                    { freq: 123.47, dur: 0.25, accent: true },  // B2
                    { freq: 116.54, dur: 0.20, accent: true },  // Bb2
                    { freq: 110.00, dur: 0.22, accent: false }, // A2
                    { freq: 98.00, dur: 0.22, accent: true },   // G2
                    { freq: 73.42, dur: 0.25, accent: true },   // D2
                    { freq: 82.41, dur: 0.35, accent: true }    // E2
                ];

                const stepIntervalMs = 240; // 125 BPM eighth-note rock groove
                this.bgmTimer = setInterval(() => {
                    if (this.isMuted || !this.ctx || this.duckBGM) return;
                    const masterVol = 0.18;

                    const step = riffNotes[this.bgmStep % riffNotes.length];
                    this.playGrungeGuitarNote(step.freq, step.dur, step.accent, masterVol);
                    if (this.bgmStep % 2 === 0) {
                        this.playDrumKickOrSnare((this.bgmStep % 4 === 2) ? 'snare' : 'kick', masterVol * 1.1);
                    }
                    this.bgmStep++;
                }, stepIntervalMs);
            }

            startRainAmbience() {
                if (!this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 2;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = noiseBuffer;
                    whiteNoise.loop = true;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 950;
                    filter.Q.value = 0.7;

                    this.rainGain = this.ctx.createGain();
                    this.rainGain.gain.value = this.isMuted ? 0 : 0.025;

                    whiteNoise.connect(filter);
                    filter.connect(this.rainGain);
                    this.rainGain.connect(this.ctx.destination);
                    whiteNoise.start(0);
                } catch (e) { }
            }

            playGrungeGuitarNote(freq, duration, accent, maxGain = 0.18) {
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;

                // Root + Fifth power chord oscillators
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                osc1.type = 'sawtooth';
                osc2.type = 'square';
                osc1.frequency.setValueAtTime(freq, now);
                osc2.frequency.setValueAtTime(freq * 1.498, now); // Power fifth

                // Overdrive waveshaper
                const shaper = this.ctx.createWaveShaper();
                const curve = new Float32Array(256);
                for (let i = 0; i < 256; i++) {
                    const x = (i * 2) / 256 - 1;
                    curve[i] = Math.tanh(x * (accent ? 6.5 : 4.0));
                }
                shaper.curve = curve;

                // Cabinet lowpass filter
                const cabFilter = this.ctx.createBiquadFilter();
                cabFilter.type = 'lowpass';
                cabFilter.frequency.setValueAtTime(accent ? 1850 : 1300, now);

                const gain = this.ctx.createGain();
                const peak = accent ? maxGain : maxGain * 0.7;
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(peak, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc1.connect(shaper);
                osc2.connect(shaper);
                shaper.connect(cabFilter);
                cabFilter.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration + 0.02);
                osc2.stop(now + duration + 0.02);
            }

            playDrumKickOrSnare(type, vol = 0.18) {
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;
                if (type === 'kick') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(36, now + 0.12);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else {
                    // Snare burst
                    const bufSize = this.ctx.sampleRate * 0.1;
                    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.4));
                    const src = this.ctx.createBufferSource();
                    src.buffer = buf;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 400;
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(vol * 0.65, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    src.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    src.start(now);
                }
            }

            // Lighter flint strike sound ("chk-chk-fwoosh")
            playLighterFlick() {
                this.init();
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;
                const bufSize = this.ctx.sampleRate * 0.35;
                const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) {
                    const env = i < bufSize * 0.15 ? 1.0 : Math.exp(-(i - bufSize * 0.15) / (bufSize * 0.3));
                    data[i] = (Math.random() * 2 - 1) * env;
                }
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(3200, now);
                filter.frequency.exponentialRampToValueAtTime(800, now + 0.32);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                src.start(now);
            }

            // Continuous tobacco crackling sound while holding/inhaling
            setInhaleSound(isInhaling, heatRatio = 0.5) {
                this.init();
                if (!this.ctx || this.isMuted) {
                    if (this.inhaleGain) this.inhaleGain.gain.value = 0;
                    return;
                }
                if (isInhaling) {
                    if (!this.inhaleNode) {
                        const bufSize = this.ctx.sampleRate * 1.5;
                        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                        const data = buf.getChannelData(0);
                        for (let i = 0; i < bufSize; i++) {
                            // Crackling tobacco pop texture
                            const crackle = Math.random() > 0.96 ? (Math.random() * 2 - 1) * 2.5 : (Math.random() * 2 - 1) * 0.35;
                            data[i] = crackle;
                        }
                        this.inhaleNode = this.ctx.createBufferSource();
                        this.inhaleNode.buffer = buf;
                        this.inhaleNode.loop = true;

                        this.inhaleFilter = this.ctx.createBiquadFilter();
                        this.inhaleFilter.type = 'bandpass';
                        this.inhaleFilter.frequency.value = 1200;

                        this.inhaleGain = this.ctx.createGain();
                        this.inhaleGain.gain.value = 0.08;

                        this.inhaleNode.connect(this.inhaleFilter);
                        this.inhaleFilter.connect(this.inhaleGain);
                        this.inhaleGain.connect(this.ctx.destination);
                        this.inhaleNode.start(0);
                    }
                    const targetFreq = 900 + heatRatio * 1800;
                    this.inhaleFilter.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.05);
                    this.inhaleGain.gain.setTargetAtTime(0.08 + heatRatio * 0.14, this.ctx.currentTime, 0.05);
                } else if (this.inhaleGain) {
                    this.inhaleGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.06);
                }
            }

            // Trigger Taiwanese Hokkien Burn Voice + Sizzle Sound!
            playTaiwaneseBurnVoice() {
                this.init();
                // 有真人配音就只挑有音檔的台詞，免得一下真人一下機器聲
                const recorded = this.taiwaneseBurnLines.filter(l => l.audio && VoiceClips.has(l.audio));
                const pool = recorded.length ? recorded : this.taiwaneseBurnLines;
                const line = pool[Math.floor(Math.random() * pool.length)];
                const playedClip = !this.isMuted && !!line.audio && VoiceClips.play(line.audio);

                if (!this.isMuted && this.ctx) {
                    const now = this.ctx.currentTime;
                    // 1. Hot skin sizzle sound ("Tssss!")
                    const sizzleBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.4, this.ctx.sampleRate);
                    const ch = sizzleBuf.getChannelData(0);
                    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ch.length * 0.35));
                    const sizzleSrc = this.ctx.createBufferSource();
                    sizzleSrc.buffer = sizzleBuf;
                    const sizzleFilter = this.ctx.createBiquadFilter();
                    sizzleFilter.type = 'highpass';
                    sizzleFilter.frequency.value = 2800;
                    const sizzleGain = this.ctx.createGain();
                    sizzleGain.gain.setValueAtTime(0.45, now);
                    sizzleGain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
                    sizzleSrc.connect(sizzleFilter);
                    sizzleFilter.connect(sizzleGain);
                    sizzleGain.connect(this.ctx.destination);
                    sizzleSrc.start(now);

                    // 2. Synthesized vocal pain grunt/cry fallback ("Ah-niang-wei! Sio-lah!")（有真人配音就不用）
                    if (!playedClip) {
                        const vOsc = this.ctx.createOscillator();
                        const vGain = this.ctx.createGain();
                        vOsc.type = 'sawtooth';
                        // Taiwanese exclamation pitch contour
                        vOsc.frequency.setValueAtTime(290, now + 0.05);
                        vOsc.frequency.linearRampToValueAtTime(420, now + 0.18); // "啊娘~"
                        vOsc.frequency.linearRampToValueAtTime(240, now + 0.34); // "喂~"
                        vOsc.frequency.setValueAtTime(380, now + 0.38);          // "燒(Sio)!"
                        vOsc.frequency.exponentialRampToValueAtTime(170, now + 0.68); // "啦!"

                        const formant = this.ctx.createBiquadFilter();
                        formant.type = 'bandpass';
                        formant.frequency.setValueAtTime(850, now);
                        formant.Q.value = 3.5;

                        vGain.gain.setValueAtTime(0.001, now);
                        vGain.gain.linearRampToValueAtTime(0.28, now + 0.06);
                        vGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                        vOsc.connect(formant);
                        formant.connect(vGain);
                        vGain.connect(this.ctx.destination);
                        vOsc.start(now + 0.05);
                        vOsc.stop(now + 0.72);
                    }
                }

                // 3. Web Speech API with Taiwanese Mandarin/Hokkien phonetic inflection（沒有真人配音時才念）
                if (!playedClip && !this.isMuted && 'speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(line.tts);
                        utter.lang = 'zh-TW';
                        utter.pitch = line.pitch;
                        utter.rate = line.rate;
                        utter.volume = 1.0;
                        const voice = this.pickBurnVoice();
                        if (voice) utter.voice = voice;
                        window.speechSynthesis.speak(utter);
                    } catch (e) { }
                }

                return line.text;
            }

            playCoughWarning() {
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(95, now + 0.18);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.21);
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                if (this.rainGain && this.ctx) {
                    this.rainGain.gain.setValueAtTime(this.isMuted ? 0 : 0.025, this.ctx.currentTime);
                }
                CoverVideo.setMuted(this.isMuted);
                return this.isMuted;
            }
        }

        const audioEngine = new StreetAudioEngine();

        // 雙擊開檔（file://）時瀏覽器不准 WebGL 讀本機的圖檔和影片，改用 Canvas 繪圖 + <img> 載入（上線後照常用 WebGL）
        const IS_LOCAL_FILE = location.protocol === 'file:';

        /**
         * 封面影片 video.mp4（點菸 + 搖滾樂）：自己建 <video> 再交給 Phaser 當貼圖，
         * 播放、靜音、切場景都由這裡控制。
         */
        const CoverVideo = {
            el: null,

            load() {
                if (this.el) return;
                const v = document.createElement('video');
                v.loop = true;
                v.playsInline = true;
                v.setAttribute('playsinline', '');
                v.preload = 'auto';
                // 找不到或格式不支援：當作沒有影片，封面改用原圖
                v.addEventListener('error', () => { if (this.el === v) this.el = null; });
                v.src = './video.mp4';
                this.el = v;
                // 先靜音播著，讓手機先把影片載下來（iOS 不播放就不會下載）；有聲播放留給玩家點「開始」的當下
                v.muted = true;
                v.play().catch(() => { });
            },

            // 從頭播放（依目前的靜音設定）；必須在玩家點擊的當下呼叫才能有聲音
            // （不要用「音量 0 試播」偵測能否有聲自動播放：Chrome 把音量 0 當成靜音，會誤判成允許）
            start() {
                const v = this.el;
                if (!v) return false;
                v.currentTime = 0;
                v.volume = 1;
                v.muted = audioEngine.isMuted;
                v.play().catch(() => {
                    v.muted = true;
                    v.play().catch(() => { });
                });
                return true;
            },

            stop() {
                if (this.el) this.el.pause();
            },

            setMuted(muted) {
                if (this.el) this.el.muted = muted;
            }
        };

        /**
         * 燙嘴台詞的真人配音（audio01.mp3～audio03.mp3，見 taiwaneseBurnLines 的 audio）：放了就播，沒放就退回瀏覽器語音。
         * 上線時下載後交給 Web Audio 播（燙嘴發生在遊戲中途，不是點擊當下，手機上 <audio> 會被擋）；
         * 雙擊開檔（file://）讀不到檔案內容，改用 <audio> 播。
         */
        const VoiceClips = {
            clips: {},

            load(srcs) {
                srcs.forEach(src => {
                    if (this.clips[src]) return;
                    const clip = this.clips[src] = { ready: false };
                    if (IS_LOCAL_FILE) {
                        const a = new Audio();
                        a.preload = 'auto';
                        a.addEventListener('canplaythrough', () => { clip.ready = true; }, { once: true });
                        a.src = src;
                        clip.el = a;
                    } else {
                        // 沒放檔案會 404：當作沒有配音
                        fetch(src)
                            .then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
                            .then(data => { clip.data = data; this.decode(clip); })
                            .catch(() => { });
                    }
                });
            },

            // AudioContext 要等玩家點「開始」才建立，下載先完成的等建好再解碼
            decode(clip) {
                const ctx = audioEngine.ctx;
                if (!ctx || !clip.data) return;
                const data = clip.data;
                clip.data = null;
                ctx.decodeAudioData(data, buf => { clip.buffer = buf; clip.ready = true; }, () => { });
            },

            decodeAll() {
                Object.values(this.clips).forEach(clip => this.decode(clip));
            },

            has(src) {
                return !!(this.clips[src] && this.clips[src].ready);
            },

            play(src) {
                const clip = this.clips[src];
                if (!clip || !clip.ready) return false;
                if (clip.el) {
                    clip.el.currentTime = 0;
                    clip.el.play().catch(() => { });
                } else {
                    const node = audioEngine.ctx.createBufferSource();
                    node.buffer = clip.buffer;
                    node.connect(audioEngine.ctx.destination);
                    node.start();
                }
                return true;
            }
        };

        /**
         * ============================================================================
         * 2. HIGH-DETAIL PROCEDURAL COMIC ARTWORK GENERATOR (FALLBACK FOR 0.jpg ~ 6.jpg)
         * ============================================================================
         * Recreates the exact dark ink-and-watercolor Taiwanese street comic aesthetic
         * of 0.jpg, 1.jpg, 2.jpg, 3.jpg, 4.jpg, 5.jpg, and 6.jpg on HTML5 Canvas
         * so the game is 100% playable and visually authentic immediately, while also
         * supporting hot-swapping with the user's actual image files.
         */
        class ComicArtGenerator {
            static generateAllTextures(scene) {
                const W = 540, H = 960;
                const configs = [
                    { key: 'img0', drawFn: (ctx) => ComicArtGenerator.drawScene0_NeonStreet(ctx, W, H) },
                    { key: 'img1', drawFn: (ctx) => ComicArtGenerator.drawScene1_AlleyFar(ctx, W, H, false) },
                    { key: 'img2', drawFn: (ctx) => ComicArtGenerator.drawScene1_AlleyFar(ctx, W, H, true) },
                    { key: 'img3', drawFn: (ctx) => ComicArtGenerator.drawScene3_AshtrayClose(ctx, W, H, false) },
                    { key: 'img4', drawFn: (ctx) => ComicArtGenerator.drawScene3_AshtrayClose(ctx, W, H, true) },
                    { key: 'img5', drawFn: (ctx) => ComicArtGenerator.drawScene5_SmokingProfile(ctx, W, H, false) },
                    { key: 'img6', drawFn: (ctx) => ComicArtGenerator.drawScene5_SmokingProfile(ctx, W, H, true) }
                ];

                configs.forEach(cfg => {
                    if (!scene.textures.exists(cfg.key)) {
                        const canvasTex = scene.textures.createCanvas(cfg.key, W, H);
                        const ctx = canvasTex.getContext();
                        cfg.drawFn(ctx);
                        canvasTex.refresh();
                    }
                });
            }

            // Helper: Gritty comic ink crosshatching & vignette
            static applyComicFinish(ctx, W, H) {
                // Ink hatching lines
                ctx.save();
                ctx.strokeStyle = 'rgba(0,0,0,0.22)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 120; i++) {
                    const x = (i * 37) % W;
                    const y = (i * 83) % H;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + 8, y + 24);
                    ctx.stroke();
                }
                // Dark comic vignette border
                const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, H * 0.65);
                vig.addColorStop(0, 'rgba(0,0,0,0)');
                vig.addColorStop(1, 'rgba(4,6,10,0.68)');
                ctx.fillStyle = vig;
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }

            static drawNeonSign(ctx, x, y, w, h, bgColor, borderColor, text, textColor = '#fff', vertical = true) {
                ctx.save();
                ctx.shadowColor = bgColor;
                ctx.shadowBlur = 16;
                ctx.fillStyle = bgColor;
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 3;
                ctx.fillRect(x, y, w, h);
                ctx.strokeRect(x, y, w, h);
                ctx.shadowBlur = 0;

                ctx.fillStyle = textColor;
                ctx.font = `900 ${vertical ? Math.floor(w * 0.62) : Math.floor(h * 0.58)}px ${FONT_SERIF}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (vertical) {
                    const chars = text.split('');
                    const step = h / (chars.length + 0.6);
                    chars.forEach((ch, idx) => {
                        ctx.fillText(ch, x + w / 2, y + step * (idx + 0.8));
                    });
                } else {
                    ctx.fillText(text, x + w / 2, y + h / 2);
                }
                ctx.restore();
            }

            // SCENE 0: Ah-Rui leaning on brick wall in Taiwanese neon street ("老蔡家快炒", "台灣牛肉麵", Taiwan Post mailbox)

                ctx.beginPath(); ctx.roundRect(285, 825, 82, 36, 10); ctx.fill(); ctx.stroke();

                // Army Green Parka Jacket

            // SCENE 1 & 2: Dark Alley with Rusty Trash Can + Square Iron Tray Ashtray
            static drawScene1_AlleyFar(ctx, W, H, closerZoom = false) {
                ctx.save();

            // SCENE 3 & 4: Top-down Close-up of the Square Iron Tray Ashtray (+ Hand picking butt in Scene 4)
            static drawScene3_AshtrayClose(ctx, W, H, withHand = false) {

                ctx.beginPath(); ctx.arc(140, 320, 45, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#2d3236';
                ctx.beginPath();
                ctx.arc(275, 455, 138, 0, Math.PI * 2);
                ctx.fill();

                // Rusty iron handle in center of tray
                ctx.strokeStyle = '#1a1d20';
                ctx.lineWidth = 18;
                ctx.beginPath();
                ctx.moveTo(225, 365);
                ctx.lineTo(330, 425);
                ctx.stroke();
                ctx.strokeStyle = '#6e5c4f';
                ctx.lineWidth = 10;
                ctx.stroke();

                // Draw 26 detailed comic cigarette butts piled around the tray
                const butts = [
                    { x: 145, y: 445, ang: -0.35, len: 58, filter: 24 },
                    { x: 185, y: 515, ang: -0.52, len: 52, filter: 22 },
                    { x: 285, y: 565, ang: 0.32, len: 48, filter: 24 },
                    { x: 350, y: 505, ang: 1.15, len: 62, filter: 25 },
                    { x: 382, y: 452, ang: 1.62, len: 56, filter: 24 },
                    { x: 432, y: 435, ang: 0.25, len: 64, filter: 24 },

                butts.forEach(b => {
                    ctx.save();

                    ctx.rotate(b.ang);
                    ctx.strokeStyle = '#0c0e10';
                    ctx.lineWidth = 2.5;
                    // Orange filter
                    ctx.fillStyle = '#d9823b';
                    ctx.fillRect(0, -8, b.filter, 16);
                    ctx.strokeRect(0, -8, b.filter, 16);
                    // White paper

                    ctx.fillRect(b.filter, -8, b.len - b.filter, 16);
                    ctx.strokeRect(b.filter, -8, b.len - b.filter, 16);
                    // Charred tip
                    ctx.fillStyle = '#222629';
                    ctx.fillRect(b.len - 6, -8, 6, 16);
                    ctx.restore();
                });

                // If Scene 4 (withHand = true), draw Ah-Rui's weathered dirty hand pinching the central butt
                if (withHand) {
                    ctx.save();
                    ctx.fillStyle = '#b58d74';
                    ctx.strokeStyle = '#0a0c0e';
                    ctx.lineWidth = 4;
                    // Hand palm & wrist coming from top-right
                    ctx.beginPath();
                    ctx.moveTo(540, 175);
                    ctx.lineTo(355, 170);
                    ctx.lineTo(260, 295);
                    ctx.lineTo(285, 445);
                    ctx.lineTo(325, 440);
                    ctx.lineTo(360, 325);
                    ctx.lineTo(335, 445);
                    ctx.lineTo(385, 435);
                    ctx.lineTo(485, 345);
                    ctx.lineTo(540, 340);
                    ctx.closePath();

        // 菸屁股：濾嘴 + 一小截皺掉的菸紙 + 捻熄燒焦的頭（🚬 表情符號畫的是整根新菸，不像撿來的菸蒂）
        // 圖示與 HUD 共用；座標為邏輯像素（ctx 已依解析度縮放），四周留 2px 給描邊；回傳菸紙末端的 x
        const BUTT_ICON = { w: 39, h: 14, res: 3 };
        const CIG_BAR = { filterW: 36, h: 14 };
        function drawButtShape(ctx, filterW, paperW, h) {
            const x0 = 2;
            const top = 2;
            const bottom = top + h;
            const x1 = x0 + filterW;
            const x2 = x1 + paperW;
            const jag = Math.min(4, h * 0.3);
            ctx.lineJoin = 'round';
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = '#000';

            // 菸紙：尾端被捻熄壓扁，邊緣參差
            const paper = new Path2D();
            paper.moveTo(x1, top + 0.6);
            paper.lineTo(x2, top + 0.6);
            paper.lineTo(x2 + jag, top + h * 0.22);
            paper.lineTo(x2 + jag * 0.25, top + h * 0.45);
            paper.lineTo(x2 + jag * 0.9, top + h * 0.7);
            paper.lineTo(x2 + jag * 0.1, bottom - 0.6);
            paper.lineTo(x1, bottom - 0.6);
            paper.closePath();
            ctx.fillStyle = '#e9e2d1';
            ctx.fill(paper);

            ctx.save();
            ctx.clip(paper);
            // 靠濾嘴那段被菸油燻黃
            const stain = ctx.createLinearGradient(x1, 0, x1 + Math.max(6, paperW * 0.7), 0);
            stain.addColorStop(0, 'rgba(176,128,52,0.55)');
            stain.addColorStop(1, 'rgba(176,128,52,0)');
            ctx.fillStyle = stain;
            ctx.fillRect(x1, top, paperW + jag, h);
            // 皺摺
            if (paperW > 9) {
                ctx.strokeStyle = 'rgba(60,45,30,0.35)';
                ctx.lineWidth = 0.8;
                [0.38, 0.68].forEach((t, i) => {
                    const cx = x1 + paperW * t;
                    ctx.beginPath();
                    ctx.moveTo(cx - 1.5, top + (i ? h * 0.55 : 1));
                    ctx.lineTo(cx + 1.5, top + (i ? h - 1 : h * 0.5));
                    ctx.stroke();
                });
            }
            // 燒焦的頭 + 灰燼
            const charW = Math.min(5, paperW * 0.7);
            ctx.fillStyle = '#2f2723';
            ctx.fillRect(x2 - charW, top, charW + jag + 1, h);
            ctx.fillStyle = '#8d8781';
            [[0.3, 0.3], [0.65, 0.62], [0.2, 0.82]].forEach(([tx, ty]) => {
                ctx.beginPath();
                ctx.arc(x2 - charW + (charW + jag) * tx, top + h * ty, h * 0.09, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.6;
            ctx.stroke(paper);

            // 濾嘴：軟木紋 + 金線
            ctx.fillStyle = '#d9893a';
            ctx.fillRect(x0, top, filterW, h);
            ctx.fillStyle = '#f6c27a';
            for (let i = 0; i * 5 + 3 < filterW - 3; i++) {
                ctx.beginPath();
                ctx.arc(x0 + 3 + i * 5, top + h * (i % 2 ? 0.68 : 0.32), h * 0.09, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#f2d27a';
            ctx.fillRect(x1 - 2.2, top, 1.2, h);
            ctx.strokeRect(x0, top, filterW, h);
            return x2;
        }

        // 燙度計漸層依各菸蒂的黃金區間產生（下綠→黃金區→上紅）
        function ensureHeatTexture(scene, butt) {
            const key = `fx-heat-${butt.id}`;
            if (scene.textures.exists(key)) return key;
            const w = 40, h = 600;
            const canvasTex = scene.textures.createCanvas(key, w, h);
            const ctx = canvasTex.getContext();
            const lo = butt.sweetMin / 100;
            const hi = butt.sweetMax / 100;
            const g = ctx.createLinearGradient(0, h, 0, 0);
            g.addColorStop(0, '#15803d');
            g.addColorStop(lo - 0.08, '#65a30d');
            g.addColorStop(lo, '#facc15');
            g.addColorStop(hi, '#f59e0b');
            g.addColorStop(Math.min(1, hi + 0.04), '#f97316');
            g.addColorStop(1, '#dc2626');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(w * 0.18, 0, w * 0.14, h);
            canvasTex.refresh();
            return key;
        }

        // 帶顏色的柔光圓：直接把顏色畫進貼圖，不用 setTint（Canvas 模式不支援 tint，本機開檔時會用 Canvas）
        function glowKey(scene, color) {
            const key = `fx-glow-${color.toString(16)}`;
            if (scene.textures.exists(key)) return key;
            const { r, g, b } = Phaser.Display.Color.IntegerToRGB(color);
            const canvasTex = scene.textures.createCanvas(key, 128, 128);
            const ctx = canvasTex.getContext();
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            [[0, 1], [0.25, 0.55], [0.6, 0.12], [1, 0]].forEach(([stop, a]) => grad.addColorStop(stop, `rgba(${r},${g},${b},${a})`));
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            canvasTex.refresh();
            return key;
        }

        // 上下壓暗用的垂直漸層（Graphics 的 fillGradientStyle 只有 WebGL 支援）
        function shadeKey(scene, rgb, topAlpha, bottomAlpha) {
            const key = `fx-shade-${rgb}-${topAlpha}-${bottomAlpha}`;
            if (scene.textures.exists(key)) return key;
            const canvasTex = scene.textures.createCanvas(key, 4, 256);
            const ctx = canvasTex.getContext();
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, `rgba(${rgb},${topAlpha})`);
            grad.addColorStop(1, `rgba(${rgb},${bottomAlpha})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 4, 256);
            canvasTex.refresh();
            return key;
        }

        function hexColor(str) {
            return Phaser.Display.Color.HexStringToColor(str).color;
        }

        function setupView(scene) {
            scene.cameras.main.setZoom(RENDER_SCALE).centerOn(GAME_W / 2, GAME_H / 2);
        }

        // 依原圖比例鋪滿畫面（cover），不再硬拉成 540x960
        function fitCover(img) {
            const s = Math.max(GAME_W / img.width, GAME_H / img.height);
            img.setPosition(GAME_W / 2, GAME_H / 2).setScale(s);
            img.baseScale = s;
            return img;
        }

        function addArtImage(scene, key, depth = 0) {
            return fitCover(scene.add.image(GAME_W / 2, GAME_H / 2, key).setDepth(depth));
        }

        // 以 focus 為定點慢慢推近（Ken Burns），focus 在畫面上的位置維持不動
        function kenBurns(scene, img, focus, zoom = 1.06, duration = 6000, yoyo = false) {
            scene.tweens.killTweensOf(img);
            const s = img.baseScale;
            img.setPosition(GAME_W / 2, GAME_H / 2).setScale(s);
            scene.tweens.add({
                targets: img,
                scale: s * zoom,
                x: focus.x + (GAME_W / 2 - focus.x) * zoom,
                y: focus.y + (GAME_H / 2 - focus.y) * zoom,
                duration,
                ease: 'Sine.easeInOut',
                yoyo,
                repeat: yoyo ? -1 : 0
            });
        }

        // 記錄物件在原圖上的座標，之後用 syncToArt 讓它跟著鏡頭推移
        function trackArt(obj) {
            obj.artX = obj.x;
            obj.artY = obj.y;
            obj.artScaleX = obj.scaleX;
            obj.artScaleY = obj.scaleY;
            return obj;
        }

        function syncToArt(img, objs) {
            const k = img.scale / img.baseScale;
            objs.forEach(o => {
                if (!o.active) return;
                o.x = img.x + (o.artX - GAME_W / 2) * k;
                o.y = img.y + (o.artY - GAME_H / 2) * k;
                o.setScale(o.artScaleX * k, o.artScaleY * k);
            });
        }

        // 霓虹招牌：ADD 光暈 + 偶爾接觸不良的閃爍
        function addNeonGlow(scene, signs, depth = 3) {
            const objs = [];
            (signs || []).forEach(sign => {
                const glow = scene.add.image(sign.x, sign.y, glowKey(scene, sign.color))
                    .setDisplaySize(sign.w * 2.6 + 30, sign.h * 1.5 + 30)
                    .setBlendMode(ADD)
                    .setDepth(depth);
                const dim = scene.add.rectangle(sign.x, sign.y, sign.w, sign.h, 0x000000, 1)
                    .setAlpha(0)
                    .setDepth(depth);
                const base = Phaser.Math.FloatBetween(0.32, 0.46);
                glow.setAlpha(base);

                const flicker = () => {
                    if (!glow.active) return;
                    if (Math.random() < 0.12) {
                        const steps = [[0, 0.05, 0.55], [60, base + 0.15, 0], [120, 0.08, 0.45], [190, base, 0]];
                        steps.forEach(([delay, glowAlpha, dimAlpha]) => {
                            scene.time.delayedCall(delay, () => {
                                if (!glow.active) return;
                                glow.setAlpha(glowAlpha);
                                dim.setAlpha(dimAlpha);
                            });
                        });
                    } else {
                        glow.setAlpha(base + Phaser.Math.FloatBetween(-0.06, 0.06));
                    }
                    scene.time.delayedCall(Phaser.Math.Between(140, 1100), flicker);
                };
                flicker();
                objs.push(trackArt(glow), trackArt(dim));
            });
            return objs;
        }

        function addLampGlow(scene, lamp, depth = 3) {
            if (!lamp) return [];
            const glow = scene.add.image(lamp.x, lamp.y, glowKey(scene, 0x9fe7ff))
                .setBlendMode(ADD)
                .setScale(1.1)
                .setAlpha(0.35)
                .setDepth(depth);
            scene.tweens.add({ targets: glow, alpha: 0.2, duration: 1800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            return [trackArt(glow)];
        }

        function addRain(scene, opts = {}) {
            const density = opts.density ?? 1;
            return scene.add.particles(0, 0, 'fx-rain', {
                x: { min: -60, max: GAME_W + 20 },
                y: { min: -90, max: -20 },
                speedY: { min: 950, max: 1250 },
                speedX: { min: -150, max: -110 },
                rotate: 7,
                scaleX: 0.5,
                scaleY: { min: 0.5, max: 1.1 },
                alpha: { min: 0.1, max: 0.3 },
                lifespan: 1150,
                frequency: Math.round(22 / density),
                blendMode: ADD
            }).setDepth(opts.depth ?? 8);
        }

        // 暗角 + 底片顆粒，讓整體更接近原圖的漫畫印刷質感
        function addFilmFinish(scene, opts = {}) {
            const depth = opts.depth ?? 9;
            scene.add.image(GAME_W / 2, GAME_H / 2, 'fx-vignette')
                .setDisplaySize(GAME_W, GAME_H)
                .setAlpha(opts.vignette ?? 0.55)
                .setDepth(depth);
            const grain = scene.add.tileSprite(GAME_W / 2, GAME_H / 2, GAME_W, GAME_H, 'fx-grain')
                .setTileScale(0.5)
                .setAlpha(opts.grain ?? 0.4)
                .setDepth(depth);
            scene.time.addEvent({
                delay: 70,
                loop: true,
                callback: () => grain.setTilePosition(Phaser.Math.Between(0, 127), Phaser.Math.Between(0, 127))
            });
        }

        function setEmitting(emitter, on) {
            if (on && !emitter.emitting) emitter.start();
            else if (!on && emitter.emitting) emitter.stop();
        }

        // 漫畫分格：黑色粗框 + 錯位黑影（x, y 為左上角），回傳組成的所有物件
        function drawComicPanel(scene, x, y, w, h, opts = {}) {
            const depth = opts.depth ?? 20;
            const shadow = opts.shadow ?? 6;
            const parts = [];
            const g = scene.add.graphics().setDepth(depth);
            if (shadow) {
                g.fillStyle(0x000000, 0.85);
                g.fillRect(x + shadow, y + shadow, w, h);
            }
            g.fillStyle(opts.fill ?? 0x0d1017, opts.alpha ?? 0.92);
            g.fillRect(x, y, w, h);
            parts.push(g);
            if (opts.halftone) {
                parts.push(scene.add.tileSprite(x + w / 2, y + h / 2, w, h, 'fx-halftone')
                    .setTileScale(0.6)
                    .setAlpha(0.7)
                    .setDepth(depth));
            }
            const frame = scene.add.graphics().setDepth(depth);
            frame.lineStyle(opts.border ?? 3, 0x000000, 1);
            frame.strokeRect(x, y, w, h);
            if (opts.accent !== undefined) {
                frame.lineStyle(1.5, opts.accent, opts.accentAlpha ?? 0.9);
                frame.strokeRect(x + 5, y + 5, w - 10, h - 10);
            }
            parts.push(frame);
            return parts;
        }

        // 色塊標籤（章節名、副標題）
        function addTagLabel(scene, x, y, label, opts = {}) {
            const text = scene.add.text(0, 0, label, {
                fontFamily: opts.fontFamily ?? FONT_UI,
                fontSize: opts.fontSize ?? '16px',
                fontStyle: '900',
                color: opts.color ?? '#ffffff'
            }).setOrigin(0.5);
            const padX = opts.padX ?? 14;
            const padY = opts.padY ?? 5;
            const w = text.width + padX * 2;
            const h = text.height + padY * 2;
            const shadow = opts.shadow ?? 4;
            const g = scene.add.graphics();
            if (shadow) {
                g.fillStyle(0x000000, 0.9);
                g.fillRect(-w / 2 + shadow, -h / 2 + shadow, w, h);
            }
            g.fillStyle(opts.fill ?? 0xb91c1c, 1);
            g.fillRect(-w / 2, -h / 2, w, h);
            g.lineStyle(opts.border ?? 3, 0x000000, 1);
            g.strokeRect(-w / 2, -h / 2, w, h);
            const tag = scene.add.container(x, y, [g, text]).setDepth(opts.depth ?? 21);
            if (opts.angle) tag.setAngle(opts.angle);
            tag.boxW = w;
            tag.boxH = h;
            return tag;
        }

        function createComicButton(scene, x, y, w, h, label, opts = {}) {
            const shadow = opts.shadow ?? 6;
            const g = scene.add.graphics();
            g.fillStyle(0x000000, 0.9);
            g.fillRect(-w / 2 + shadow, -h / 2 + shadow, w, h);
            g.fillStyle(opts.fill ?? 0xf59e0b, 1);
            g.fillRect(-w / 2, -h / 2, w, h);
            g.fillStyle(0xffffff, opts.shine ?? 0.2);
            g.fillRect(-w / 2, -h / 2, w, h * 0.42);
            g.lineStyle(opts.border ?? 3.5, 0x000000, 1);
            g.strokeRect(-w / 2, -h / 2, w, h);
            const text = scene.add.text(0, 1, label, {
                fontFamily: FONT_UI,
                fontSize: opts.fontSize ?? '22px',
                fontStyle: '900',
                color: opts.color ?? '#0b0b0b'
            }).setOrigin(0.5);
            const parts = [g, text];
            // opts.icon：文字前面的菸屁股圖示，圖示 + 文字整組置中
            if (opts.icon) parts.push(...placeIconBeforeText(scene, text, 0, 1, 0.5, opts.iconScale));
            const btn = scene.add.container(x, y, parts).setDepth(opts.depth ?? 25);
            btn.setSize(w, h).setInteractive({ useHandCursor: true });
            return btn;
        }

        // 在文字前面放菸屁股圖示，originX 決定整組（圖示 + 文字）以 x 為左緣/中心/右緣
        function placeIconBeforeText(scene, text, x, y, originX = 0.5, iconScale = 1) {
            const icon = scene.add.image(0, y, 'icon-butt').setScale(iconScale / BUTT_ICON.res);
            const gap = 6;
            const left = x - (icon.displayWidth + gap + text.width) * originX;
            icon.x = left + icon.displayWidth / 2;
            text.setOrigin(0, 0.5).setPosition(left + icon.displayWidth + gap, y);
            if (text.depth) icon.setDepth(text.depth);
            return [icon];
        }

        // 中文沒有空白可斷行，依實際字寬手動換行
        function wrapCJK(text, font, maxWidth) {
            const ctx = wrapCJK.ctx || (wrapCJK.ctx = document.createElement('canvas').getContext('2d'));
            ctx.font = font;
            return text.split('\n').map(para => {
                const lines = [];
                let line = '';
                for (const ch of para) {
                    if (line && ctx.measureText(line + ch).width > maxWidth) {
                        lines.push(line);
                        line = ch;
                    } else {
                        line += ch;
                    }
                }
                lines.push(line);
                return lines.join('\n');
            }).join('\n');
        }

        // 台語罵聲在「！」處斷成兩行（取兩行長度最平均的位置），讓爆炸框可以窄一點
        function splitShout(line) {
            const chars = Array.from(line);
            let best = line;
            let bestMax = chars.length;
            chars.forEach((ch, i) => {
                if (ch !== '！' || i === chars.length - 1) return;
                const longest = Math.max(i + 1, chars.length - i - 1);
                if (longest < bestMax) {
                    bestMax = longest;
                    best = `${chars.slice(0, i + 1).join('')}\n${chars.slice(i + 1).join('')}`;
                }
            });
            return best;
        }

        // 燙到時的漫畫爆炸對話框，tail 指向嘴巴
        function drawShoutBurst(g, w, h, tail) {
            const spikes = 16;
            const pts = [];
            for (let i = 0; i < spikes * 2; i++) {
                const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                const r = i % 2 === 0 ? 1 + ((i * 7) % 5) * 0.025 : 0.8;
                pts.push({ x: Math.cos(a) * (w / 2) * r, y: Math.sin(a) * (h / 2) * r });
            }
            const tailPts = [
                { x: tail.baseX - 24, y: tail.baseY },
                { x: tail.baseX + 24, y: tail.baseY },
                { x: tail.x, y: tail.y }
            ];
            const offset = (list, d) => list.map(p => ({ x: p.x + d, y: p.y + d }));
            g.fillStyle(0x000000, 0.85);
            g.fillPoints(offset(tailPts, 6), true);
            g.fillPoints(offset(pts, 7), true);
            g.fillStyle(0xffffff, 1);
            g.fillPoints(tailPts, true);
            g.lineStyle(4, 0x000000, 1);
            g.strokePoints(tailPts, true, true);
            g.fillStyle(0xffffff, 1);
            g.fillPoints(pts, true);
            g.fillStyle(0xfde047, 1);
            g.fillPoints(pts.map(p => ({ x: p.x * 0.82, y: p.y * 0.82 })), true);
            g.fillStyle(0xffffff, 1);
            g.fillEllipse(0, 0, w * 0.74, h * 0.62);
            g.lineStyle(4, 0x000000, 1);
            g.strokePoints(pts, true, true);
        }

        // 先載入網頁字型再建立文字，避免 Canvas 文字先用系統字型畫好就定型
        function loadWebFonts() {
            if (!document.fonts || !document.fonts.load) return Promise.resolve();
            const sample = [
                '街友本色煙屁股大作戰阿睿的巷弄菸屁股生存戰台灣街頭寫實黑色幽默大作點擊進入遊戲跳過劇情繼續挑選',
                '剩餘時間總分菸蒂長度燙度黃金過癮區壓住此處不放抽煙太燙前要適時放開最終得分結算',
                ...CIGARETTE_BUTTS.map(b => b.name + b.desc + b.difficultyLabel)
            ].join('');
            const jobs = [
                ...[400, 700, 900].flatMap(weight => [
                    document.fonts.load(`${weight} 20px "Noto Serif TC"`, sample),
                    document.fonts.load(`${weight} 20px "Noto Serif"`, 'True Hobo I: Butt Brawl Combo 0123456789.s%x()|+-')
                ])
            ].map(p => p.catch(() => { }));
            return Promise.race([Promise.all(jobs), new Promise(resolve => setTimeout(resolve, 3000))]);
        }

                    padX: 20,
                    padY: 3,
                    depth: 12
                });

                const titleEn = this.add.text(W / 2, 760, 'True Hobo I: Butt Brawl', {
                    fontFamily: FONT_TITLE,
                    fontSize: '25px',
                    fontStyle: '900',
                    color: '#fde68a',
                    stroke: '#000000',
                    strokeThickness: 5
                }).setOrigin(0.5).setShadow(3, 3, '#000000', 0, true, false).setDepth(12);

                // Story intro blurb
                const blurb = this.add.text(W / 2, 808, '在熱鬧的霓虹街頭轉進暗巷，鐵盤煙灰缸裡躺著各式菸蒂…\n壓住同一個位置猛吸、適時放開控溫，小心別燙起水泡！', {
                    fontFamily: FONT_UI,
                    fontSize: '14px',
                    color: '#e7e5e4',
                    align: 'center',
                    lineSpacing: 6
                }).setOrigin(0.5).setShadow(1, 2, '#000', 3).setDepth(12);

                // Interactive CTA Button
                const btnStart = createComicButton(this, W / 2, 870, 290, 60, '🔥 點擊進入遊戲', { fontSize: '24px', depth: 13 });
                this.tweens.add({
                    targets: btnStart,
                    scale: 1.05,
                    duration: 650,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });

                this.add.text(W / 2, 934, '🔊 右上角按鈕可隨時開關聲音', {
                    fontFamily: FONT_UI,
                    fontSize: '12px',
                    color: '#a8a29e'
                }).setOrigin(0.5).setDepth(12);

                // 標題蓋章式登場，續作編號「I」隨後再蓋一次
                titleMain.setScale(1.7).setAlpha(0);
                titleNum.setScale(2.6).setAlpha(0);
                [tagTxt, subTitle, titleEn, blurb].forEach(o => o.setAlpha(0));
                this.tweens.add({
                    targets: titleMain,
                    scale: 1,
                    alpha: 1,
                    delay: 250,
                    duration: 420,
                    ease: 'Back.easeOut',
                    onComplete: () => this.cameras.main.shake(160, 0.006)
                });
                this.tweens.add({
                    targets: titleNum,
                    scale: 1,
                    alpha: 1,
                    delay: 700,
                    duration: 260,
                    ease: 'Back.easeOut',
                    onComplete: () => this.cameras.main.shake(120, 0.005)
                });
                this.tweens.add({ targets: [tagTxt, subTitle, titleEn, blurb], alpha: 1, delay: 900, duration: 500 });

                // 點擊畫面任意處進入劇情：影片原聲隨畫面淡出，合成搖滾配樂接手（之後持續不中斷）
                let entering = false;
                const handleStart = () => {
                    if (entering) return;
                    entering = true;
                    audioEngine.duckBGM = false;
                    audioEngine.startContinuousBGM();
                    audioEngine.playLighterFlick();

                    const v = CoverVideo.el;
                    if (v) {
                        this.tweens.addCounter({ from: v.volume, to: 0, duration: 450, onUpdate: t => { v.volume = t.getValue(); } });
                    }

                    this.cameras.main.fadeOut(450, 0, 0, 0);
                    this.time.delayedCall(460, () => {
                        this.scene.start('StoryScene');
                    });
                };

                this.input.once('pointerdown', handleStart);
                btnStart.once('pointerdown', handleStart);
            }

            update() {
                syncToArt(this.coverImg, this.artFx);
                this.updateCoverVideo();
            }

            updateCoverVideo() {
                const v = CoverVideo.el;
                if (!v) {
                    // 影片中途載入失敗：改回合成搖滾配樂
                    if (audioEngine.duckBGM) {
                        audioEngine.duckBGM = false;
                        audioEngine.startContinuousBGM();
                    }
                    return;
                }
                if (v.readyState < 2) return;

                if (!this.videoImg) {
                    if (!this.textures.exists('coverVideo')) {
                        this.textures.create('coverVideo', v, v.videoWidth, v.videoHeight).add('__BASE', 0, 0, 0, v.videoWidth, v.videoHeight);
                    }
                    this.videoImg = fitCover(this.add.image(GAME_W / 2, GAME_H / 2, 'coverVideo')).setDepth(6).setAlpha(0);
                    this.tweens.add({
                        targets: this.videoImg,
                        alpha: 1,
                        duration: 600,
                        onComplete: () => this.imageOnlyFx.forEach(o => o.setVisible(false))
                    });
                    this.videoFrameTime = -1;
                }
                // WebGL 不會自己更新影片貼圖：有新畫面才重新上傳
                if (v.currentTime !== this.videoFrameTime) {
                    this.videoFrameTime = v.currentTime;
                    this.textures.get('coverVideo').source[0].update();
                }
            }
        }

        // ----------------------------------------------------------------------------
        // SCENE C: STORY CUTSCENE (0.jpg -> 1.jpg -> 2.jpg)
        // 街友阿睿在熱鬧街頭走到巷子，巷子裡有一個煙灰垃圾桶，上方放著鐵盤當做煙灰缸
        // ----------------------------------------------------------------------------
        class StoryScene extends Phaser.Scene {
            constructor() {
                super({ key: 'StoryScene' });
            }

            create() {
                setupView(this);
                const W = GAME_W;
                const H = GAME_H;
                this.cameras.main.fadeIn(400, 0, 0, 0);

                this.slides = [
                    {
                        img: 'img0',
                        focus: { x: 245, y: 230 },
                        title: '第一章：霓虹街頭的阿睿',
                        text: '夜色微涼，熱鬧的台灣街頭人車鼎沸。\n街友阿睿摸了摸空空的大衣口袋，嘴裡那根菸早就熄了…'
                    },
                    {
                        img: 'img1',
                        focus: { x: 300, y: 430 },
                        title: '第二章：轉入暗巷',
                        text: '阿睿熟門熟路地轉進快炒店後方的潮濕暗巷。\n巷子正中央擺著一個生鏽的鐵皮垃圾桶。'
                    },
                    {
                        img: 'img2',
                        focus: ART_FX.img2.treasure,
                        title: '第三章：鐵盤煙灰缸的寶藏',
                        text: '垃圾桶上方被放了一個大鐵盤當作煙灰缸，\n裡頭堆滿了路人剛捻熄的各式菸屁股！阿睿眼睛亮了起來…'
                    }
                ];

                this.currentSlideIndex = 0;
                this.typing = false;
                this.typeTimer = null;
                this.slideFx = [];
                this.chapterTag = null;

                // 兩層背景輪流交叉淡入
                this.bgFront = addArtImage(this, 'img0', 1);
                this.bgBack = addArtImage(this, 'img0', 0);

                addRain(this);
                addFilmFinish(this);

                // 漫畫旁白框
                this.boxX = 16;
                this.boxY = H - 182;
                this.boxW = W - 32;
                this.boxH = 160;
                drawComicPanel(this, this.boxX, this.boxY, this.boxW, this.boxH, {
                    fill: PAPER,
                    alpha: 0.97,
                    shadow: 7,
                    border: 3.5,
                    halftone: true,
                    depth: 20
                });

                this.storyTxt = this.add.text(this.boxX + 22, this.boxY + 34, '', {
                    fontFamily: FONT_UI,
                    fontSize: '17px',
                    fontStyle: 'bold',
                    color: INK,
                    lineSpacing: 9
                }).setDepth(22);

                this.nextPrompt = this.add.text(this.boxX + this.boxW - 18, this.boxY + this.boxH - 20, '點擊繼續 ▶', {
                    fontFamily: FONT_UI,
                    fontSize: '14px',
                    fontStyle: '900',
                    color: '#b91c1c'
                }).setOrigin(1, 0.5).setDepth(22);

                this.tweens.add({
                    targets: this.nextPrompt,
                    alpha: 0.35,
                    duration: 550,
                    yoyo: true,
                    repeat: -1
                });

                // 分鏡進度點
                this.progressDots = this.slides.map((_, i) =>
                    this.add.circle(this.boxX + 26 + i * 18, this.boxY + this.boxH - 20, 5, 0xb91c1c, 1)
                        .setStrokeStyle(2, 0x000000)
                        .setDepth(22)
                );

                // Skip button（放左上，避開右上角的音樂 / 載入素材按鈕）
                const skipBtn = createComicButton(this, 72, 56, 112, 34, '跳過劇情 ⏭', {
                    fill: 0x111827,
                    color: '#e5e7eb',
                    fontSize: '13px',
                    shadow: 4,
                    border: 2.5,
                    shine: 0.06,
                    depth: 30
                });

                skipBtn.on('pointerdown', (pointer, x, y, event) => {
                    event.stopPropagation();
                    this.scene.start('SelectButtScene');
                });

                this.showSlide(0);

                this.input.on('pointerdown', () => {
                    if (this.typing) {
                        this.finishTyping();
                        return;
                    }
                    this.currentSlideIndex++;
                    if (this.currentSlideIndex < this.slides.length) {
                        this.showSlide(this.currentSlideIndex);
                    } else {
                        this.scene.start('SelectButtScene');
                    }
                });
            }

            showSlide(idx) {
                const s = this.slides[idx];

                // 新圖放上層淡入，舊圖留在下層
                const incoming = this.bgBack;
                this.bgBack = this.bgFront;
                this.bgFront = incoming;
                incoming.setTexture(s.img);
                fitCover(incoming);
                incoming.setDepth(1).setAlpha(idx === 0 ? 1 : 0);
                this.bgBack.setDepth(0);
                kenBurns(this, incoming, s.focus, 1.07, 7000);
                if (idx > 0) {
                    this.tweens.add({ targets: incoming, alpha: 1, duration: 450 });
                }

                // 該分鏡的霓虹 / 路燈 / 鐵盤閃光
                this.slideFx.forEach(o => o.destroy());
                const fx = ART_FX[s.img] || {};
                this.slideFx = [...addNeonGlow(this, fx.neon, 3), ...addLampGlow(this, fx.lamp, 3)];
                if (s.img === 'img0') {
                    const ember = ART_FX.img0.ember;
                    const glow = this.add.image(ember.x, ember.y, glowKey(this, 0xff6a1a)).setBlendMode(ADD).setScale(0.3).setAlpha(0.6).setDepth(4);
                    this.tweens.add({ targets: glow, alpha: 0.3, duration: 800, yoyo: true, repeat: -1 });
                    this.slideFx.push(trackArt(glow));
                }
                if (fx.treasure) {
                    const glow = this.add.image(fx.treasure.x, fx.treasure.y, glowKey(this, 0xffc46b))
                        .setBlendMode(ADD).setDisplaySize(260, 90).setAlpha(0.15).setDepth(4);
                    this.tweens.add({ targets: glow, alpha: 0.45, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
                    const glints = this.add.particles(fx.treasure.x, fx.treasure.y, 'fx-spark', {
                        x: { min: -55, max: 55 },
                        y: { min: -18, max: 14 },
                        scale: { start: 0.6, end: 0 },
                        alpha: { start: 1, end: 0 },
                        lifespan: 520,
                        frequency: 170,
                        tint: 0xfff1b0,
                        blendMode: ADD
                    }).setDepth(5);
                    this.slideFx.push(trackArt(glow), trackArt(glints));
                }

                // 章節標籤
                if (this.chapterTag) this.chapterTag.destroy();
                this.chapterTag = addTagLabel(this, 0, this.boxY, s.title, { fontSize: '15px', angle: -2, depth: 23 });
                this.chapterTag.x = this.boxX + 14 + this.chapterTag.boxW / 2;

                this.progressDots.forEach((dot, i) => dot.setFillStyle(i === idx ? 0xb91c1c : 0xd6cdb4, 1));
                this.nextPrompt.setText(idx === this.slides.length - 1 ? '點擊挑選菸屁股 ▶' : '點擊繼續 ▶');
                this.typeText(s.text);
            }

            typeText(fullText) {
                if (this.typeTimer) this.typeTimer.remove();
                this.fullText = fullText;
                this.typedLen = 0;
                this.typing = true;
                this.storyTxt.setText('');
                this.nextPrompt.setVisible(false);
                this.typeTimer = this.time.addEvent({
                    delay: 32,
                    loop: true,
                    callback: () => {
                        this.typedLen++;
                        this.storyTxt.setText(this.fullText.slice(0, this.typedLen));
                        if (this.typedLen >= this.fullText.length) this.finishTyping();
                    }
                });
            }

            finishTyping() {
                if (this.typeTimer) {
                    this.typeTimer.remove();
                    this.typeTimer = null;
                }
                this.storyTxt.setText(this.fullText);
                this.typing = false;
                this.nextPrompt.setVisible(true);
            }

            update() {
                syncToArt(this.bgFront, this.slideFx);
            }
        }

        // ----------------------------------------------------------------------------
        // SCENE D: CIGARETTE BUTT SELECTION (3.jpg -> 4.jpg)
        // 阿睿在鐵盤煙灰缸裡選了一個煙屁股 (越好的煙屁股 難度越高)
        // ----------------------------------------------------------------------------
        class SelectButtScene extends Phaser.Scene {
            constructor() {
                super({ key: 'SelectButtScene' });
            }

            create() {
                setupView(this);
                const W = GAME_W;
                const H = GAME_H;
                this.pickingUp = false;
                this.cameras.main.fadeIn(350, 0, 0, 0);

                // Background: 3.jpg Top-down Iron Tray Ashtray
                this.trayImg = addArtImage(this, 'img3');
                this.add.rectangle(W / 2, H / 2, W, H, 0x05070a, 0.18).setDepth(1);
                addRain(this, { density: 0.5 });
                addFilmFinish(this, { vignette: 0.45 });

                // Top Header（漫畫旁白框；上緣留空給右上角的 HTML 按鈕）
                drawComicPanel(this, 14, 48, W - 28, 76, { fill: PAPER, alpha: 0.97, shadow: 6, halftone: true, depth: 20 });
                const headTxt = this.add.text(W / 2, 74, '請在鐵盤上挑選一根「煙屁股」', {
                    fontFamily: FONT_UI,
                    fontSize: '20px',
                    fontStyle: '900',
                    color: '#b91c1c'
                }).setOrigin(0.5).setDepth(21);
                placeIconBeforeText(this, headTxt, W / 2, 74, 0.5, 1.2);
                this.add.text(W / 2, 102, '越高級的煙屁股得分倍率越高，但火頭極短、升溫超快！', {
                    fontFamily: FONT_UI,
                    fontSize: '12px',
                    fontStyle: 'bold',
                    color: '#44403c'
                }).setOrigin(0.5).setDepth(21);

                // 鐵盤上的菸蒂熱點：光暈圈住實際的菸蒂，編號牌拉線標在上方
                this.hotspots = CIGARETTE_BUTTS.map((butt, idx) => {
                    const { x, y } = butt.trayPos;
                    const color = hexColor(butt.badgeColor);
                    const glow = this.add.image(x, y, glowKey(this, color)).setBlendMode(ADD).setScale(0.75).setAlpha(0.6).setDepth(10);
                    const ring = this.add.circle(x, y, 22).setStrokeStyle(3, 0xffffff, 0.95).setDepth(11);
                    const tagY = y - 46;
                    const leader = this.add.graphics().setDepth(11);
                    leader.lineStyle(4, 0x000000, 0.9);
                    leader.lineBetween(x, y - 22, x, tagY + 13);
                    leader.lineStyle(2, 0xffffff, 1);
                    leader.lineBetween(x, y - 22, x, tagY + 13);
                    const tag = this.add.circle(x, tagY, 14, color, 1).setStrokeStyle(3, 0x000000).setDepth(12);
                    const num = this.add.text(x, tagY, `${idx + 1}`, {
                        fontFamily: FONT_NUM,
                        fontSize: '19px',
                        fontStyle: '900',
                        color: '#ffffff',
                        stroke: '#000000',
                        strokeThickness: 4
                    }).setOrigin(0.5).setDepth(13);

                    const hit = this.add.circle(x, y, 32, 0x000000, 0).setInteractive({ useHandCursor: true }).setDepth(14);
                    hit.on('pointerover', () => this.highlight(idx, true));
                    hit.on('pointerout', () => this.highlight(idx, false));
                    hit.on('pointerdown', () => this.selectAndPickupButt(butt));

                    this.tweens.add({ targets: ring, scale: 1.3, alpha: 0.45, duration: 700, yoyo: true, repeat: -1 });
                    this.tweens.add({ targets: glow, alpha: 0.3, duration: 700, yoyo: true, repeat: -1 });
                    return { glow, tag, num, cardHi: null };
                });

                // Selection Cards Panel（縮矮一些，讓鐵盤露出更多）
                const cardH = 74;
                const gap = 8;
                const startY = H - 14 - (cardH * 4 + gap * 3) + cardH / 2;

                CIGARETTE_BUTTS.forEach((butt, idx) => {
                    const cy = startY + idx * (cardH + gap);
                    const color = hexColor(butt.badgeColor);
                    drawComicPanel(this, 14, cy - cardH / 2, W - 28, cardH, { fill: 0x0e1218, alpha: 0.93, shadow: 5, depth: 20 });
                    this.add.rectangle(14, cy, 9, cardH, color, 1).setOrigin(0, 0.5).setDepth(21);
                    const cardHi = this.add.rectangle(W / 2, cy, W - 28, cardH, 0xffffff, 1).setAlpha(0).setDepth(21);
                    this.hotspots[idx].cardHi = cardHi;

                    this.add.text(34, cy - 25, `${idx + 1}. ${butt.name}`, {
                        fontFamily: FONT_UI,
                        fontSize: '17px',
                        fontStyle: '900',
                        color: '#ffffff'
                    }).setDepth(22);

                    // Difficulty & Stars
                    this.add.text(W - 28, cy - 23, `${butt.difficultyLabel} ${butt.stars} | 倍率 x${butt.scoreMultiplier.toFixed(1)}`, {
                        fontFamily: FONT_UI,
                        fontSize: '13px',
                        fontStyle: 'bold',
                        color: butt.badgeColor
                    }).setOrigin(1, 0).setDepth(22);

                    // Description
                    this.add.text(34, cy + 7, butt.desc, {
                        fontFamily: FONT_UI,
                        fontSize: '12px',
                        color: '#a8a29e'
                    }).setDepth(22);

                    const hit = this.add.rectangle(W / 2, cy, W - 28, cardH, 0x000000, 0).setInteractive({ useHandCursor: true }).setDepth(23);
                    hit.on('pointerover', () => this.highlight(idx, true));
                    hit.on('pointerout', () => this.highlight(idx, false));
                    hit.on('pointerdown', () => this.selectAndPickupButt(butt));
                });
            }

            // 卡片與鐵盤熱點互相連動高亮
            highlight(idx, on) {
                const h = this.hotspots[idx];
                h.cardHi.setAlpha(on ? 0.08 : 0);
                h.tag.setScale(on ? 1.25 : 1);
                h.num.setScale(on ? 1.25 : 1);
                h.glow.setScale(on ? 1.05 : 0.75);
            }

            selectAndPickupButt(butt) {
                if (this.pickingUp) return;
                this.pickingUp = true;
                GAME_STATE.selectedButt = butt;
                audioEngine.playLighterFlick();

                const W = GAME_W;
                const H = GAME_H;

                // Transition to 4.jpg：阿睿的髒手從鐵盤捏起菸蒂，鏡頭推近手指
                this.cameras.main.flash(160, 255, 236, 200);
                const handOverlay = addArtImage(this, 'img4', 50).setAlpha(0);
                kenBurns(this, handOverlay, ART_FX.img4.pinch, 1.1, 1700);

                const captionTop = H - 176;
                const caption = [
                    ...drawComicPanel(this, 22, captionTop, W - 44, 120, { fill: PAPER, alpha: 0.97, shadow: 7, halftone: true, depth: 60 }),
                    this.add.text(W / 2, captionTop + 60, `✋ 阿睿撿起了【${butt.name}】\n點火準備開抽！(限時 60 秒)`, {
                        fontFamily: FONT_UI,
                        fontSize: '21px',
                        fontStyle: '900',
                        color: INK,
                        align: 'center',
                        lineSpacing: 10
                    }).setOrigin(0.5).setDepth(61)
                ];
                caption.forEach(o => o.setAlpha(0));

                this.tweens.add({ targets: handOverlay, alpha: 1, duration: 320 });
                this.tweens.add({
                    targets: caption,
                    alpha: 1,
                    delay: 200,
                    duration: 260,
                    onComplete: () => {
                        this.time.delayedCall(1050, () => {
                            this.cameras.main.fadeOut(260, 0, 0, 0);
                            this.time.delayedCall(270, () => this.scene.start('PlayScene'));
                        });
                    }
                });
            }
        }

        // ----------------------------------------------------------------------------
        // SCENE E: MAIN GAMEPLAY SCENE (5.jpg & 6.jpg - 60秒壓住同位置抽煙屁股控溫戰)
        // ----------------------------------------------------------------------------
        class PlayScene extends Phaser.Scene {
            constructor() {
                super({ key: 'PlayScene' });
            }

            create() {
                setupView(this);
                const W = GAME_W;
                const H = GAME_H;
                const butt = GAME_STATE.selectedButt;
                this.cameras.main.fadeIn(300, 0, 0, 0);

                // Gameplay State Variables
                this.timeLeft = 60.0;
                this.score = 0;
                this.heat = 15;             // 0 ~ 100%
                this.idleTime = 0;          // Seconds since last inhale
                this.isInhaling = false;
                this.inhaleDuration = 0;    // 這一口吸了多久（放開時決定吐煙量）
                this.isBurnStunned = false; // Brief cooldown when burned at 100%
                this.burnCount = 0;
                this.depriveTicks = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.goldenTime = 0;
                this.isGameOver = false;
                this.holdRingColor = null;

                // 1. 原圖：img5 待機（菸頭熄暗）與 img6 吸菸（菸頭發紅）交叉淡入
                this.imgIdle = addArtImage(this, 'img5', 0);
                this.imgInhale = addArtImage(this, 'img6', 1).setAlpha(0);
                // 燙到時的反應圖（瞪眼、冒汗、口鼻噴煙）；沒有這張圖時只保留閃紅與對話框
                this.imgBurn = this.textures.exists('img7') ? addArtImage(this, 'img7', 1.5).setAlpha(0) : null;
                const fx = ART_FX.img5;
                addNeonGlow(this, fx.neon, 2);
                addLampGlow(this, fx.lamp, 2);

                this.emberX = fx.ember.x;
                this.emberY = fx.ember.y;
                this.mouthX = fx.mouth.x;
                this.mouthY = fx.mouth.y;

                // 菸頭火光（光暈 + 白熱核心）
                this.emberHalo = this.add.image(this.emberX, this.emberY, glowKey(this, 0xff4400)).setBlendMode(ADD).setAlpha(0).setDepth(5);
                this.emberCore = this.add.image(this.emberX, this.emberY, glowKey(this, 0xffc46b)).setBlendMode(ADD).setAlpha(0).setDepth(5);

                // 煙：平常細細一縷，吸的時候濃煙 + 火星，放開時從嘴角吐出一大口
                this.wispSmoke = this.add.particles(this.emberX + 4, this.emberY - 6, 'fx-smoke', {
                    speedX: { min: -6, max: 14 },
                    speedY: { min: -55, max: -35 },

            drawHoldRing(color) {
                const g = this.holdRing;
                const r = this.holdRadius;
                const seg = 16;
                g.clear();
                // 黑邊 + 彩色虛線圈，像漫畫分鏡的對焦框
                for (let i = 0; i < seg; i++) {
                    const a0 = (i / seg) * Math.PI * 2;
                    const a1 = a0 + (Math.PI * 2 / seg) * 0.6;
                    g.lineStyle(8, 0x000000, 0.7);
                    g.beginPath();
                    g.arc(0, 0, r, a0, a1);
                    g.strokePath();
                    g.lineStyle(4, color, 0.95);
                    g.beginPath();
                    g.arc(0, 0, r, a0, a1);
                    g.strokePath();
                }
                this.holdRingColor = color;
            }

            // 菸紙長度變動（取整數 px）才重畫，火頭跟著停在菸紙末端
            drawCigBar(paperW) {
                const w = Math.round(paperW);
                if (w === this.cigBarPaperW) return;
                this.cigBarPaperW = w;
                const ctx = this.cigBarTex.getContext();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
                const paperEnd = drawButtShape(ctx, CIG_BAR.filterW, w, CIG_BAR.h);
                this.cigBarTex.refresh();
                this.cigBarTipX = this.cigBarX + paperEnd + 1.5;
            }

            createGauges(W, H, butt) {
                // RIGHT GAUGE: Heat Meter (燙度計 0~100%)

                const gw = 22;
                const top = gy - gh / 2;
                const bottom = gy + gh / 2;

                this.gaugeX = gx;
                this.gaugeY = gy;
                this.gaugeH = gh;

                this.gaugeDanger = this.add.image(gx, gy, glowKey(this, 0xff2200)).setBlendMode(ADD).setDisplaySize(gw * 5, gh * 1.3).setAlpha(0).setDepth(19);

                const frame = this.add.graphics().setDepth(20);
                frame.fillStyle(0x000000, 0.85);
                frame.fillRoundedRect(gx - gw / 2 - 6 + 4, top - 6 + 4, gw + 12, gh + 12, 10);
                frame.fillStyle(0x0b0e14, 0.94);
                frame.fillRoundedRect(gx - gw / 2 - 6, top - 6, gw + 12, gh + 12, 10);

                frame.strokeRoundedRect(gx - gw / 2 - 6, top - 6, gw + 12, gh + 12, 10);

                    .setDisplaySize(gw, gh)
                    .setDepth(21);

                const overlay = this.add.graphics().setDepth(22);

                    const ty = bottom - (gh * i) / 10;
                    overlay.lineBetween(gx - gw / 2, ty, gx + gw / 2, ty);

                // Golden Sweet Spot Zone highlight on Heat Gauge
                const sweetTopY = bottom - (butt.sweetMax / 100) * gh;

                overlay.lineStyle(2.5, 0xfde047, 1);
                overlay.strokePoints([{ x: bx + 5, y: sweetTopY }, { x: bx, y: sweetTopY }, { x: bx, y: sweetBotY }, { x: bx + 5, y: sweetBotY }]);

                this.add.text(bx - 6, (sweetTopY + sweetBotY) / 2, '黃金\n過癮區\nx2.5', {
                    fontFamily: FONT_UI,
                    fontSize: '10px',
                    fontStyle: '900',
                    color: '#fde047',

                }).setOrigin(1, 0.5).setDepth(22);

                // 目前溫度刻度線

                this.add.text(gx, top - 24, '🔥 燙度', {

                }).setOrigin(0.5).setDepth(22);

                this.heatPctTxt = this.add.text(gx, bottom + 22, '15%', {
                    fontFamily: FONT_NUM, fontSize: '18px', fontStyle: '900', color: '#ffffff', stroke: '#000', strokeThickness: 4
                }).setOrigin(0.5).setDepth(22);

                // Bottom Status Bar: Nicotine Deprivation (太久沒吸到煙焦慮計)
                drawComicPanel(this, 18, H - 58, W - 36, 40, { fill: 0x0b0e14, alpha: 0.9, shadow: 4, depth: 20 });

                this.cravingBar = this.add.rectangle(22, H - 38, 0, 32, 0xef4444, 0.6)
                    .setOrigin(0, 0.5)
                    .setDepth(21);

                this.statusTxt = this.add.text(W / 2, H - 38, '💡 壓住畫面中央的菸蒂不放開始抽菸！', {
                    fontFamily: FONT_UI,
                    fontSize: '13px',
                    fontStyle: 'bold',
                    color: '#e7e5e4'
                }).setOrigin(0.5).setDepth(22);
