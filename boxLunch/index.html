<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>打造你的台式便當 - 選飯・配菜・主菜・秤重算錢</title>
  <!-- Three.js 3D 引擎：載入後掛到 window，讓下方一般 script 使用 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    window.THREE = THREE;
    window.OrbitControls = OrbitControls;
    window.dispatchEvent(new Event('three-ready'));
  </script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070c1a;
      --bg-panel: #101935;
      --bg-card: #162244;
      --accent: #ff6b2b;
      --accent-glow: rgba(255, 107, 43, 0.45);
      --cyan: #38bdf8;
      --green: #22c55e;
      --yellow: #facc15;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    button,
    input {
      font-family: inherit;
      touch-action: manipulation;
    }

    input {
      user-select: text;
      -webkit-user-select: text;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    body {
      background: radial-gradient(circle at 50% 18%, #17254a 0%, #050811 100%);
      color: var(--text-main);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 490px;
      height: 100vh;
      height: 100dvh;
      max-height: 950px;
      background: linear-gradient(180deg, #0d152e 0%, #070b18 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    @media (min-width: 520px) {
      .app-shell {
        height: 94vh;
        height: 94dvh;
        border-radius: 34px;
      }
    }

    /* 頂部標題列 */
    .top-header {
      padding: 10px 14px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .brand-title .serif {
      font-family: 'Playfair Display', serif;
    }

    .brand-title span.highlight {
      color: var(--yellow);
      font-style: italic;
      margin-left: 3px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-mini {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
    }

    .btn-mini:active {
      transform: scale(0.94);
    }

    /* 重量 / 熱量 / 價格 三合一即時數據條 */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px 14px;
      background: rgba(0, 0, 0, 0.32);
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.66rem;
      color: var(--text-sub);
    }

    .stat-value {
      font-size: 0.94rem;
      font-weight: 900;
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    .stat-weight { color: var(--cyan); }
    .stat-kcal { color: var(--yellow); }
    .stat-price { color: var(--green); }

    /* 三步驟點餐導覽：① 選飯 → ② 配菜 → ③ 主菜 */
    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--line);
    }

    .step-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      background: rgba(22, 34, 68, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 5px 7px;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s;
    }

    .step-tab.active {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.18);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .step-tab.locked {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .step-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #1e2a4f;
      color: var(--text-sub);
      font-size: 0.7rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-tab.done .step-num {
      background: var(--green);
      color: #052e16;
    }

    .step-tab.active .step-num {
      background: var(--cyan);
      color: #070c1a;
    }

    .step-text {
      min-width: 0;
    }

    .step-title,
    .step-sub {
      display: block;
    }

    .step-title {
      font-size: 0.72rem;
      font-weight: 800;
    }

    .step-sub {
      font-size: 0.6rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* 3D 便當盒畫布：拖曳轉動、雙指／滾輪縮放；矮螢幕自動縮小，把空間讓給下方選單 */
    #bento-3d {
      width: 100%;
      height: clamp(210px, 34dvh, 320px);
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    #bento-3d:active {
      cursor: grabbing;
    }

    #bento-3d canvas {
      display: block;
    }

    .bento-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .bento-tag {
      position: absolute;
      left: 0;
      top: 0;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      white-space: nowrap;
      color: #fff;
      background: rgba(15, 23, 42, 0.82);
      padding: 2px 5px;
      border-radius: 6px;
      transition: opacity 0.25s;
      will-change: transform;
    }

    .bento-tag-name,
    .bento-tag-meta {
      display: block;
    }

    .bento-tag-meta:empty,
    .bento-labels.compact .bento-tag-meta {
      display: none;
    }

    .bento-labels.compact .bento-tag {
      font-size: 9px;
      padding: 1px 4px;
    }

    .bento-labels.from-back .bento-tag {
      opacity: 0;
    }

    .bento-tag.empty {
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.55);
    }

    .bento-tag.selected {
      color: var(--cyan);
      box-shadow: 0 0 0 1.5px var(--cyan);
    }

    .bento-float {
      position: absolute;
      left: 0;
      top: 0;
      font-size: 12px;
      font-weight: 900;
      color: #4ade80;
      white-space: nowrap;
      text-shadow: 0 0 3px #050811, 0 0 3px #050811, 0 0 3px #050811;
      animation: floatUp 0.9s ease-out forwards;
    }

    @keyframes floatUp {
      from { opacity: 1; translate: 0 0; }
      to { opacity: 0; translate: 0 -34px; }
    }

    .bento-main-label {
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      max-width: calc(100% - 16px);
      font-size: 11px;
      font-weight: 800;
      color: #fde047;
      background: rgba(9, 13, 28, 0.88);
      padding: 3px 8px;
      border-radius: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 2;
    }

    .bento-hint {
      position: absolute;
      left: 10px;
      top: 8px;
      max-width: calc(100% - 96px);
      font-size: 10.5px;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.7);
      padding: 3px 8px;
      border-radius: 10px;
      pointer-events: none;
      transition: opacity 0.5s;
      z-index: 2;
    }

    .bento-hint.hide {
      opacity: 0;
    }

    .bento-reset {
      position: absolute;
      right: 10px;
      top: 8px;
      z-index: 3;
    }

    /* 各步驟操作面板 */
    .menu-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(11, 17, 38, 0.96);
      border-top: 1px solid var(--line);
      overflow: hidden;
    }

    .step-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .panel-hint {
      min-width: 0;
      font-size: 0.69rem;
      color: var(--cyan);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ① 選飯：飯種卡片 + 飯量按鈕 */
    .rice-step-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 12px;
    }

    .rice-type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .rice-type-card {
      position: relative;
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 6px 4px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: var(--text-main);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }

    .rice-type-name {
      font-size: 0.84rem;
      font-weight: 900;
    }

    .rice-type-desc {
      font-size: 0.6rem;
      color: var(--text-sub);
      margin-bottom: 1px;
    }

    .sub-label {
      font-size: 0.73rem;
      font-weight: 700;
      color: #cbd5e1;
      margin: 12px 0 6px;
    }

    .rice-buttons {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }

    @media (max-width: 419px) {
      .rice-buttons {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .rice-btn {
      background: #15203f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      border-radius: 8px;
      padding: 6px 2px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.16s;
    }

    .rice-btn small {
      display: block;
      font-size: 0.6rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .rice-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: #ff9a6c;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .rice-btn.active small {
      color: #ffe4d6;
    }

    .rice-btn.braised-btn.active {
      background: #b45309;
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.45);
    }

    /* ② 配菜：三小格選格器 */
    .slot-selector-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px 12px 2px;
    }

    .slot-tab {
      min-width: 0;
      background: rgba(22, 34, 68, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 4px;
      text-align: center;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.18s;
    }

    .slot-tab.active {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.18);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .slot-tab-title,
    .slot-tab-sub {
      display: block;
    }

    .slot-tab-title {
      font-size: 0.71rem;
      font-weight: 800;
      color: #f1f5f9;
    }

    .slot-tab-sub {
      font-size: 0.61rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* 菜色網格 */
    .dishes-grid {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-content: start;
    }

    .dishes-grid::-webkit-scrollbar,
    .rice-step-body::-webkit-scrollbar {
      width: 5px;
    }

    .dishes-grid::-webkit-scrollbar-thumb,
    .rice-step-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
    }

    .grid-section-title {
      grid-column: 1 / -1;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-sub);
      padding: 2px 2px 0;
    }

    .dish-card {
      position: relative;
    }

    .dish-pick {
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 5px 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: var(--text-main);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }

    @media (hover: hover) {
      .dish-pick:hover,
      .rice-type-card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.3);
      }
    }

    .dish-pick:active,
    .rice-type-card:active {
      transform: scale(0.95);
    }

    .dish-card.selected .dish-pick,
    .rice-type-card.selected {
      border-color: var(--accent);
      background: rgba(255, 107, 43, 0.16);
      box-shadow: 0 0 12px rgba(255, 107, 43, 0.32);
    }

    .dish-thumb-wrap {
      width: 56px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3px;
      overflow: hidden;
    }

    .dish-thumb {
      display: block;
      width: 54px;
      height: 42px;
      pointer-events: none;
    }

    .dish-badge-count {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--accent);
      color: #fff;
      font-size: 0.64rem;
      font-weight: 900;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 2;
    }

    .dish-remove-btn {
      position: absolute;
      top: -6px;
      left: -6px;
      background: #2563eb;
      color: #fff;
      border: none;
      font-size: 0.9rem;
      font-weight: 900;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      z-index: 2;
    }

    .dish-name,
    .dish-meta,
    .dish-price-tag {
      display: block;
    }

    .dish-name {
      font-size: 0.71rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .dish-meta {
      font-size: 0.59rem;
      color: #94a3b8;
      line-height: 1.2;
    }

    .dish-meta .w-tag { color: #38bdf8; font-weight: 700; }
    .dish-meta .k-tag { color: #facc15; }

    .dish-price-tag {
      margin-top: 2px;
      font-size: 0.69rem;
      font-weight: 900;
      color: #4ade80;
    }

    /* 底部：套餐進度 + 上一步 / 下一步 / 結帳 */
    .bottom-checkout {
      padding: 6px 14px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: #060a16;
      border-top: 1px solid var(--line);
    }

    .deal-hint {
      font-size: 0.68rem;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deal-hint.unlocked {
      color: #fde047;
      font-weight: 800;
    }

    .step-nav {
      display: flex;
      gap: 8px;
    }

    .nav-back {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      border-radius: 28px;
      padding: 0 14px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout-btn {
      flex: 1;
      min-width: 0;
      background: linear-gradient(90deg, #ea580c 0%, #f97316 50%, #ea580c 100%);
      border: none;
      border-radius: 28px;
      padding: 11px 18px;
      color: #fff;
      font-size: 0.94rem;
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.45);
      transition: transform 0.15s;
    }

    .checkout-btn:active {
      transform: scale(0.98);
    }

    .checkout-btn:disabled {
      background: #334155;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .checkout-btn.ready {
      animation: readyPulse 1.3s ease-in-out infinite;
    }

    @keyframes readyPulse {
      0%, 100% { box-shadow: 0 6px 20px rgba(234, 88, 12, 0.45); }
      50% { box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.5), 0 6px 26px rgba(234, 88, 12, 0.7); }
    }

    @media (prefers-reduced-motion: reduce) {
      .checkout-btn.ready { animation: none; }
    }

    .checkout-label {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .checkout-right {
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* 窄螢幕：標題只留「台式便當 2.0」，讓右上三顆按鈕放得下 */
    @media (max-width: 419px) {
      .brand-title .serif:not(.highlight) {
        display: none;
      }

      .brand-title span.highlight {
        margin-left: 0;
      }
    }

    /* 矮螢幕：縮小便當盒畫布與卡片，讓 ① 的飯量按鈕不用捲動就看得到 */
    @media (max-height: 700px) {
      #bento-3d {
        height: clamp(170px, 28dvh, 300px);
      }

      .step-sub,
      .rice-type-card .dish-thumb-wrap {
        display: none;
      }

      .rice-step-body {
        padding-top: 8px;
      }

      .sub-label {
        margin: 8px 0 4px;
      }

      .rice-btn {
        padding: 4px 2px;
      }

      .deal-hint {
        margin-bottom: 4px;
      }
    }

    /* 操作提示 */
    .toast {
      position: absolute;
      left: 50%;
      bottom: 96px;
      transform: translate(-50%, 10px);

const BRAISED_SAUCE = {

// 16 種經典配菜（放入後方左、中、右三格）
const SIDE_DISHES = [

const MAIN_DISHES = [

const MAX_MAIN_ADDONS = 4;     // 前方大格飯上最多疊幾樣

function hexCss(n) {
  return '#' + n.toString(16).padStart(6, '0');
}

/**
 * ============================================================================
 * 2. 遊戲狀態管理與音效合成器

  step: 1,                 // 1: 選飯 → 2: 選配菜 → 3: 選主菜
  riceType: null,          // 'white' | 'purple' | 'brown'，選好飯種才能往下一步

  sideSlots: [null, null, null],
  mainAddons: [],
  cashChoice: null,        // 顧客付款方式：null 未選 | 'exact' 付剛好 | 面額數字 | 'custom' 自行輸入
  customCash: null,
  soundOn: true
};

let audioCtx = null;
function playTone(freq = 440, type = 'sine', duration = 0.09) {
  if (!state.soundOn) return;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.75, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

/**
 * ============================================================================
 * 3. 高精細度台式便當菜色 Canvas 2D 繪圖引擎 (30 道獨立手繪質感料理 + 3 種飯)
 *    同時供下方圓形縮圖與 3D 便當盒內的菜色貼圖使用
 * ============================================================================
 */
function drawCulinaryDish(ctx, id, w, h) {
  ctx.save();
  ctx.clearRect(0, 0, w, h);
  ctx.translate(w / 2, h / 2);
  const scale = Math.min(w / 96, h / 72);
  ctx.scale(scale, scale);

  // 柔和底部陰影
  ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
  ctx.beginPath();
  ctx.ellipse(0, 4, 38, 22, 0, 0, Math.PI * 2);
  ctx.fill();

  switch (id) {
    // 1. 番茄炒蛋
    case 'tomato_egg': {
      // 酸甜茄汁底醬
      const sauceGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 36);
      sauceGrad.addColorStop(0, 'rgba(239, 68, 68, 0.85)');
      sauceGrad.addColorStop(1, 'rgba(220, 38, 38, 0.1)');
      ctx.fillStyle = sauceGrad;
      ctx.beginPath();
      ctx.ellipse(0, 2, 36, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      // 滑嫩炒蛋塊與帶籽番茄塊交錯
      const lumps = [
        { t: 'egg', x: -16, y: -4, r: 11 },
        { t: 'tom', x: -3,  y: -8, r: 10 },
        { t: 'egg', x: 12,  y: -5, r: 11 },
        { t: 'tom', x: -12, y: 7,  r: 10 },
        { t: 'egg', x: 2,   y: 3,  r: 12 },
        { t: 'tom', x: 15,  y: 6,  r: 10 },
        { t: 'egg', x: -6,  y: -1, r: 9 }
      ];
      lumps.forEach(p => {
        if (p.t === 'egg') {
          ctx.fillStyle = '#eab308';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fef08a';
          ctx.beginPath(); ctx.arc(p.x - 2, p.y - 2, p.r * 0.65, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#b91c1c';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.arc(p.x - 1.5, p.y - 1.5, p.r * 0.72, 0, Math.PI * 2); ctx.fill();
          // 番茄黃籽
          ctx.fillStyle = '#fde047';
          ctx.fillRect(p.x - 2, p.y - 1, 2, 2);
        }
      });
      // 翠綠蔥花
      ctx.fillStyle = '#16a34a';
      [[-8,-3],[5,-4],[-2,6],[10,2],[0,-2]].forEach(([sx,sy]) => {
        ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, Math.PI * 2); ctx.fill();
      });

    // 2. 蒜炒高麗菜
    case 'cabbage': {
      const leaves = [
        { x: -13, y: 2, rx: 16, ry: 11, rot: -0.3, c1: '#4ade80', c2: '#dcfce7' },

        { x: -5,  y: 6, rx: 15, ry: 10, rot: -0.15, c1: '#bbf7d0', c2: '#ffffff' },

      ];
      leaves.forEach(l => {
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(l.rot);
        ctx.fillStyle = l.c1;
        ctx.strokeStyle = '#16a34a';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(0, 0, l.rx, l.ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      });
      // 紅蘿蔔絲與蒜末
      ctx.strokeStyle = '#f97316';

        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      });
      ctx.fillStyle = '#fef3c7';
      [[-4,-2],[4,3],[0,-6]].forEach(([gx,gy]) => {
        ctx.beginPath(); ctx.arc(gx, gy, 2, 0, Math.PI * 2); ctx.fill();

    // 3. 蒜香空心菜
    case 'water_spinach': {

        ctx.beginPath(); ctx.ellipse(x2 - 4, y2, 9, 4.5, 0.3, 0, Math.PI * 2); ctx.fill();

      [[-8,-2],[6,3],[1,-5],[-3,6]].forEach(([gx,gy]) => {

      });

    // 4. 電話線海茸
    case 'seaweed_stem': {
      const coils = [
        { x: -13, y: 2, rot: -0.3 },

      coils.forEach(c => {

        ctx.translate(c.x, c.y);

          ctx.lineWidth = 5.2;
          ctx.beginPath(); ctx.arc(i * 4.5, 0, 5, 0, Math.PI * 1.65); ctx.stroke();

      ctx.beginPath(); ctx.ellipse(0, 1, 7, 4, -0.4, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath(); ctx.arc(-6, 2, 2.5, 0, Math.PI * 2); ctx.fill();

    // 7. 萬惡三色豆
    case 'three_color': {
      const cols = ['#facc15', '#22c55e', '#f97316'];
      const pts = [
        [-18,2,0],[-11,-5,1],[-3,-7,2],[6,-6,0],[15,-2,1],
        [-14,7,2],[-6,2,0],[1,0,1],[9,2,2],[16,5,0],
        [-8,8,1],[0,7,2],[8,8,0],[-2,-3,0],[5,4,1],

      ];
      pts.forEach(([bx, by, cIdx]) => {
        ctx.fillStyle = cols[cIdx];
        if (cIdx === 2) {
          ctx.beginPath(); ctx.roundRect(bx - 4.2, by - 4.2, 8.4, 8.4, 2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(bx, by, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.beginPath(); ctx.arc(bx - 1.2, by - 1.2, 1.4, 0, Math.PI * 2); ctx.fill();
        }
      });
      break;
    }

    // 8. 螢光咖哩洋芋
    case 'curry_potato': {
      ctx.fillStyle = '#ca8a04';
      ctx.beginPath(); ctx.ellipse(0, 2, 36, 21, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#eab308';
      ctx.beginPath(); ctx.ellipse(-1, 0, 31, 17, 0, 0, Math.PI * 2); ctx.fill();

      const chunks = [
        { x: -12, y: -2, col: '#fef08a', r: 7 },

        { x: 1,   y: 5,  col: '#fef08a', r: 7 },

      ];
      chunks.forEach(c => {
        ctx.fillStyle = c.col;
        ctx.beginPath(); ctx.roundRect(c.x - c.r, c.y - c.r * 0.8, c.r * 2, c.r * 1.6, 3); ctx.fill();

    case 'sweet_bean': {

      const balls = [[-11, -3], [5, -5], [-2, 5], [12, 3]];
      balls.forEach(([bx, by]) => {
        const g = ctx.createRadialGradient(bx-2, by-2, 1, bx, by, 9);
        g.addColorStop(0, '#fde047');
        g.addColorStop(1, '#b45309');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(bx, by, 8.5, 0, Math.PI * 2); ctx.fill();
      });
      // 蜜汁紅豆棗條與白芝麻
      const strips = [[-16, 4, -0.3], [-4, -2, 0.2], [7, 2, -0.25], [-8, -6, 0.4]];
      strips.forEach(([sx, sy, rot]) => {
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(rot);
        ctx.fillStyle = '#dc2626';
        ctx.beginPath(); ctx.roundRect(-9, -3, 18, 6, 3); ctx.fill();
        ctx.fillStyle = '#fef9c3';
        ctx.fillRect(-3, -1, 2, 1.5);
        ctx.fillRect(2, 0, 2, 1.5);
        ctx.restore();
      });
      break;

    // 10. 滷海帶豆干
    case 'kelp_tofu': {
      // 切片滷豆干
      const tofus = [[-12, -4, -0.25], [8, -5, 0.2], [-8, 5, 0.15], [10, 5, -0.2]];
      tofus.forEach(([tx, ty, rot]) => {
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(rot);
        ctx.fillStyle = '#78350f';
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.roundRect(-11, -4, 22, 8, 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#d97706';
        ctx.fillRect(-9, -2, 18, 4);
        ctx.restore();
      });
      // 深墨綠海帶結
      const kelps = [[-1, -1], [-14, 2], [12, 0]];
      kelps.forEach(([kx, ky]) => {

        ctx.beginPath(); ctx.arc(kx, ky, 3.5, 0, Math.PI * 2); ctx.fill();
      });

      const slices = [[-12,-2,-0.4],[8,-3,0.3],[-4,5,0.1],[11,5,-0.25],[-1,-5,0.2]];
      slices.forEach(([mx, my, rot]) => {

        ctx.translate(mx, my);

        ctx.fillStyle = '#bbf7d0';

        ctx.beginPath(); ctx.arc(0, 0, 10, 0.2, Math.PI - 0.2); ctx.stroke();

        ctx.strokeStyle = '#dcfce7';
        ctx.beginPath(); ctx.arc(0, 0, 8, 0.2, Math.PI - 0.2); ctx.stroke();
        ctx.restore();

        ctx.beginPath(); ctx.arc(ex, ey, 3.2, 0, Math.PI * 2); ctx.fill();
      });

    // 12. 玉米炒蛋

      [[-4,-2],[5,1],[-1,5]].forEach(([sx,sy]) => {

    case 'glass_noodle': {
      ctx.fillStyle = '#78350f';

      // 晶瑩醬色冬粉線條

    // 14. 涼拌小黃瓜

      });

    // ================== 14 道霸氣主菜與加點 ==================

    // 17. 古早味炸排骨
    case 'pork_chop': {
      ctx.save();
      ctx.rotate(-0.06);
      // 左側排骨白色骨頭柄
      ctx.fillStyle = '#fef3c7';
      ctx.strokeStyle = '#d6d3d1';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.roundRect(-38, -6, 14, 9, 3); ctx.fill(); ctx.stroke();

      // 5 片切塊金黃酥炸排骨條
      const slices = [-22, -11, 0, 11, 22];
      slices.forEach((sx, idx) => {
        const sh = (idx === 0 || idx === 4) ? 30 : 36;
        const grad = ctx.createLinearGradient(sx - 6, -sh / 2, sx + 6, sh / 2);
        grad.addColorStop(0, '#f59e0b');
        grad.addColorStop(0.5, '#d97706');
        grad.addColorStop(1, '#78350f');
        ctx.fillStyle = grad;
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.roundRect(sx - 5.2, -sh / 2, 10.4, sh, 4); ctx.fill(); ctx.stroke();
        // 胡椒鹽顆粒與酥皮高光
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(sx - 1, -sh * 0.2, 1.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1c1917';
        ctx.beginPath(); ctx.arc(sx + 1.5, sh * 0.15, 1.1, 0, Math.PI * 2); ctx.fill();
      });

    // 18. 酥炸大雞腿
    case 'chicken_leg': {

    case 'braised_pork': {

      ctx.fillStyle = '#fde68a';

      ctx.fillStyle = '#9a3412';
      ctx.beginPath(); ctx.roundRect(-24, 2, 48, 12, [0, 0, 8, 8]); ctx.fill();

    // 21. 黃金炸雞排
    case 'chicken_cutlet': {

    // 28. 蒜片烤香腸
    case 'sausage': {
      const slices = [
        { x: -13, y: 2, rot: -0.25 },
        { x: 0,   y: -2, rot: -0.1 },

      slices.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.fillStyle = '#991b1b';
        ctx.strokeStyle = '#450a0a';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(0, 0, 11, 7.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fecaca';
        [[-3,-1],[3,1],[0,-2]].forEach(([fx,fy]) => {
          ctx.beginPath(); ctx.arc(fx, fy, 1.7, 0, Math.PI * 2); ctx.fill();
        });
        ctx.restore();
      });
      // 雪白生蒜片
      ctx.fillStyle = '#fefce8';
      ctx.beginPath(); ctx.ellipse(-6, 5, 4.5, 3, 0.2, 0, Math.PI * 2); ctx.ellipse(7, 5, 4.5, 3, -0.2, 0, Math.PI * 2); ctx.fill();
      break;
    }

    // 29. 椒鹽炸甜不辣
    case 'tempura': {
      const bars = [
        [-14, -4, -0.2], [-2, -6, 0.15], [10, -2, -0.1],

      bars.forEach(([bx, by, rot]) => {

        ctx.fillStyle = '#fde68a';
        ctx.beginPath(); ctx.roundRect(-9, -2, 18, 3, 2); ctx.fill();
        ctx.restore();
      });
      // 酥炸九層塔葉
      ctx.fillStyle = '#15803d';
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 3.5, 0.4, 0, Math.PI * 2); ctx.fill();
      break;
    }

    // 30. 酸菜辣菜脯
    case 'pickled_radish': {
      const bits = [
        { x: -10, y: 2, col: '#65a30d', r: 5.5 },
        { x: 4,   y: -3, col: '#ca8a04', r: 6 },
        { x: 10,  y: 3, col: '#4d7c0f', r: 5 },
        { x: -2,  y: 5, col: '#a16207', r: 5.5 },
        { x: -4,  y: -3, col: '#84cc16', r: 5 },
        { x: 2,   y: 1, col: '#dc2626', r: 3.5 },
        { x: -7,  y: -2, col: '#dc2626', r: 3 }
      ];
      bits.forEach(b => {
        ctx.fillStyle = b.col;
        ctx.beginPath(); ctx.roundRect(b.x - b.r, b.y - b.r * 0.7, b.r * 2, b.r * 1.4, 2); ctx.fill();
      });
      break;
    }

    // ================== 3 種飯（① 選飯種卡片縮圖） ==================
    case 'rice_white':
    case 'rice_purple':
    case 'rice_brown': {
      const p = RICE_TYPES.find(t => 'rice_' + t.id === id).palette;
      // 飯糰立體底座
      ctx.fillStyle = hexCss(p.shadow);
      ctx.beginPath(); ctx.ellipse(0, 3, 34, 19, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = hexCss(p.base);
      ctx.beginPath(); ctx.ellipse(0, 0, 32, 17, 0, 0, Math.PI * 2); ctx.fill();

      // 一粒粒交錯斜放的米粒
      for (let r = -3; r <= 3; r++) {
        for (let c = -5; c <= 5; c++) {
          const gx = c * 5.4 + (r % 2 ? 2.7 : 0);
          const gy = r * 4;
          if ((gx * gx) / (28 * 28) + (gy * gy) / (14 * 14) > 1) continue;
          ctx.save();
          ctx.translate(gx, gy);
          ctx.rotate(((r * 7 + c * 3) % 5) * 0.35);
          ctx.fillStyle = hexCss((r + c) % 2 === 0 ? p.grainA : p.grainB);
          ctx.beginPath(); ctx.ellipse(0, 0, 3.3, 1.7, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      }

      // 芝麻／雜糧點綴
      ctx.fillStyle = hexCss(p.dot);
      [[-12, -3], [-4, 5], [6, -5], [14, 2]].forEach(([dx, dy]) => {
        ctx.beginPath(); ctx.ellipse(dx, dy, 1.8, 1.1, 0.4, 0, Math.PI * 2); ctx.fill();
      });
      break;
    }
  }

  ctx.restore();
}
/**
 * ============================================================================
 * 4. Three.js 立體白色紙便當盒（單指 / 滑鼠拖曳轉動，雙指 / 滾輪縮放）
 *    - 盒身、隔板、掀開的上蓋都是真實立體方塊
 *    - 菜色沿用第 3 節手繪圖當貼圖，貼在中間隆起的曲面上，看起來像堆起來的一坨菜
 *    - 飯依飯種換貼圖，飯量決定飯塊寬度與厚度
 * ============================================================================
 */
let bentoView = null;

const SLOT_LABELS = {
  0: '左小格 (格1)',
  1: '中小格 (格2)',
  2: '右小格 (格3)',
  main: '前方大格 (飯+主菜)'
};

// 便當盒尺寸（單位約略為公分）：x 左右、y 高度、z 前後（+z 朝向使用者）
const BOX = {
  w: 20, d: 14, h: 3.4, wall: 0.25, floor: 0.2,
  dividerH: 3.0, dividerT: 0.2,
  rowSplitZ: -1.5,   // 後三小格 / 前方大格 之間的橫隔板
  colSplitX: 3.25    // 後三小格之間的兩道直隔板（±）
};

// 各格內部範圍
const COMPARTMENTS = (() => {
  const inX0 = -BOX.w / 2 + BOX.wall;
  const inX1 = BOX.w / 2 - BOX.wall;
  const inZ0 = -BOX.d / 2 + BOX.wall;
  const inZ1 = BOX.d / 2 - BOX.wall;
  const t = BOX.dividerT / 2;
  return {
    0:    { x0: inX0, x1: -BOX.colSplitX - t, z0: inZ0, z1: BOX.rowSplitZ - t },
    1:    { x0: -BOX.colSplitX + t, x1: BOX.colSplitX - t, z0: inZ0, z1: BOX.rowSplitZ - t },
    2:    { x0: BOX.colSplitX + t, x1: inX1, z0: inZ0, z1: BOX.rowSplitZ - t },
    main: { x0: inX0, x1: inX1, z0: BOX.rowSplitZ + t, z1: inZ1 }
  };
})();

function compCenter(key) {
  const c = COMPARTMENTS[key];
  return { x: (c.x0 + c.x1) / 2, z: (c.z0 + c.z1) / 2, w: c.x1 - c.x0, d: c.z1 - c.z0 };
}

// 菜色尺寸：side 後三小格配菜、big 主菜肉排、small 加點小菜（貼圖比例 4:3）
// lift 是菜堆的厚度（邊緣直接立起來），h 是頂部再隆起的高度
const FOOD_SIZES = {
  side:  { w: 6.1, h: 1.5, lift: 0.5 },
  big:   { w: 7.4, h: 1.2, lift: 0.35 },
  small: { w: 4.6, h: 0.9, lift: 0.25 }
};

function easeOutBounce(x) {
  const n1 = 7.5625;
  const d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + 0.75;
  if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + 0.9375;
  return n1 * (x -= 2.625 / d1) * x + 0.984375;
}

function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}

// ---------- 幾何與貼圖（都有快取，換菜時不重建） ----------

// 平面細分後中間隆起成橢圓丘：貼圖仍是俯視手繪圖
const moundGeoCache = {};
function getMoundGeometry(sizeKey) {
  if (!moundGeoCache[sizeKey]) {
    const { w, h, lift } = FOOD_SIZES[sizeKey];
    const d = w * 0.75;
    const geo = new THREE.PlaneGeometry(w, d, 28, 21);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const a = (w / 2) * 0.8;
    const b = (d / 2) * 0.7;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const k = 1 - (x * x) / (a * a) - (z * z) / (b * b);
      pos.setY(i, k > 0 ? lift + h * Math.sqrt(k) : 0);
    }
    geo.computeVertexNormals();
    moundGeoCache[sizeKey] = geo;
  }
  return moundGeoCache[sizeKey];
}

const dishMatCache = {};
function getDishMaterial(id) {
  if (!dishMatCache[id]) {
    const cvs = document.createElement('canvas');
    cvs.width = 256;
    cvs.height = 192;
    drawCulinaryDish(cvs.getContext('2d'), id, 256, 192);
    const tex = new THREE.CanvasTexture(cvs);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    dishMatCache[id] = new THREE.MeshStandardMaterial({
      map: tex,
      alphaTest: 0.4,       // 手繪圖外圍透明處直接挖掉，只留菜的形狀
      roughness: 0.6,
      side: THREE.DoubleSide
    });
  }
  return dishMatCache[id];
}

// 飯塊：四邊圓滑下垂、表面微微起伏
const riceGeoCache = {};
function getRiceGeometry(ratio, w, d, h) {
  if (!riceGeoCache[ratio]) {
    const geo = new THREE.PlaneGeometry(w, d, 48, 24);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const edge = 1.2;
    const smooth = v => {
      const t = Math.min(1, Math.max(0, v));
      return t * t * (3 - 2 * t);
    };
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const s = smooth((w / 2 - Math.abs(x)) / edge) * smooth((d / 2 - Math.abs(z)) / edge);
      const bump = 0.07 * Math.sin(x * 2.1 + 0.6) * Math.sin(z * 2.7);
      pos.setY(i, s * (h + bump));
    }
    geo.computeVertexNormals();
    riceGeoCache[ratio] = geo;
  }
  return riceGeoCache[ratio];
}

// 可無縫拼接的米粒貼圖（依飯種配色，可疊滷汁）
function makeRiceCanvas(type, withSauce) {
  const S = 256;
  const cvs = document.createElement('canvas');
  cvs.width = S;
  cvs.height = S;
  const ctx = cvs.getContext('2d');
  const p = type.palette;
  let seed = 20261020;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // 靠邊的東西在對邊再畫一次，貼圖重複時才不會有接縫
  const tiled = (x, y, draw) => {
    [-S, 0, S].forEach(dx => [-S, 0, S].forEach(dy => draw(x + dx, y + dy)));
  };

  ctx.fillStyle = hexCss(p.base);
  ctx.fillRect(0, 0, S, S);

  const grainCols = [p.grainA, p.grainA, p.grainB, p.shadow];
  for (let i = 0; i < 520; i++) {
    const x = rnd() * S;
    const y = rnd() * S;
    const rot = rnd() * Math.PI;
    const col = hexCss(grainCols[Math.floor(rnd() * grainCols.length)]);
    tiled(x, y, (gx, gy) => {
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(rot);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  // 芝麻／雜糧點綴
  ctx.fillStyle = hexCss(p.dot);
  for (let i = 0; i < 14; i++) {
    const x = rnd() * S;
    const y = rnd() * S;
    const rot = rnd() * Math.PI;
    tiled(x, y, (gx, gy) => {
      ctx.beginPath(); ctx.ellipse(gx, gy, 4, 2.2, rot, 0, Math.PI * 2); ctx.fill();
    });
  }

  // 古早味淋滷肉燥汁
  if (withSauce) {
    for (let i = 0; i < 5; i++) {
      const x = rnd() * S;
      const y = rnd() * S;
      tiled(x, y, (gx, gy) => {
        ctx.fillStyle = 'rgba(120, 53, 15, 0.85)';
        ctx.beginPath(); ctx.ellipse(gx, gy, 36, 17, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(69, 26, 3, 0.95)';
        [[-12, -3], [3, 3], [13, -4]].forEach(([ox, oy]) => {
          ctx.beginPath(); ctx.roundRect(gx + ox - 5, gy + oy - 4, 10, 7, 2); ctx.fill();
        });
      });
    }
  }
  return cvs;
}

const riceMatCache = {};
function getRiceMaterial(type, withSauce) {
  const key = type.id + (withSauce ? '+sauce' : '');
  if (!riceMatCache[key]) {
    const tex = new THREE.CanvasTexture(makeRiceCanvas(type, withSauce));
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    riceMatCache[key] = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
  }
  return riceMatCache[key];
}

// 前方大格底部的合計標籤文字
function getMainLabelText() {
  const rice = getRiceInfo();
  if (!rice) return '🍚 前方大格：請先選飯（白米／紫米／糙米）';
  const sauce = state.hasBraisedSauce ? BRAISED_SAUCE : null;
  const mainWeight = state.mainAddons.reduce((s, d) => s + d.weight, 0) + rice.weight + (sauce ? sauce.weight : 0);
  const mainKcal = state.mainAddons.reduce((s, d) => s + d.kcal, 0) + rice.kcal + (sauce ? sauce.kcal : 0);
  const addonText = state.mainAddons.length > 0 ? ` + 主菜${state.mainAddons.length}樣` : '';
  return `🍚 ${rice.shortLabel}${sauce ? '+滷汁' : ''}${addonText} ｜ 大格 ${mainWeight}g · ${mainKcal}kcal`;
}

class Bento3D {
  constructor(container) {
    this.container = container;
    this.labelLayer = document.getElementById('bento-labels');
    this.mainLabel = document.getElementById('bento-main-label');
    this.hint = document.getElementById('bento-hint');
    this.size = { w: 1, h: 1 };
    this.drops = [];
    this.camTween = null;
    this.tmpVec = new THREE.Vector3();
    this.homeDir = new THREE.Vector3(-4, 24, 17).normalize();

    // 渲染器 / 場景 / 相機
    const renderer = this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.prepend(renderer.domElement);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(35, 1, 0.5, 200);

    // 轉動控制：不給平移，限制不能轉到桌面底下
    const controls = this.controls = new OrbitControls(this.camera, renderer.domElement);
    controls.target.set(0, 1.2, 0.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.rotateSpeed = 0.5;
    controls.minDistance = 14;
    controls.maxDistance = 55;
    controls.minPolarAngle = 0.12;
    controls.maxPolarAngle = 1.38;
    controls.addEventListener('start', () => {
      this.camTween = null;
      this.hint.classList.add('hide');
    });

    this.buildLights();
    this.buildBox();
    this.buildHighlights();
    this.buildLabels();

    this.foodGroup = new THREE.Group();
    this.scene.add(this.foodGroup);

    this.setupPicking();
    this.resize();
    this.resetView(false);
    new ResizeObserver(() => this.resize()).observe(container);

    this.refresh();
    renderer.setAnimationLoop(now => this.tick(now));
    setTimeout(() => this.hint.classList.add('hide'), 6000);
  }

  buildLights() {
    this.scene.add(new THREE.HemisphereLight(0xffffff, 0x1e293b, 1.7));

    const sun = new THREE.DirectionalLight(0xfff3e0, 2.3);
    sun.position.set(-9, 22, 13);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    const sc = sun.shadow.camera;
    sc.left = -17; sc.right = 17; sc.top = 17; sc.bottom = -17;
    sc.near = 1; sc.far = 60;
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.03;
    this.scene.add(sun);
  }

  buildBox() {
    const paper = new THREE.MeshStandardMaterial({ color: 0xf7f5f0, roughness: 0.92 });
    const paperInner = new THREE.MeshStandardMaterial({ color: 0xebe7df, roughness: 0.95 });
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xcfc9bd });
    const box = new THREE.Group();
    this.scene.add(box);

    // 紙板方塊 + 細折線邊框
    const addBlock = (w, h, d, x, y, z, mat = paper, parent = box) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), edgeMat));
      parent.add(mesh);
      return mesh;
    };

    const { w, d, h, wall, floor, dividerH, dividerT, rowSplitZ, colSplitX } = BOX;

    // 深色石板托盤
    const plate = new THREE.Mesh(
      new THREE.CylinderGeometry(15.5, 16, 0.6, 72),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.55, metalness: 0.1 })
    );
    plate.position.y = -0.3;
    plate.receiveShadow = true;
    this.scene.add(plate);

    // 盒底 + 前後左右四面外牆
    addBlock(w, floor, d, 0, floor / 2, 0, paperInner);
    addBlock(w, h, wall, 0, h / 2, d / 2 - wall / 2);
    addBlock(w, h, wall, 0, h / 2, -d / 2 + wall / 2);
    addBlock(wall, h, d - wall * 2, -w / 2 + wall / 2, h / 2, 0);
    addBlock(wall, h, d - wall * 2, w / 2 - wall / 2, h / 2, 0);

    // 前大格 / 後三小格之間的橫隔板，以及後三小格之間的兩道直隔板
    const backZ0 = -d / 2 + wall;
    addBlock(w - wall * 2, dividerH, dividerT, 0, dividerH / 2, rowSplitZ);
    [-colSplitX, colSplitX].forEach(x => {
      addBlock(dividerT, dividerH, rowSplitZ - backZ0, x, dividerH / 2, (backZ0 + rowSplitZ) / 2);
    });

    // 掀開的上蓋：以盒子後緣為轉軸往後打開，前緣有一道折邊
    const hinge = new THREE.Group();
    hinge.position.set(0, h, -d / 2);
    hinge.rotation.x = -THREE.MathUtils.degToRad(104);
    box.add(hinge);
    addBlock(w, 0.15, d, 0, 0.075, d / 2, paper, hinge);
    addBlock(w, 0.9, 0.15, 0, -0.3, d, paper, hinge);
  }

  // 選格呼吸燈：格子上緣一圈發光框 + 格底淡淡的藍色
  buildHighlights() {
    this.highlightMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.9, depthWrite: false });
    const fillMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.14, depthWrite: false });
    this.highlights = {};

    [0, 1, 2, 'main'].forEach(key => {
      const c = COMPARTMENTS[key];
      const { x: cx, z: cz, w: cw, d: cd } = compCenter(key);
      const y = BOX.dividerH + 0.12;
      const t = 0.16;
      const group = new THREE.Group();

      [
        [cw + t, c.z0, true], [cw + t, c.z1, true],
        [cd, c.x0, false], [cd, c.x1, false]
      ].forEach(([len, at, alongX]) => {
        const bar = new THREE.Mesh(
          new THREE.BoxGeometry(alongX ? len : t, t, alongX ? t : len),
          this.highlightMat
        );
        bar.position.set(alongX ? cx : at, y, alongX ? at : cz);
        group.add(bar);
      });

      const fill = new THREE.Mesh(new THREE.PlaneGeometry(cw, cd), fillMat);
      fill.rotation.x = -Math.PI / 2;
      fill.position.set(cx, BOX.floor + 0.02, cz);
      group.add(fill);

      group.visible = false;
      this.scene.add(group);
      this.highlights[key] = group;
    });
  }

  buildLabels() {
    this.sideTags = [0, 1, 2].map(() => {
      const el = document.createElement('div');
      el.className = 'bento-tag';
      el.innerHTML = '<span class="bento-tag-name"></span><span class="bento-tag-meta"></span>';
      this.labelLayer.appendChild(el);
      return { el, name: el.firstChild, meta: el.lastChild };
    });
  }

  // 點一下（沒有拖曳）才算選格，拖曳是轉動
  // 判斷方式：視線打到「菜的高度」那層水平面，看落點在哪一格，從任何角度點都準
  setupPicking() {
    const el = this.renderer.domElement;
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const foodPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.2);
    const hitPoint = new THREE.Vector3();
    const pad = 0.15;
    let down = null;

    el.addEventListener('pointerdown', e => {
      down = { x: e.clientX, y: e.clientY };
    });
    el.addEventListener('pointerup', e => {
      const isTap = down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6;
      down = null;
      if (!isTap) return;

      const rect = el.getBoundingClientRect();
      ndc.set(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      raycaster.setFromCamera(ndc, this.camera);
      if (!raycaster.ray.intersectPlane(foodPlane, hitPoint)) return;
      const key = [0, 1, 2, 'main'].find(k => {
        const c = COMPARTMENTS[k];
        return hitPoint.x >= c.x0 - pad && hitPoint.x <= c.x1 + pad &&
               hitPoint.z >= c.z0 - pad && hitPoint.z <= c.z1 + pad;
      });
      if (key !== undefined) onCanvasSlotClick(key);
    });
  }

  resize() {
    const w = this.container.clientWidth;
    const h = this.container.clientHeight;
    if (!w || !h) return;
    this.size = { w, h };
    // 畫布矮的時候標籤只留菜名，避免三格標籤疊在一起
    this.labelLayer.classList.toggle('compact', h < 230);
    this.renderer.setSize(w, h);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  // 預設視角：從前上方斜看；畫面越窄就退越遠，整個盒子才放得進來
  homePosition() {
    const dist = 31 * Math.max(1, 1.6 / this.camera.aspect);
    return this.homeDir.clone().multiplyScalar(dist).add(this.controls.target);
  }

  resetView(animate = true) {
    const to = this.homePosition();
    if (!animate) {
      this.camera.position.copy(to);
      this.controls.update();
      return;
    }
    const target = this.controls.target;
    const from = new THREE.Spherical().setFromVector3(this.camera.position.clone().sub(target));
    const end = new THREE.Spherical().setFromVector3(to.clone().sub(target));
    // 水平角走最短的那一邊
    let dTheta = end.theta - from.theta;
    dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
    this.camTween = { from, end, dTheta, start: performance.now(), dur: 650 };
    playTone(500, 'sine', 0.06);
  }

  toScreen(x, y, z) {
    const v = this.tmpVec.set(x, y, z).project(this.camera);
    return { x: (v.x * 0.5 + 0.5) * this.size.w, y: (-v.y * 0.5 + 0.5) * this.size.h };
  }

  tick(now) {
    // 回正視角動畫
    if (this.camTween) {
      const tw = this.camTween;
      const k = easeOutCubic(Math.min(1, (now - tw.start) / tw.dur));
      const s = new THREE.Spherical(
        tw.from.radius + (tw.end.radius - tw.from.radius) * k,
        tw.from.phi + (tw.end.phi - tw.from.phi) * k,
        tw.from.theta + tw.dTheta * k
      );
      this.camera.position.setFromSpherical(s).add(this.controls.target);
      if (k >= 1) this.camTween = null;
    }
    this.controls.update();

    // 放菜：從上方掉進格子裡彈兩下
    this.drops = this.drops.filter(dr => {
      const t = Math.min(1, (now - dr.start) / dr.dur);
      dr.obj.position.y = dr.fromY + (dr.toY - dr.fromY) * easeOutBounce(t);
      return t < 1;
    });

    // 選格呼吸燈
    this.highlightMat.opacity = 0.4 + 0.55 * (0.5 + 0.5 * Math.sin(now / 210));

    this.renderer.render(this.scene, this.camera);

    // 小格標籤跟著格子在畫面上的位置走；轉到盒子背面（被上蓋擋住）時先藏起來
    this.labelLayer.classList.toggle('from-back', this.camera.position.z < -BOX.d / 2);
    this.sideTags.forEach((tag, i) => {
      const c = compCenter(i);
      const p = this.toScreen(c.x, BOX.h + 0.6, c.z);
      tag.el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -100%)`;
    });
  }

  makeFood(id, sizeKey) {
    const mesh = new THREE.Mesh(getMoundGeometry(sizeKey), getDishMaterial(id));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  dropIn(obj) {
    const toY = obj.position.y;
    const fromY = toY + 7;
    obj.position.y = fromY;
    this.drops.push({ obj, fromY, toY, start: performance.now(), dur: 560 });
  }

  // 依目前 state 重新擺放飯、配菜、主菜，更新高亮與標籤
  refresh(animatedSlot = null) {
    this.drops = [];
    this.foodGroup.clear();
    const floorY = BOX.floor;
    const main = COMPARTMENTS.main;
    const mc = compCenter('main');

    // 前方大格的飯：飯量越多越寬越厚，從左邊開始鋪
    const rice = getRiceInfo();
    let riceSpan = null;
    if (rice) {
      const ratio = rice.portion.ratio;
      const rw = mc.w * (0.26 + ratio * 0.74);
      const rd = mc.d - 0.3;
      const rh = 1.0 + ratio * 1.3;
      const mat = getRiceMaterial(rice.type, state.hasBraisedSauce);
      mat.map.repeat.set(rw / 4, rd / 4);
      const mesh = new THREE.Mesh(getRiceGeometry(ratio, rw, rd, rh), mat);
      mesh.position.set(main.x0 + rw / 2, floorY, mc.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      this.foodGroup.add(mesh);
      riceSpan = { x0: main.x0 + 0.6, x1: main.x0 + rw - 0.6, top: floorY + rh * 0.85 };
    }

    // 後方三小格配菜
    state.sideSlots.forEach((dish, i) => {
      if (!dish) return;
      const c = compCenter(i);
      const mesh = this.makeFood(dish.id, 'side');
      mesh.position.set(c.x, floorY + 0.02, c.z);
      this.foodGroup.add(mesh);
      if (animatedSlot === i) this.dropIn(mesh);
    });

    // 前方大格：主菜與加點疊在飯上，有飯的地方墊高
    const total = state.mainAddons.length;
    state.mainAddons.forEach((dish, idx) => {
      const x = total === 1 ? mc.x : main.x0 + mc.w * (0.19 + 0.63 * (idx / (total - 1)));
      const z = mc.z + (idx % 2 ? -0.7 : 0.5);
      const onRice = riceSpan && x >= riceSpan.x0 && x <= riceSpan.x1;
      const mesh = this.makeFood(dish.id, dish.isBigMain ? 'big' : 'small');
      mesh.position.set(x, (onRice ? riceSpan.top : floorY + 0.02) + idx * 0.06, z);
      mesh.rotation.y = idx % 2 ? 0.12 : -0.08;
      this.foodGroup.add(mesh);
      if (animatedSlot === 'main' && idx === total - 1) this.dropIn(mesh);
    });

    // 選格高亮：② 亮目前要放菜的小格，① ③ 亮前方大格
    const target = String(state.step === 2 ? state.selectedSide : 'main');
    Object.entries(this.highlights).forEach(([key, group]) => {
      group.visible = key === target;
    });

    // 小格標籤 + 大格合計
    state.sideSlots.forEach((dish, i) => {
      const tag = this.sideTags[i];
      const isSel = state.step === 2 && state.selectedSide === i;
      tag.name.textContent = dish ? dish.name : (isSel ? `📍格${i + 1}(待選菜)` : `格${i + 1}(空)`);
      tag.meta.textContent = dish ? `${dish.weight}g·${dish.kcal}卡` : '';
      tag.el.classList.toggle('empty', !dish);
      tag.el.classList.toggle('selected', isSel);
    });
    this.mainLabel.textContent = getMainLabelText();
  }

  // 放菜時的浮動文字特效 (+80g | +115kcal | +$15)
  spawnFloatingTag(slotKey, text) {
    const c = compCenter(slotKey in COMPARTMENTS ? slotKey : 'main');
    const p = this.toScreen(c.x, BOX.h + 1.4, c.z);
    const el = document.createElement('div');
    el.className = 'bento-float';
    el.textContent = text;
    el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -50%)`;
    el.addEventListener('animationend', () => el.remove());
    this.labelLayer.appendChild(el);
  }
}

function show3DError() {
  const hint = document.getElementById('bento-hint');
  hint.textContent = '⚠️ 3D 便當盒載入失敗（請確認網路），點餐功能仍可正常使用';
  hint.classList.remove('hide');
  document.getElementById('bento-reset').hidden = true;
}

/**
 * ============================================================================
 * 6. 三步驟點餐流程（① 選飯 → ② 配菜 → ③ 主菜）與算錢・算卡路里・算重量
 * ============================================================================
 */
const STEP_NEXT_LABELS = {
  1: '下一步：配菜 →',
  2: '下一步：主菜 →',
  3: '🧾 結帳明細'
};

// 目前的飯（飯種 × 飯量）；還沒選飯種時回傳 null
function getRiceInfo() {
  const type = RICE_TYPES.find(t => t.id === state.riceType);
  if (!type) return null;
  const portion = RICE_PORTIONS[state.ricePortion];
  return {
    type,
    portion,
    label: `${type.name}・${portion.label}`,
    shortLabel: `${type.short}・${portion.label}`,
    weight: portion.weight,
    kcal: Math.round(portion.weight * type.kcalPerG),
    price: portion.price + type.surcharge
  };
}

function setText(id, text) {
  document.getElementById(id).textContent = text;
}

function render(animatedSlot = null) {
  updateUI();
  if (bentoView) bentoView.refresh(animatedSlot);
}

function floatTag(slotKey, text) {
  if (bentoView) bentoView.spawnFloatingTag(slotKey, text);
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

// 菜色縮圖只畫一次，之後重複使用（避免每次點菜都重畫 30 張 canvas）
const thumbCache = {};
function getDishThumb(id) {
  if (!thumbCache[id]) {
    const cvs = document.createElement('canvas');
    cvs.width = 108;
    cvs.height = 84;
    drawCulinaryDish(cvs.getContext('2d'), id, 108, 84);
    thumbCache[id] = cvs.toDataURL();
  }
  return thumbCache[id];
}

// ---------- 步驟切換 ----------

// 還沒選飯種前，② ③ 步驟鎖住
function goToStep(step) {
  if (step < 1 || step > 3) return false;
  if (step > 1 && !state.riceType) {
    playTone(220, 'square', 0.08);
    showToast('請先選飯種：白米飯／紫米飯／糙米飯');
    return false;
  }
  if (step === 2 && state.step !== 2) {
    // 進入配菜步驟時，自動指向第一個空小格
    const emptyIdx = state.sideSlots.indexOf(null);
    state.selectedSide = emptyIdx !== -1 ? emptyIdx : 0;
  }
  state.step = step;
  playTone(460, 'triangle', 0.06);
  render();
  return true;
}

function goNextStep() {
  if (state.step < 3) {
    goToStep(state.step + 1);
  } else {
    openCheckoutModal();
  }
}

// 點畫布：小格 → ② 並指定該格；大格同時是飯與主菜，在 ② 時跳到 ③，其餘維持原步驟
function onCanvasSlotClick(slotKey) {
  if (slotKey === 'main') {
    if (state.step === 2) goToStep(3);
    return;
  }
  if (state.step !== 2 && !goToStep(2)) return;
  selectSide(slotKey);
}

function selectSide(idx) {
  state.selectedSide = idx;
  playTone(520, 'sine', 0.06);
  render();
}

// ---------- ① 選飯 ----------

function selectRiceType(typeId) {
  state.riceType = typeId;
  playTone(560, 'triangle', 0.08);
  render();
  const rice = getRiceInfo();
  floatTag('main', `${rice.label} ${rice.weight}g | ${rice.kcal}kcal | $${rice.price}`);
}

function setRicePortion(ratio) {
  state.ricePortion = ratio;
  playTone(340 + ratio * 220, 'sine', 0.08);
  render();
  const rice = getRiceInfo();
  if (rice) floatTag('main', `${rice.label} ${rice.weight}g | ${rice.kcal}kcal | $${rice.price}`);
}

function toggleBraisedSauce() {
  if (!state.riceType) {
    playTone(220, 'square', 0.08);
    showToast('請先選飯種，再決定要不要淋滷汁');
    return;
  }
  state.hasBraisedSauce = !state.hasBraisedSauce;
  playTone(state.hasBraisedSauce ? 580 : 320, 'sine', 0.08);
  render();
  if (state.hasBraisedSauce) {
    floatTag('main', `+淋滷肉燥汁 +${BRAISED_SAUCE.weight}g | +$${BRAISED_SAUCE.price}`);
  }
}

// ---------- ② 配菜 / ③ 主菜 ----------

function handleDishClick(dishId, type) {
  if (type === 'side') {
    const dish = SIDE_DISHES.find(d => d.id === dishId);
    if (!dish) return;

    const targetSlot = state.selectedSide;
    const wasEmpty = state.sideSlots[targetSlot] === null;
    state.sideSlots[targetSlot] = dish;
    playTone(620, 'triangle', 0.09);

    // 還有空小格就自動跳到下一格方便連續點菜；三格都滿了則留在原格方便直接換菜
    const nextEmpty = state.sideSlots.indexOf(null);
    if (nextEmpty !== -1) {
      state.selectedSide = nextEmpty;
    } else if (wasEmpty) {
      showToast('三格配菜都選好了！按「下一步」選主菜');
    }

    render(targetSlot);
    floatTag(targetSlot, `${dish.name} ${dish.weight}g | ${dish.kcal}kcal | +$${dish.price}`);
  } else {
    const dish = MAIN_DISHES.find(d => d.id === dishId);
    if (!dish) return;

    if (state.mainAddons.length >= MAX_MAIN_ADDONS) {
      playTone(220, 'square', 0.08);
      showToast(`大格最多放 ${MAX_MAIN_ADDONS} 樣，請先按「−」拿掉一樣`);
      return;
    }
    state.mainAddons.push(dish);
    playTone(500, 'square', 0.09);

    render('main');
    floatTag('main', `+${dish.name} ${dish.weight}g | ${dish.kcal}kcal | +$${dish.price}`);
  }
}

function removeDish(dishId, type) {
  playTone(280, 'sine', 0.08);

  if (type === 'side') {
    // 優先拿掉目前選中那格；同一道菜放了兩格時才不會拿錯
    const idx = state.sideSlots[state.selectedSide]?.id === dishId
      ? state.selectedSide
      : state.sideSlots.findIndex(d => d && d.id === dishId);
    if (idx !== -1) {
      state.sideSlots[idx] = null;
      state.selectedSide = idx;
    }
  } else {
    const idx = state.mainAddons.map(d => d.id).lastIndexOf(dishId);
    if (idx !== -1) state.mainAddons.splice(idx, 1);
  }

  render();
}

// 計算總重量 (g)、總卡路里 (kcal)、總金額 ($) 與套餐優惠
function calculateTotals() {
  const rice = getRiceInfo();
  let totalWeight = 0;
  let totalKcal = 0;
  let rawPrice = 0;

  if (rice) {
    totalWeight += rice.weight;
    totalKcal += rice.kcal;
    rawPrice += rice.price;

    if (state.hasBraisedSauce) {
      totalWeight += BRAISED_SAUCE.weight;
      totalKcal += BRAISED_SAUCE.kcal;
      rawPrice += BRAISED_SAUCE.price;
    }
  }

  let filledSideCount = 0;
  state.sideSlots.forEach(d => {
    if (d) {
      filledSideCount++;
      totalWeight += d.weight;
      totalKcal += d.kcal;
      rawPrice += d.price;
    }
  });

  let hasBigMain = false;
  state.mainAddons.forEach(d => {
    totalWeight += d.weight;
    totalKcal += d.kcal;
    rawPrice += d.price;
    if (d.isBigMain) hasBigMain = true;
  });

  // 湊齊「三格配菜 + 任一主菜肉排」享便當套餐折抵
  const discount = (filledSideCount === 3 && hasBigMain) ? COMBO_DISCOUNT : 0;
  const finalPrice = Math.max(0, rawPrice - discount);

  return { totalWeight, totalKcal, rawPrice, discount, finalPrice, filledSideCount, hasBigMain };
}

// ---------- 建立介面元素（只在啟動時跑一次） ----------

const riceCardRefs = {};
function buildRiceTypeCards() {
  const grid = document.getElementById('rice-type-grid');
  RICE_TYPES.forEach(t => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'rice-type-card';
    card.innerHTML = `
      <span class="dish-badge-count" hidden>✓</span>
      <span class="dish-thumb-wrap"><img class="dish-thumb" src="${getDishThumb('rice_' + t.id)}" alt=""></span>
      <span class="rice-type-name">${t.name}</span>
      <span class="rice-type-desc">${t.desc}</span>
      <span class="dish-meta"><span class="k-tag"></span> · ${t.surcharge ? `加 $${t.surcharge}` : '不加價'}</span>
      <span class="dish-price-tag"></span>`;
    card.onclick = () => selectRiceType(t.id);
    grid.appendChild(card);
    riceCardRefs[t.id] = {
      card,
      badge: card.querySelector('.dish-badge-count'),
      kcal: card.querySelector('.k-tag'),
      price: card.querySelector('.dish-price-tag')
    };
  });
}

const dishCardRefs = { side: {}, main: {} };
function buildDishGrid(gridId, groups, type) {
  const grid = document.getElementById(gridId);
  groups.forEach(group => {
    if (group.title) {
      const title = document.createElement('div');
      title.className = 'grid-section-title';
      title.textContent = group.title;
      grid.appendChild(title);
    }
    group.dishes.forEach(dish => {
      const card = document.createElement('div');
      card.className = 'dish-card';
      card.innerHTML = `
        <button class="dish-pick" type="button">
          <span class="dish-thumb-wrap"><img class="dish-thumb" src="${getDishThumb(dish.id)}" alt=""></span>
          <span class="dish-name">${dish.name}</span>
          <span class="dish-meta"><span class="w-tag">${dish.weight}g</span> · <span class="k-tag">${dish.kcal}卡</span></span>
          <span class="dish-price-tag">$${dish.price}</span>
        </button>
        <button class="dish-remove-btn" type="button" aria-label="拿掉${dish.name}" hidden>−</button>
        <span class="dish-badge-count" hidden></span>`;
      card.querySelector('.dish-pick').onclick = () => handleDishClick(dish.id, type);
      card.querySelector('.dish-remove-btn').onclick = () => removeDish(dish.id, type);
      grid.appendChild(card);
      dishCardRefs[type][dish.id] = {
        card,
        removeBtn: card.querySelector('.dish-remove-btn'),
        badge: card.querySelector('.dish-badge-count')
      };
    });
  });
}

function buildCashButtons() {
  const wrap = document.getElementById('cash-btns');
  const options = [{ key: 'exact', label: '付剛好' }, ...CASH_BILLS.map(b => ({ key: b, label: `$${b}` }))];
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cash-btn';
    btn.textContent = opt.label;
    btn.dataset.key = opt.key;
    btn.onclick = () => setCashChoice(opt.key);
    wrap.appendChild(btn);
  });
}

// ---------- 更新畫面 ----------

function updateUI() {
  const totals = calculateTotals();
  const rice = getRiceInfo();

  // 1. 頂部三合一數據
  setText('ui-total-weight', `${totals.totalWeight} g`);
  setText('ui-total-kcal', `${totals.totalKcal} kcal`);
  setText('ui-total-price', `NT$ ${totals.finalPrice}`);

  // 2. 三步驟導覽與面板切換
  const stepDone = { 1: !!rice, 2: totals.filledSideCount === 3, 3: totals.hasBigMain };
  const stepSub = {
    1: rice ? `${rice.label}${state.hasBraisedSauce ? '+滷汁' : ''}` : '白米／紫米／糙米',
    2: `已選 ${totals.filledSideCount}/3 格`,
    3: state.mainAddons.length > 0 ? state.mainAddons.map(d => d.name).join('、') : '主菜・加點'
  };
  [1, 2, 3].forEach(n => {
    const isActive = state.step === n;
    const showDone = stepDone[n] && !isActive;
    const tab = document.getElementById(`step-tab-${n}`);
    tab.classList.toggle('active', isActive);
    tab.classList.toggle('done', showDone);
    tab.classList.toggle('locked', n > 1 && !rice);
    if (isActive) tab.setAttribute('aria-current', 'step');
    else tab.removeAttribute('aria-current');
    setText(`step-num-${n}`, showDone ? '✓' : n);
    setText(`step-sub-${n}`, stepSub[n]);
    document.getElementById(`panel-${n}`).hidden = !isActive;
  });

  updateRiceStep(rice);
  updateSideStep();
  updateMainStep();
  updateBottomBar(totals, rice);
}

function updateRiceStep(rice) {
  const sauce = rice && state.hasBraisedSauce ? BRAISED_SAUCE : null;
  setText('ui-rice-detail', rice
    ? `飯小計 ${rice.weight + (sauce ? sauce.weight : 0)}g · ${rice.kcal + (sauce ? sauce.kcal : 0)}kcal · $${rice.price + (sauce ? sauce.price : 0)}`
    : '先選一種飯 👇');

  // 飯種卡片：熱量與價格跟著目前飯量變動
  const portion = RICE_PORTIONS[state.ricePortion];
  RICE_TYPES.forEach(t => {
    const ref = riceCardRefs[t.id];
    const isSel = state.riceType === t.id;
    ref.card.classList.toggle('selected', isSel);
    ref.card.setAttribute('aria-pressed', isSel);
    ref.badge.hidden = !isSel;
    ref.kcal.textContent = `${Math.round(portion.weight * t.kcalPerG)}卡`;
    ref.price.textContent = `$${portion.price + t.surcharge}`;
  });

  // 飯量按鈕：價格含飯種加價
  const surcharge = rice ? rice.type.surcharge : 0;
  document.querySelectorAll('.rice-btn[data-ratio]').forEach(btn => {
    const p = RICE_PORTIONS[btn.dataset.ratio];
    const isSel = p.ratio === state.ricePortion;
    btn.classList.toggle('active', isSel);
    btn.setAttribute('aria-pressed', isSel);
    btn.querySelector('small').textContent = `${p.weight}g·$${p.price + surcharge}`;
  });

  const lurouBtn = document.getElementById('btn-lurou');
  lurouBtn.classList.toggle('active', state.hasBraisedSauce);
  lurouBtn.setAttribute('aria-pressed', state.hasBraisedSauce);
}

function updateSideStep() {
  [0, 1, 2].forEach(i => {
    const tab = document.getElementById(`slot-tab-${i}`);
    const isSel = state.selectedSide === i;
    tab.classList.toggle('active', isSel);
    tab.setAttribute('aria-pressed', isSel);
    const d = state.sideSlots[i];
    setText(`slot-sub-${i}`, d ? `${d.name}(${d.weight}g)` : '空・待選菜');
  });
  setText('ui-side-hint', `放進：【${SLOT_LABELS[state.selectedSide]}】`);
  updateDishGrid('side', state.sideSlots.filter(Boolean));
}

function updateMainStep() {
  setText('ui-main-hint', `疊在飯上・已選 ${state.mainAddons.length}/${MAX_MAIN_ADDONS} 樣`);
  updateDishGrid('main', state.mainAddons);
}

function updateDishGrid(type, picked) {
  Object.entries(dishCardRefs[type]).forEach(([id, ref]) => {
    const count = picked.filter(d => d.id === id).length;
    ref.card.classList.toggle('selected', count > 0);
    ref.removeBtn.hidden = count === 0;
    ref.badge.hidden = count === 0;
    ref.badge.textContent = count > 1 ? `×${count}` : '✓';
  });
}

function updateBottomBar(totals, rice) {
  // 套餐優惠進度：還差什麼直接講清楚
  const dealEl = document.getElementById('ui-deal-hint');
  if (totals.discount > 0) {
    dealEl.textContent = `🎁 已湊滿套餐（3 格配菜 + 主菜），折 $${COMBO_DISCOUNT}`;
  } else {
    const missing = [];
    if (totals.filledSideCount < 3) missing.push(`配菜 ${3 - totals.filledSideCount} 格`);
    if (!totals.hasBigMain) missing.push('主菜 1 道');
    dealEl.textContent = `🎁 再選 ${missing.join(' + ')}，套餐折 $${COMBO_DISCOUNT}`;
  }
  dealEl.classList.toggle('unlocked', totals.discount > 0);

  document.getElementById('btn-back').hidden = state.step === 1;

  const nextBtn = document.getElementById('btn-next');
  nextBtn.disabled = state.step === 1 && !rice;
  nextBtn.classList.toggle('ready',
    (state.step === 2 && totals.filledSideCount === 3) || (state.step === 3 && totals.hasBigMain));
  setText('ui-next-label', nextBtn.disabled ? '請先選飯種' : STEP_NEXT_LABELS[state.step]);
  setText('ui-checkout-btn-text', `NT$ ${totals.finalPrice}`);
}

// ---------- 頂部按鈕 ----------

// 隨機配好一個豐盛便當
function randomBento() {
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  state.riceType = pick(RICE_TYPES).id;
  state.ricePortion = pick(Object.values(RICE_PORTIONS)).ratio;
  state.hasBraisedSauce = Math.random() > 0.45;

  const shuffledSides = [...SIDE_DISHES].sort(() => Math.random() - 0.5);
  state.sideSlots = shuffledSides.slice(0, 3);
  state.mainAddons = [
    pick(MAIN_DISHES.filter(d => d.isBigMain)),
    pick(MAIN_DISHES.filter(d => !d.isBigMain))
  ];
  state.step = 3;

  playTone(680, 'triangle', 0.12);
  render();
}

// 清空重裝：回到 ① 選飯
function clearAll() {
  Object.assign(state, {
    step: 1,
    riceType: null,
    ricePortion: 1.0,
    hasBraisedSauce: false,
    selectedSide: 0,
    sideSlots: [null, null, null],
    mainAddons: []
  });
  playTone(300, 'sine', 0.1);
  render();
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  try {
    localStorage.setItem('bento-sound', state.soundOn ? '1' : '0');
  } catch (e) {}
  updateSoundButton();
  playTone(600, 'sine', 0.06);
}

function updateSoundButton() {
  const btn = document.getElementById('btn-sound');
  btn.textContent = state.soundOn ? '🔊' : '🔇';
  btn.setAttribute('aria-pressed', state.soundOn);
}

// ---------- 結帳與找錢明細 Modal ----------

function openCheckoutModal() {
  playTone(740, 'triangle', 0.12);
  const totals = calculateTotals();
  const rice = getRiceInfo();
  const rows = [];

  if (rice) {
    rows.push({
      title: `【① 飯】${rice.label}`,
      sub: `重量 ${rice.weight}g ｜ 熱量 ${rice.kcal} kcal${rice.type.surcharge ? ` ｜ 含${rice.type.short}加價 $${rice.type.surcharge}` : ''}`,
      price: rice.price
    });
    if (state.hasBraisedSauce) {
      rows.push({
        title: `【① 飯・加醬】${BRAISED_SAUCE.name}`,
        sub: `重量 ${BRAISED_SAUCE.weight}g ｜ 熱量 ${BRAISED_SAUCE.kcal} kcal`,
        price: BRAISED_SAUCE.price
      });
    }
  } else {
    rows.push({ title: '【① 飯】（尚未選飯）', sub: '重量 0g ｜ 熱量 0 kcal', price: 0, muted: true });
  }

  state.sideSlots.forEach((d, i) => {
    rows.push(d
      ? { title: `【② 配菜・格${i + 1}】${d.name}`, sub: `重量 ${d.weight}g ｜ 熱量 ${d.kcal} kcal`, price: d.price }
      : { title: `【② 配菜・格${i + 1}】（空）`, sub: '重量 0g ｜ 熱量 0 kcal', price: 0, muted: true });
  });

  if (state.mainAddons.length === 0) {
    rows.push({ title: '【③ 主菜】（未選）', sub: '重量 0g ｜ 熱量 0 kcal', price: 0, muted: true });
  }
  state.mainAddons.forEach(d => {
    rows.push({
      title: `【③ ${d.isBigMain ? '主菜' : '加點'}】${d.name}`,
      sub: `重量 ${d.weight}g ｜ 熱量 ${d.kcal} kcal`,
      price: d.price
    });
  });

  document.getElementById('receipt-items').innerHTML = rows.map(r => `
    <div class="receipt-row${r.muted ? ' muted' : ''}">
      <div class="receipt-row-left">
        <strong>${r.title}</strong>
        <span class="receipt-row-sub">${r.sub}</span>
      </div>
      <div class="receipt-price">NT$ ${r.price}</div>
    </div>`).join('');

  document.getElementById('receipt-summary').innerHTML = `
    <div class="summary-line"><span>⚖️ 便當總重量：</span><span>${totals.totalWeight} g</span></div>
    <div class="summary-line"><span>🔥 便當總熱量：</span><span>${totals.totalKcal} kcal</span></div>
    <div class="summary-line"><span>原價小計：</span><span>NT$ ${totals.rawPrice}</span></div>
    ${totals.discount > 0 ? `<div class="summary-line discount"><span>🎁 三菜一主菜套餐折抵：</span><span>- NT$ ${totals.discount}</span></div>` : ''}
    <div class="summary-line total"><span>應付總金額：</span><span>NT$ ${totals.finalPrice}</span></div>
  `;

  // 不預設顧客身上有多少錢：每次結帳都從「未選」開始
  state.cashChoice = null;
  state.customCash = null;
  document.getElementById('cash-input').value = '';
  updateCashChangeUI();

  document.getElementById('checkout-modal').classList.add('show');
}

function closeCheckoutModal() {
  document.getElementById('checkout-modal').classList.remove('show');
}

function setCashChoice(key) {
  state.cashChoice = key;
  state.customCash = null;
  document.getElementById('cash-input').value = '';
  playTone(560, 'sine', 0.05);
  updateCashChangeUI();
}

function setPaidCashFromInput(value) {
  const amount = Math.floor(Number(value));
  if (value === '' || !Number.isFinite(amount) || amount < 0) {
    state.cashChoice = null;
    state.customCash = null;
  } else {
    state.cashChoice = 'custom';
    state.customCash = amount;
  }
  updateCashChangeUI();
}

function getPaidAmount(finalPrice) {
  switch (state.cashChoice) {
    case null: return null;
    case 'exact': return finalPrice;
    case 'custom': return state.customCash;
    default: return state.cashChoice;
  }
}

function updateCashChangeUI() {
  const { finalPrice } = calculateTotals();

  document.querySelectorAll('#cash-btns .cash-btn').forEach(btn => {
    const key = btn.dataset.key === 'exact' ? 'exact' : Number(btn.dataset.key);
    btn.classList.toggle('active', state.cashChoice === key);
    btn.classList.toggle('short', key !== 'exact' && key < finalPrice);
  });

  const paid = getPaidAmount(finalPrice);
  const resEl = document.getElementById('cash-change-result');
  resEl.classList.toggle('pending', paid === null);
  resEl.classList.toggle('short', paid !== null && paid < finalPrice);

  if (paid === null) {
    resEl.textContent = `應付 NT$ ${finalPrice}，請點選或輸入顧客付了多少`;
  } else if (paid < finalPrice) {
    resEl.textContent = `⚠️ 付 $${paid} 不足，還差 NT$ ${finalPrice - paid}`;
  } else {
    resEl.textContent = `✅ 收您 $${paid}，應找零 NT$ ${paid - finalPrice}`;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCheckoutModal();
});

// 初始化介面與 3D 便當盒
window.onload = function () {
  try {
    state.soundOn = localStorage.getItem('bento-sound') !== '0';
  } catch (e) {}

  buildRiceTypeCards();
  buildDishGrid('grid-side', [{ dishes: SIDE_DISHES }], 'side');
  buildDishGrid('grid-main', [
    { title: '🍖 主菜', dishes: MAIN_DISHES.filter(d => d.isBigMain) },
    { title: '🥚 加點', dishes: MAIN_DISHES.filter(d => !d.isBigMain) }
  ], 'main');
  buildCashButtons();
  updateSoundButton();
  updateUI();

  // Three.js 從 CDN 以 module 載入；載入失敗或裝置不支援 WebGL 時，點餐功能照常可用
  const start3D = () => {
    if (bentoView) return;
    try {
      bentoView = new Bento3D(document.getElementById('bento-3d'));
    } catch (e) {
      console.error(e);
      show3DError();
    }
  };
  if (window.THREE && window.OrbitControls) {
    start3D();
  } else {
    window.addEventListener('three-ready', start3D, { once: true });
    setTimeout(() => { if (!bentoView) show3DError(); }, 10000);
  }
};
</script>
