<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打造你的台式便當 - Build Your Bento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phaser 3 Game Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-navy: #070b19;
            --bg-card: #11182d;
            --accent-orange: #ea580c;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #03060c;
            color: #f8fafc;
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
        }

        .serif-title {
            font-family: 'Playfair Display', 'Noto Sans TC', serif;
        }

        /* Custom subtle scrollbar for ingredient tray if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Ingredient circle button animations */
        .ingredient-btn {
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .ingredient-btn:active {
            transform: scale(0.92);
        }
        .ingredient-selected {
            border-color: #f97316 !important;
            box-shadow: 0 0 16px rgba(249, 115, 22, 0.35), inset 0 0 10px rgba(249, 115, 22, 0.18);
        }

        /* Badge pop animation */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .badge-pop {
            animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Price bump animation */
        @keyframes priceBump {
            0% { transform: scale(1); }
            50% { transform: scale(1.14); color: #fde047; }
            100% { transform: scale(1); }
        }
        .price-bump {
            animation: priceBump 0.25s ease-out;
        }

        /* Phone shell glow on desktop */
        .app-shell {
            background: radial-gradient(circle at 50% 34%, #172342 0%, #090e1f 58%, #060914 100%);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center sm:py-4">

    <!-- Mobile App Container -->
    <div class="app-shell w-full max-w-[440px] min-h-screen sm:min-h-[860px] sm:max-h-[920px] sm:rounded-[38px] flex flex-col justify-between relative overflow-hidden">

        <!-- TOP NAVIGATION & HEADER -->
        <header class="pt-3 pb-1 px-5 z-20 flex flex-col items-center">
            <!-- Top Row Icons (matching reference app UI) -->
            <div class="w-full flex items-center justify-between mb-2">
                <!-- Challenge / Customer Order Mode Button -->
                <button id="btn-challenge" onclick="toggleChallengeMode()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-slate-800/70 hover:bg-slate-700/80 border border-slate-700/80 text-xs text-slate-200 transition active:scale-95" title="阿姨出題挑戰">
                    <span class="text-amber-400">🎯</span>
                    <span id="challenge-btn-text" class="font-medium">阿姨出題</span>
                </button>

                <!-- Center Brand Emblem -->
                <div class="flex flex-col items-center">
                    <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-md shadow-orange-500/20">
                        <span class="text-sm font-black text-slate-950">🍱</span>
                    </div>
                </div>

                <!-- Right Action Icons: Reset & Order Bag -->
                <div class="flex items-center gap-2.5">
                    <button onclick="resetBento()" class="w-8 h-8 rounded-full bg-slate-800/70 hover:bg-slate-700 border border-slate-700/80 flex items-center justify-center text-slate-300 hover:text-white transition active:rotate-[-90deg]" title="清空重裝">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>

                    <button onclick="openHistoryModal()" class="relative w-8 h-8 rounded-full bg-slate-800/70 hover:bg-slate-700 border border-slate-700/80 flex items-center justify-center text-slate-300 hover:text-white transition" title="已結帳便當袋">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                        <span id="bag-count-badge" class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-orange-500 text-[10px] font-bold text-white flex items-center justify-center shadow">0</span>
                    </button>
                </div>
            </div>

            <!-- Main App Title (Build your bento) -->
            <div class="text-center mb-2">
                <h1 class="text-2xl sm:text-[26px] font-bold tracking-tight text-slate-100 leading-tight">
                    <span class="serif-title">Build your</span>
                    <span class="serif-title italic text-amber-400 font-bold ml-1">台式便當</span>
                </h1>
            </div>

            <!-- Challenge Banner (Hidden unless Challenge Mode is active) -->
            <div id="challenge-banner" class="hidden w-full mb-2 px-3 py-1.5 rounded-xl bg-amber-500/15 border border-amber-400/40 text-amber-200 text-xs flex items-center justify-between">
                <div class="flex items-center gap-1.5 truncate">
                    <span class="text-sm">👩‍🍳</span>
                    <span id="challenge-desc" class="truncate font-medium">任務：滷肉飯 + 3配菜 + 炸雞腿</span>
                </div>
                <button onclick="generateNewChallenge()" class="ml-2 text-[11px] bg-amber-400/20 hover:bg-amber-400/30 px-2 py-0.5 rounded text-amber-300 shrink-0">換一題</button>
            </div>

            <!-- Rice Base Toggle Pill (Matches Beef / Chicken toggle in screenshot) -->
            <div class="inline-flex p-1 rounded-full bg-slate-900/90 border border-slate-800 shadow-inner">
                <button id="rice-btn-white" onclick="selectRice('white')" class="rice-pill px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-sky-100 text-slate-900 shadow">
                    白飯 <span class=" opacity-75 font-normal">$15</span>
                </button>
                <button id="rice-btn-braised" onclick="selectRice('braised')" class="rice-pill px-3.5 py-1 rounded-full text-xs font-bold transition-all text-slate-400 hover:text-slate-200">
                    滷肉飯 <span class="opacity-75 font-normal">$25</span>
                </button>
                <button id="rice-btn-purple" onclick="selectRice('purple')" class="rice-pill px-3.5 py-1 rounded-full text-xs font-bold transition-all text-slate-400 hover:text-slate-200">
                    紫米飯 <span class="opacity-75 font-normal">$20</span>
                </button>
            </div>
        </header>

        <!-- CENTER STAGE: PHASER 3 INTERACTIVE BENTO BOX CANVAS -->
        <div class="relative w-full h-[290px] sm:h-[320px] flex items-center justify-center my-auto z-10">
            <!-- Compartment Status Floating Pills -->
            <div class="absolute top-1 left-4 z-20 flex items-center gap-1.5 pointer-events-none">
                <span class="px-2.5 py-0.5 rounded-full bg-slate-900/75 border border-slate-700/70 text-[11px] text-slate-300 backdrop-blur-sm">
                    配菜三格: <strong id="side-slot-counter" class="text-amber-400">0/3</strong>
                </span>
                <span id="combo-status-pill" class="hidden px-2.5 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-[11px] text-emerald-300 font-medium backdrop-blur-sm">
                    ✨ 套餐折 -$15
                </span>
            </div>

            <!-- Quick Interaction Hint -->
            <div class="absolute bottom-1 right-4 z-20 pointer-events-none">
                <span class="text-[10px] text-slate-400/80 bg-slate-900/60 px-2 py-0.5 rounded-full">
                    💡 點擊便當內菜色可彈跳或夾走
                </span>
            </div>

            <!-- Phaser Canvas Mount -->
            <div id="phaser-bento-stage" class="w-full h-full"></div>
        </div>

        <!-- BOTTOM CONTROLS: INGREDIENT GRID & CHECKOUT BAR -->
        <section class="px-4 pb-4 pt-1 z-20 flex flex-col gap-2.5 bg-gradient-to-t from-[#060914] via-[#090e1f]/95 to-transparent">

            <!-- Category Filter & Live Mini Summary -->
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-1.5">
                    <button id="tab-all" onclick="filterCategory('all')" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-orange-500/20 text-orange-300 border border-orange-500/40 transition">
                        全部菜色 (8)
                    </button>
                    <button id="tab-sides" onclick="filterCategory('sides')" class="px-2.5 py-0.5 rounded-full text-[11px] font-medium text-slate-400 hover:text-slate-200 border border-transparent transition">
                        後方配菜 (6)
                    </button>
                    <button id="tab-mains" onclick="filterCategory('mains')" class="px-2.5 py-0.5 rounded-full text-[11px] font-medium text-slate-400 hover:text-slate-200 border border-transparent transition">
                        主菜加點 (6)
                    </button>
                </div>
                <button onclick="openReceiptPreview()" class="text-[11px] text-sky-400 hover:text-sky-300 flex items-center gap-0.5 font-medium">
                    <span>算錢明細</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>

            <!-- Ingredient Circular Buttons Grid (4 columns x 2 rows visible, or scrollable 12) -->
            <div id="ingredient-grid" class="grid grid-cols-4 gap-y-2.5 gap-x-2 max-h-[196px] overflow-y-auto no-scrollbar py-1 px-0.5">
                <!-- Populated dynamically via JS with procedural canvas icons -->
            </div>

            <!-- Prominent Orange Checkout Bar (Matches "Add to order -$0.60 $15.90") -->
            <div class="pt-0.5">
                <button id="btn-checkout" onclick="submitBentoOrder()" class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-[#e85d1a] via-[#f06418] to-[#ea580c] hover:from-[#f97316] hover:to-[#ea580c] active:scale-[0.98] text-white font-bold shadow-lg shadow-orange-600/30 flex items-center justify-between transition-all">
                    <div class="flex items-center gap-2">
                        <span class="text-base sm:text-lg tracking-wide">加入訂單結帳</span>
                        <span id="item-count-pill" class="px-2 py-0.5 rounded-full bg-black/25 text-xs font-semibold text-orange-100">
                            1 項
                        </span>
                    </div>
                    <div class="flex items-baseline gap-2.5">
                        <span id="discount-display" class="hidden text-sm font-semibold text-orange-200/90 line-through">
                            -$15
                        </span>
                        <span id="total-price-display" class="text-lg sm:text-xl font-black tracking-tight">
                            NT$ 15
                        </span>
                    </div>
                </button>
            </div>
        </section>

        <!-- MODAL: RECEIPT & PRICE BREAKDOWN ("算錢明細 / 結帳單") -->
        <div id="receipt-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/75 backdrop-blur-sm p-4">
            <div class="w-full max-w-sm bg-[#fffdf9] text-slate-900 rounded-3xl shadow-2xl overflow-hidden border-4 border-amber-500/30 animate-[popIn_0.22s_ease-out]">
                <!-- Classic Taiwanese Bento Top Header -->
                <div class="bg-gradient-to-r from-red-700 to-red-600 text-white px-5 py-4 flex items-center justify-between">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="px-1.5 py-0.5 text-[10px] font-black bg-amber-300 text-red-900 rounded">正宗台式</span>
                            <h3 class="text-lg font-black tracking-wider">阿霞懷舊木片便當</h3>
                        </div>
                        <p id="receipt-subtitle" class="text-xs text-red-100 mt-0.5">現點現做・熱騰騰算錢明細單</p>
                    </div>
                    <div class="w-11 h-11 rounded-full border-2 border-amber-300/80 flex items-center justify-center text-amber-200 font-black text-xs leading-tight text-center rotate-12 shadow-inner">
                        美味<br>合格
                    </div>
                </div>

                <!-- Receipt Body -->
                <div class="p-5">
                    <!-- Challenge Result Banner (if active) -->
                    <div id="receipt-challenge-box" class="hidden mb-3 p-3 rounded-xl bg-amber-50 border border-amber-300 text-xs text-amber-900">
                    </div>

                    <!-- Dashed Item List -->
                    <div class="text-xs text-slate-500 flex justify-between pb-1.5 border-b border-dashed border-slate-300 font-bold">
                        <span>品項名稱 (部位/格位)</span>
                        <span>單價 / 小計</span>
                    </div>

                    <div id="receipt-items-list" class="divide-y divide-dashed divide-slate-200 max-h-56 overflow-y-auto my-1 pr-1 text-sm">
                        <!-- Dynamically filled -->
                    </div>

                    <!-- Totals & Auntie Comment -->
                    <div class="mt-3 pt-3 border-t-2 border-slate-800 space-y-1">
                        <div class="flex justify-between text-xs text-slate-600">
                            <span>原始總計</span>
                            <span id="receipt-subtotal">NT$ 0</span>
                        </div>
                        <div id="receipt-discount-row" class="flex justify-between text-xs text-emerald-700 font-bold">
                            <span>✨ 便當套餐優惠 (飯+3配菜+主菜)</span>
                            <span id="receipt-discount">-NT$ 15</span>
                        </div>
                        <div class="flex justify-between items-baseline pt-1">
                            <span class="text-base font-black text-slate-900">應付總金額</span>
                            <span id="receipt-final-total" class="text-2xl font-black text-red-600">NT$ 0</span>
                        </div>
                    </div>

                    <!-- Quick Cash Register Change Calculator (互動找錢機) -->
                    <div class="mt-3 p-3 rounded-2xl bg-slate-100 border border-slate-200">
                        <div class="text-[11px] font-bold text-slate-600 mb-1.5 flex items-center justify-between">
                            <span>💵 付現找錢試算 (點選鈔票測試)：</span>
                            <span id="change-result" class="text-emerald-700 font-black">剛剛好免找錢</span>
                        </div>
                        <div class="grid grid-cols-4 gap-1.5">
                            <button onclick="calculateChange('exact')" class="py-1 px-2 rounded-lg bg-white border border-slate-300 text-xs font-bold text-slate-700 hover:bg-amber-50 active:scale-95">剛剛好</button>
                            <button onclick="calculateChange(100)" class="py-1 px-2 rounded-lg bg-red-50 border border-red-200 text-xs font-bold text-red-700 hover:bg-red-100 active:scale-95">$100 鈔</button>
                            <button onclick="calculateChange(200)" class="py-1 px-2 rounded-lg bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-700 hover:bg-emerald-100 active:scale-95">$200 鈔</button>
                            <button onclick="calculateChange(500)" class="py-1 px-2 rounded-lg bg-amber-50 border border-amber-200 text-xs font-bold text-amber-800 hover:bg-amber-100 active:scale-95">$500 鈔</button>
                        </div>
                    </div>

                    <!-- Auntie's Funny Evaluation -->
                    <div id="auntie-comment" class="mt-3 px-3 py-2 rounded-xl bg-amber-50/90 border border-amber-200/80 text-xs text-amber-900 flex items-center gap-2">
                        <span class="text-lg">👩‍🍳</span>
                        <span id="auntie-comment-text">阿姨說：「帥哥/美女，今天菜色很均衡喔！」</span>
                    </div>

                    <!-- Modal Buttons -->
                    <div class="mt-4 flex gap-2">
                        <button onclick="closeReceiptModal()" class="flex-1 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-sm transition">
                            繼續加菜
                        </button>
                        <button id="modal-confirm-btn" onclick="finalizeOrderAndNew()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 hover:to-red-500 text-white font-bold text-sm shadow-md shadow-orange-600/20 transition">
                            打包下一個便當
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODAL: ORDER HISTORY BAG -->
        <div id="history-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/75 backdrop-blur-sm p-4">
            <div class="w-full max-w-sm bg-slate-900 text-white rounded-3xl border border-slate-700 shadow-2xl overflow-hidden p-5">
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <h3 class="text-base font-bold flex items-center gap-2">
                        <span>🛍️</span>
                        <span>已打包的便當袋</span>
                    </h3>
                    <button onclick="closeHistoryModal()" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">✕</button>
                </div>
                <div id="history-list" class="my-3 max-h-64 overflow-y-auto space-y-2 text-xs">
                    <!-- Populated dynamically -->
                </div>
                <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                    <span class="text-xs text-slate-400">累計營業額總計：</span>
                    <span id="history-grand-total" class="text-lg font-black text-amber-400">NT$ 0</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        /******************************************************************
         * 1. GAME DATA & TAIWANESE BENTO CATALOG
         ******************************************************************/
        const RICE_BASES = {
            white:   { id: 'white',   name: '香Q白飯',   price: 15, desc: '池上特選白米' },
            braised: { id: 'braised', name: '古早滷肉飯', price: 25, desc: '淋上慢火膠質肉燥' },
            purple:  { id: 'purple',  name: '養生紫米飯', price: 20, desc: '富含花青素Q彈紫米' }
        };

        // 12 Iconic Taiwanese Bento Ingredients
        // 6 Side Dishes (go into the 3 back compartments of the white paper box)
        // 6 Main Dishes & Toppings (stack onto the large front compartment over the rice)

            // --- 靈魂配菜 (Back 3 Slots) ---
            {

                name: '番茄炒蛋',
                price: 15,

                maxQty: 3,

            {
                id: 'cabbage',

                price: 15,

                calories: 65,

            {

            },
            {
                id: 'mapo_tofu',

            {

            // --- 霸氣主菜 & 加點 (Front Large Compartment) ---

            {

                desc: '老滷汁浸泡對切滷蛋'
            },
            {

            {

        /******************************************************************
         * 2. SYNTHESIZED WEB AUDIO API SOUND ENGINE
         ******************************************************************/
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            // Soft bounce / plop when food lands in bento
            playDrop(isHeavy = false) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = isHeavy ? 'triangle' : 'sine';
                    const startFreq = isHeavy ? 140 : 260;
                    const endFreq = isHeavy ? 55 : 110;
                    osc.frequency.setValueAtTime(startFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.14);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.17);
                } catch (e) {}
            }
            // Pop sound when clicking UI
            playPop(pitch = 520) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(pitch, now);
                    osc.frequency.exponentialRampToValueAtTime(pitch * 1.4, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } catch (e) {}
            }
            // Remove item swoosh
            playRemove() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(340, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.13);
                } catch (e) {}
            }
            // Cash register Ka-Ching!
            playCashRegister() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const notes = [987.77, 1318.51, 1567.98, 2093.00];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.055);
                        gain.gain.setValueAtTime(0.18, now + idx * 0.055);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.28);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.055);
                        osc.stop(now + idx * 0.055 + 0.3);
                    });
                } catch (e) {}
            }
        }
        const sfx = new SoundFX();

        /******************************************************************
         * 4. PHASER 3 BENTO BOX SCENE
         * Renders the 3D White 4-Compartment Paper Bento Box & Interactive Food
         ******************************************************************/
        class BentoStageScene extends Phaser.Scene {
            constructor() {
                super({ key: 'BentoStageScene' });
                this.sideSprites = [null, null, null];
                this.mainSprites = [];
                this.boxShakeOffset = 0;
            }

             preload() {
                // Generate Phaser textures from our procedural dish art engine
                INGREDIENTS.forEach(item => {
                    const texW = item.category === 'mains' ? 110 : 88;
                    const texH = item.category === 'mains' ? 76 : 64;
                    const canvasTex = this.textures.createCanvas('dish_' + item.id, texW, texH);
                    const ctx = canvasTex.getContext();
                    drawDishArtwork(ctx, item.id, texW, texH);
                    canvasTex.refresh();
                });

                // Soft steam/crumb particle texture
                const partTex = this.textures.createCanvas('crumb_particle', 12, 12);
                const pCtx = partTex.getContext();
                pCtx.fillStyle = '#ffffff';
                pCtx.beginPath();
                pCtx.arc(6, 6, 5, 0, Math.PI * 2);
                pCtx.fill();
                partTex.refresh();
            }

            create() {
                phaserScene = this;
                const W = this.scale.width;
                const H = this.scale.height;
                this.centerX = W / 2;
                this.centerY = H / 2 + 12;

                // Define coordinates for the 4 compartments inside the white bento box
                this.updateCompartmentCoordinates();

                // Layer 1: Dark Slate Platter & Bento Box Back/Lid/Base (depth 10)
                this.bgGraphics = this.add.graphics().setDepth(10);

                // Layer 2: Rice Base in front compartment (depth 20)
                this.riceGraphics = this.add.graphics().setDepth(20);

                // Layer 3: Back 3 Compartment Side Dishes sit at depth 25

                // Layer 4: Middle Horizontal Divider & Vertical Slot Dividers (depth 30)
                // Drawn OVER the bottom of the back compartments so side dishes look nestled inside!
                this.dividerGraphics = this.add.graphics().setDepth(30);

                // Layer 5: Front Compartment Main Dishes & Add-ons sit at depth 35 - 45

                // Layer 6: Front Lip & Side Front Walls of the Bento Box (depth 50)
                this.frontWallGraphics = this.add.graphics().setDepth(50);

                // Layer 7: Stamp Overlay for Checkout Animation (depth 90)
                this.stampContainer = this.add.container(this.centerX, this.centerY).setDepth(90).setAlpha(0);
                this.createCheckoutStamp();

                // Draw static box layers & initial food state
                this.drawBentoBoxStructure();
                this.drawRiceLayer();
                this.syncAllFoodSprites(false);

                // Handle responsive canvas resize
                this.scale.on('resize', (gameSize) => {
                    this.centerX = gameSize.width / 2;
                    this.centerY = gameSize.height / 2 + 12;
                    this.updateCompartmentCoordinates();
                    this.drawBentoBoxStructure();
                    this.drawRiceLayer();
                    this.repositionExistingSprites();
                });
            }

            updateCompartmentCoordinates() {
                const cx = this.centerX;
                const cy = this.centerY;

                // Back 3 small square compartments (Left, Center, Right)
                this.backSlotCoords = [
                    { x: cx - 72, y: cy - 11 }, // Slot 0: Back-Left
                    { x: cx + 2,  y: cy - 8 },  // Slot 1: Back-Center
                    { x: cx + 76, y: cy - 5 }   // Slot 2: Back-Right
                ];

                // Front large rectangular compartment center (for Rice & Mains)
                this.frontCenter = { x: cx - 4, y: cy + 48 };
            }

            /**
             * Draws the Rice Base inside the large front compartment (Depth 20)
             */
            drawRiceLayer() {
                this.riceGraphics.clear();
                const cx = this.centerX;
                const cy = this.centerY;
                const riceType = bentoState.rice;

                const isPurple = riceType === 'purple';
                const baseCol = isPurple ? 0x4c1d4b : 0xfdfcf7;
                const grainCol = isPurple ? 0x702963 : 0xffffff;
                const shadowCol = isPurple ? 0x31102f : 0xe5e0d5;

                // Fluffy rice bed filling the front compartment
                this.riceGraphics.fillStyle(shadowCol, 1);
                this.riceGraphics.fillRoundedRect(cx - 114, cy + 18, 224, 42, 14);

                this.riceGraphics.fillStyle(baseCol, 1);
                this.riceGraphics.fillRoundedRect(cx - 112, cy + 15, 220, 40, 14);

                // Individual rice grain texture
                this.riceGraphics.fillStyle(grainCol, 0.95);
                for (let gx = -98; gx <= 96; gx += 13) {
                    for (let gy = 21; gy <= 48; gy += 8) {
                        const offsetX = ((gy * 7) % 5) - 2;
                        this.riceGraphics.fillEllipse(cx + gx + offsetX, cy + gy, 7, 3.8);
                    }
                }

                // If Braised Pork Rice (滷肉飯), draw glossy minced pork & soy sauce drizzle!
                if (riceType === 'braised') {
                    this.riceGraphics.fillStyle(0x78350f, 0.88);
                    const sauceBlobs = [
                        [-55, 32, 26, 12], [-15, 28, 32, 14], [30, 33, 28, 12],
                        [-35, 42, 24, 10], [10, 41, 30, 11], [62, 36, 22, 10]
                    ];
                    sauceBlobs.forEach(([bx, by, bw, bh]) => {
                        this.riceGraphics.fillEllipse(cx + bx, cy + by, bw, bh);
                    });

                    // Diced braised pork bits & crispy shallots
                    const morsels = [
                        [-60, 30], [-42, 36], [-22, 27], [-8, 35], [8, 29],
                        [24, 37], [42, 31], [58, 35], [-28, 41], [15, 42]
                    ];
                    morsels.forEach(([mx, my], idx) => {
                        this.riceGraphics.fillStyle(idx % 2 === 0 ? 0x451a03 : 0x9a3412, 1);
                        this.riceGraphics.fillRoundedRect(cx + mx - 4, cy + my - 3, 8, 6, 2);
                    });
                } else {
                    // Classic black sesame seeds sprinkled on white/purple rice
                    this.riceGraphics.fillStyle(isPurple ? 0xfef08a : 0x1e293b, 0.85);
                    [[-65, 32], [-58, 36], [-52, 31], [55, 35], [62, 39], [48, 37]].forEach(([sx, sy]) => {
                        this.riceGraphics.fillCircle(cx + sx, cy + sy, 1.4);
                    });
                }
            }

            /**
             * Synchronize or rebuild all food sprites with bentoState
             */
            syncAllFoodSprites(animateNew = false) {
                // Clear existing sprites
                this.sideSprites.forEach(s => { if (s) s.destroy(); });
                this.sideSprites = [null, null, null];
                this.mainSprites.forEach(m => { if (m.sprite) m.sprite.destroy(); });
                this.mainSprites = [];

                // Spawn side dishes in the 3 back slots
                bentoState.sideSlots.forEach((id, slotIdx) => {
                    if (id) {
                        this.spawnSideDishSprite(id, slotIdx, animateNew);
                    }
                });

                // Spawn main dishes & toppings in the front compartment
                bentoState.mainItems.forEach((itemObj, idx) => {
                    this.spawnMainDishSprite(itemObj, idx, animateNew);
                });
            }

            repositionExistingSprites() {
                this.sideSprites.forEach((sp, idx) => {
                    if (sp && this.backSlotCoords[idx]) {
                        sp.x = this.backSlotCoords[idx].x;
                        sp.y = this.backSlotCoords[idx].y;
                    }
                });
                this.mainSprites.forEach((mObj, idx) => {
                    if (mObj.sprite) {
                        const pos = this.getMainDishPosition(mObj.id, idx);
                        mObj.sprite.x = pos.x;
                        mObj.sprite.y = pos.y;
                    }
                });
            }

            getMainDishPosition(id, stackIndex) {
                const fc = this.frontCenter;
                // Smart layout inside the wide front rice compartment so multiple items look like a real Taiwanese bento!
                if (id === 'pork_chop' || id === 'chicken_leg') {
                    return {
                        x: fc.x - 16 + (stackIndex % 2) * 26,
                        y: fc.y - 12 - Math.floor(stackIndex / 2) * 8,
                        depth: 38 + stackIndex
                    };
                }
                if (id === 'braised_pork') {
                    return {
                        x: fc.x + 28 - (stackIndex % 2) * 35,
                        y: fc.y - 10 - stackIndex * 4,
                        depth: 37 + stackIndex
                    };
                }
                if (id === 'braised_egg') {
                    return {
                        x: fc.x + 74 - (stackIndex * 24) % 60,
                        y: fc.y - 8,
                        depth: 41 + stackIndex
                    };
                }
                if (id === 'sausage') {
                    return {
                        x: fc.x - 68 + (stackIndex * 28) % 60,
                        y: fc.y - 6,
                        depth: 40 + stackIndex
                    };
                }
                if (id === 'pickles') {
                    return {
                        x: fc.x - 86 + stackIndex * 18,
                        y: fc.y - 11,
                        depth: 36 + stackIndex
                    };
                }
                return { x: fc.x, y: fc.y - 10, depth: 38 + stackIndex };
            }

            spawnSideDishSprite(id, slotIdx, animateDrop = true) {
                if (this.sideSprites[slotIdx]) {
                    this.sideSprites[slotIdx].destroy();
                }
                const target = this.backSlotCoords[slotIdx];
                const startY = animateDrop ? target.y - 140 : target.y;

                const sp = this.add.image(target.x, startY, 'dish_' + id)
                    .setDepth(25)
                    .setInteractive({ useHandCursor: true });

                // Click on side dish in the bento box: bounce or remove
                sp.on('pointerdown', () => {
                    this.tweens.add({
                        targets: sp,
                        scaleX: 1.18,
                        scaleY: 0.85,
                        duration: 90,
                        yoyo: true,
                        onComplete: () => {
                            removeSideSlot(slotIdx);
                        }
                    });
                });

                this.sideSprites[slotIdx] = sp;

                if (animateDrop) {
                    sp.setScale(0.7, 1.25);
                    this.tweens.add({
                        targets: sp,
                        y: target.y,
                        scaleX: 1,
                        scaleY: 1,
                        duration: 360,
                        ease: 'Bounce.easeOut',
                        onComplete: () => {
                            const info = INGREDIENTS.find(i => i.id === id);
                            this.emitFoodParticles(target.x, target.y, 0xfef08a);
                            if (info) this.showFloatingPrice(target.x, target.y - 18, `+$${info.price}`, '#fbbf24');
                        }
                    });
                }
            }

            spawnMainDishSprite(itemObj, stackIdx, animateDrop = true) {
                const pos = this.getMainDishPosition(itemObj.id, stackIdx);
                const startY = animateDrop ? pos.y - 165 : pos.y;

                const sp = this.add.image(pos.x, startY, 'dish_' + itemObj.id)
                    .setDepth(pos.depth)
                    .setInteractive({ useHandCursor: true });

                // Interactive click on main dish inside box
                sp.on('pointerdown', () => {
                    this.tweens.add({
                        targets: sp,
                        scaleX: 1.15,
                        scaleY: 0.85,
                        duration: 90,
                        yoyo: true,
                        onComplete: () => {
                            removeMainByUid(itemObj.uid);
                        }
                    });
                });

                this.mainSprites.push({ uid: itemObj.uid, id: itemObj.id, sprite: sp });

                if (animateDrop) {
                    const info = INGREDIENTS.find(i => i.id === itemObj.id);
                    const isHeavy = info && info.isMainMeat;
                    sp.setScale(0.75, 1.25);
                    this.tweens.add({
                        targets: sp,
                        y: pos.y,
                        scaleX: 1,
                        scaleY: 1,
                        duration: isHeavy ? 420 : 340,
                        ease: 'Bounce.easeOut',
                        onComplete: () => {
                            this.emitFoodParticles(pos.x, pos.y, isHeavy ? 0xf59e0b : 0xffffff);
                            if (isHeavy) {
                                this.cameras.main.shake(110, 0.004);
                            }
                            if (info) {
                                this.showFloatingPrice(pos.x, pos.y - 22, `+$${info.price}`, '#fb923c');
                            }
                        }
                    });
                }
            }

            emitFoodParticles(x, y, colorHex) {
                for (let i = 0; i < 7; i++) {
                    const p = this.add.image(x, y, 'crumb_particle')
                        .setDepth(65)
                        .setTint(colorHex)
                        .setScale(Phaser.Math.FloatBetween(0.3, 0.65));
                    const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
                    const dist = Phaser.Math.Between(18, 42);
                    this.tweens.add({
                        targets: p,
                        x: x + Math.cos(angle) * dist,
                        y: y + Math.sin(angle) * dist - 10,
                        alpha: 0,
                        scale: 0.1,
                        duration: 380,
                        ease: 'Quad.easeOut',
                        onComplete: () => p.destroy()
                    });
                }
            }

            showFloatingPrice(x, y, textStr, colorStr = '#fbbf24') {
                const txt = this.add.text(x, y, textStr, {
                    fontFamily: 'Noto Sans TC, sans-serif',
                    fontSize: '15px',
                    fontStyle: '900',
                    color: colorStr,
                    stroke: '#090e1f',
                    strokeThickness: 4
                }).setOrigin(0.5).setDepth(80);

                this.tweens.add({
                    targets: txt,
                    y: y - 34,
                    alpha: 0,
                    duration: 750,
                    ease: 'Cubic.easeOut',
                    onComplete: () => txt.destroy()
                });
            }

            createCheckoutStamp() {
                const g = this.add.graphics();
                g.fillStyle(0xdc2626, 0.92);
                g.lineStyle(3, 0xfef08a, 1);
                g.fillRoundedRect(-68, -28, 136, 56, 12);
                g.strokeRoundedRect(-68, -28, 136, 56, 12);

                const stampTxt = this.add.text(0, 0, '🍱 美味封盒・結帳', {
                    fontFamily: 'Noto Sans TC, sans-serif',
                    fontSize: '15px',
                    fontStyle: 'bold',
                    color: '#ffffff'
                }).setOrigin(0.5);

                this.stampContainer.add([g, stampTxt]);
                this.stampContainer.setRotation(-0.12);
            }

            playStampAnimation(callback) {
                this.stampContainer.setPosition(this.centerX, this.centerY + 8);
                this.stampContainer.setScale(2.2);
                this.stampContainer.setAlpha(0);

                this.tweens.add({
                    targets: this.stampContainer,
                    scale: 1,
                    alpha: 1,
                    duration: 220,
                    ease: 'Back.easeIn',
                    onComplete: () => {
                        this.cameras.main.shake(120, 0.006);
                        setTimeout(() => {
                            this.tweens.add({
                                targets: this.stampContainer,
                                alpha: 0,
                                duration: 300
                            });
                            if (callback) callback();
                        }, 320);
                    }
                });
            }
        }

        /******************************************************************
         * 5. UI CONTROLS, INGREDIENT SELECTOR & PRICE MATH ("算錢邏輯")
         ******************************************************************/
        function getIngredientCount(id) {
            const info = INGREDIENTS.find(i => i.id === id);
            if (!info) return 0;
            if (info.category === 'sides') {
                return bentoState.sideSlots.filter(s => s === id).length;
            } else {
                return bentoState.mainItems.filter(m => m.id === id).length;
            }
        }

        /**
         * Core Price Calculation Engine
         * Returns { riceCost, sidesCost, mainsCost, subtotal, hasComboDiscount, discount, finalTotal, totalItems, totalCalories }
         */
        function calculateBentoPricing() {
            const riceObj = RICE_BASES[bentoState.rice];
            const riceCost = riceObj ? riceObj.price : 15;

            let sidesCost = 0;
            let filledSideSlots = 0;
            let totalCalories = 240; // base rice calories

            bentoState.sideSlots.forEach(id => {
                if (id) {
                    const item = INGREDIENTS.find(i => i.id === id);
                    if (item) {
                        sidesCost += item.price;
                        totalCalories += item.calories;
                        filledSideSlots++;
                    }
                }
            });

            let mainsCost = 0;
            let hasMainMeat = false;
            bentoState.mainItems.forEach(m => {
                const item = INGREDIENTS.find(i => i.id === m.id);
                if (item) {
                    mainsCost += item.price;
                    totalCalories += item.calories;
                    if (item.isMainMeat) hasMainMeat = true;
                }
            });

            const subtotal = riceCost + sidesCost + mainsCost;
            // Combo Discount Rule: 1 Rice + all 3 side compartments filled + at least 1 Main Meat = -$15 discount!
            const hasComboDiscount = (filledSideSlots === 3 && hasMainMeat);
            const discount = hasComboDiscount ? 15 : 0;
            const finalTotal = Math.max(0, subtotal - discount);
            const totalItems = 1 + filledSideSlots + bentoState.mainItems.length;

            return {
                riceObj,
                riceCost,
                sidesCost,
                mainsCost,
                filledSideSlots,
                hasMainMeat,
                subtotal,
                hasComboDiscount,
                discount,
                finalTotal,
                totalItems,
                totalCalories
            };
        }

        /**
         * Renders the circular ingredient selector buttons (matching Burger App UI)
         */
        function renderIngredientGrid() {
            const grid = document.getElementById('ingredient-grid');
            grid.innerHTML = '';

            let listIds = DEFAULT_GRID_ORDER;
            if (bentoState.currentCategory === 'sides') {
                listIds = INGREDIENTS.filter(i => i.category === 'sides').map(i => i.id);
            } else if (bentoState.currentCategory === 'mains') {
                listIds = INGREDIENTS.filter(i => i.category === 'mains').map(i => i.id);
            }

            listIds.forEach(id => {
                const item = INGREDIENTS.find(i => i.id === id);
                if (!item) return;

                const qty = getIngredientCount(id);
                const isSelected = qty > 0;

                const cell = document.createElement('div');
                cell.className = 'flex flex-col items-center relative';

                // Circle Wrapper
                const btnWrap = document.createElement('div');
                btnWrap.className = 'relative flex items-center justify-center';

                // Main Circular Button
                const circleBtn = document.createElement('button');
                circleBtn.className = `ingredient-btn w-[62px] h-[62px] sm:w-[66px] sm:h-[66px] rounded-full bg-[#131c33] border-2 ${isSelected ? 'ingredient-selected' : 'border-slate-700/80 hover:border-slate-500'} flex items-center justify-center relative overflow-hidden shadow-inner`;
                circleBtn.onclick = () => addIngredient(item.id);

                // Mini Canvas Icon inside the circle
                const iconCanvas = document.createElement('canvas');
                iconCanvas.width = 64;
                iconCanvas.height = 50;
                iconCanvas.className = 'w-[54px] h-[42px] pointer-events-none';
                drawDishArtwork(iconCanvas.getContext('2d'), item.id, 64, 50);
                circleBtn.appendChild(iconCanvas);

                btnWrap.appendChild(circleBtn);

                // If Selected: Add Left Blue Minus Badge (-) & Right Orange Checkmark/Qty Badge (✓)
                // Directly inspired by the Burger App screenshot!
                if (isSelected) {
                    const minusBtn = document.createElement('button');
                    minusBtn.className = 'badge-pop absolute -top-1 -left-1.5 w-6 h-6 rounded-full bg-[#1d4ed8] hover:bg-blue-500 border border-blue-300/60 text-white font-black text-sm flex items-center justify-center shadow-md z-10';
                    minusBtn.innerHTML = '−';
                    minusBtn.title = `減少 ${item.name}`;
                    minusBtn.onclick = (e) => {
                        e.stopPropagation();
                        removeIngredientById(item.id);
                    };
                    btnWrap.appendChild(minusBtn);

                    const checkBadge = document.createElement('div');
                    checkBadge.className = 'badge-pop absolute -top-1 -right-1.5 min-w-[22px] h-[22px] px-1 rounded-full bg-[#f97316] border border-orange-200/50 text-white text-[11px] font-black flex items-center justify-center shadow-md z-10 pointer-events-none';
                    checkBadge.innerHTML = qty > 1 ? `×${qty}` : '✓';
                    btnWrap.appendChild(checkBadge);
                }

                cell.appendChild(btnWrap);

                // Label & Price tag underneath
                const nameLabel = document.createElement('div');
                nameLabel.className = `mt-1 text-[11px] font-bold leading-tight text-center truncate w-full px-0.5 ${isSelected ? 'text-amber-300' : 'text-slate-200'}`;
                nameLabel.textContent = item.name;
                cell.appendChild(nameLabel);

                const priceLabel = document.createElement('div');
                priceLabel.className = 'text-[10px] font-semibold text-slate-400 leading-none mt-0.5';
                priceLabel.textContent = `$${item.price}`;
                cell.appendChild(priceLabel);

                grid.appendChild(cell);
            });
        }

        /**
         * Updates top rice pills, compartment counters, and the bottom orange price bar
         */
        function updateUISummary() {
            // Update Rice Pill buttons
            ['white', 'braised', 'purple'].forEach(rKey => {
                const btn = document.getElementById('rice-btn-' + rKey);
                if (!btn) return;
                if (bentoState.rice === rKey) {
                    btn.className = 'rice-pill px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-sky-100 text-slate-900 shadow';
                } else {
                    btn.className = 'rice-pill px-3.5 py-1 rounded-full text-xs font-bold transition-all text-slate-400 hover:text-slate-200';
                }
            });

            // Calculate live pricing
            const pricing = calculateBentoPricing();

            // Update side slot counter
            const slotCounter = document.getElementById('side-slot-counter');
            slotCounter.textContent = `${pricing.filledSideSlots}/3`;

            // Combo status pill on canvas
            const comboPill = document.getElementById('combo-status-pill');
            if (pricing.hasComboDiscount) {
                comboPill.classList.remove('hidden');
            } else {
                comboPill.classList.add('hidden');
            }

            // Bottom Checkout Bar price & discount display
            const discountEl = document.getElementById('discount-display');
            const totalEl = document.getElementById('total-price-display');
            const countPill = document.getElementById('item-count-pill');

            countPill.textContent = `${pricing.totalItems} 項`;

            if (pricing.hasComboDiscount) {
                discountEl.classList.remove('hidden');
                discountEl.textContent = `-$${pricing.discount}`;
            } else {
                discountEl.classList.add('hidden');
            }

            totalEl.textContent = `NT$ ${pricing.finalTotal}`;
            totalEl.classList.remove('price-bump');
            void totalEl.offsetWidth; // trigger reflow for animation
            totalEl.classList.add('price-bump');

            // Update order bag badge
            document.getElementById('bag-count-badge').textContent = bentoState.completedOrders.length;
        }

        /******************************************************************
         * 6. USER INTERACTION ACTIONS (ADD / REMOVE / RICE / FILTER)
         ******************************************************************/
        function selectRice(riceType) {
            if (bentoState.rice === riceType) return;
            bentoState.rice = riceType;
            sfx.playPop(440);
            if (phaserScene) {
                phaserScene.drawRiceLayer();
                const rObj = RICE_BASES[riceType];
                phaserScene.showFloatingPrice(phaserScene.centerX, phaserScene.centerY + 25, `${rObj.name} $${rObj.price}`, '#38bdf8');
            }
            updateUISummary();
        }

        function addIngredient(id) {
            const item = INGREDIENTS.find(i => i.id === id);
            if (!item) return;

            if (item.category === 'sides') {
                // Find first empty slot in the 3 back compartments
                let emptySlot = bentoState.sideSlots.findIndex(s => s === null);
                if (emptySlot === -1) {
                    // All 3 slots full: cycle-replace the oldest/first slot so user never gets stuck
                    emptySlot = 0;
                    bentoState.sideSlots.shift();
                    bentoState.sideSlots.push(id);
                    sfx.playDrop(false);
                    if (phaserScene) phaserScene.syncAllFoodSprites(false);
                    if (phaserScene) phaserScene.spawnSideDishSprite(id, 2, true);
                } else {
                    bentoState.sideSlots[emptySlot] = id;
                    sfx.playDrop(false);
                    if (phaserScene) phaserScene.spawnSideDishSprite(id, emptySlot, true);
                }
            } else {
                // Main dish or topping in the front large compartment
                const currentCount = getIngredientCount(id);
                if (currentCount >= item.maxQty) {
                    // Max stack reached for this item: give a playful bounce
                    sfx.playPop(300);
                    if (phaserScene) {
                        phaserScene.showFloatingPrice(phaserScene.centerX, phaserScene.centerY, `最多加 ${item.maxQty} 份喔！`, '#f87171');
                    }
                    return;
                }
                const newItemObj = { uid: nextUid++, id: item.id };
                bentoState.mainItems.push(newItemObj);
                sfx.playDrop(item.isMainMeat);
                if (phaserScene) {
                    phaserScene.spawnMainDishSprite(newItemObj, bentoState.mainItems.length - 1, true);
                }
            }

            renderIngredientGrid();
            updateUISummary();
        }

        function removeIngredientById(id) {
            const item = INGREDIENTS.find(i => i.id === id);
            if (!item) return;

            if (item.category === 'sides') {
                // Remove from last matching side slot
                for (let i = 2; i >= 0; i--) {
                    if (bentoState.sideSlots[i] === id) {
                        removeSideSlot(i);
                        break;
                    }
                }
            } else {
                // Remove last matching main item
                for (let i = bentoState.mainItems.length - 1; i >= 0; i--) {
                    if (bentoState.mainItems[i].id === id) {
                        removeMainByUid(bentoState.mainItems[i].uid);
                        break;
                    }
                }
            }
        }

        function removeSideSlot(slotIdx) {
            if (bentoState.sideSlots[slotIdx] === null) return;
            bentoState.sideSlots[slotIdx] = null;
            sfx.playRemove();
            if (phaserScene && phaserScene.sideSprites[slotIdx]) {
                phaserScene.sideSprites[slotIdx].destroy();
                phaserScene.sideSprites[slotIdx] = null;
            }
            renderIngredientGrid();
            updateUISummary();
        }

        function removeMainByUid(uid) {
            const idx = bentoState.mainItems.findIndex(m => m.uid === uid);
            if (idx === -1) return;
            bentoState.mainItems.splice(idx, 1);
            sfx.playRemove();
            if (phaserScene) {
                phaserScene.syncAllFoodSprites(false);
            }
            renderIngredientGrid();
            updateUISummary();
        }

        function resetBento() {
            sfx.playRemove();
            bentoState.rice = 'white';
            bentoState.sideSlots = [null, null, null];
            bentoState.mainItems = [];
            if (phaserScene) {
                phaserScene.drawRiceLayer();
                phaserScene.syncAllFoodSprites(false);
                phaserScene.showFloatingPrice(phaserScene.centerX, phaserScene.centerY, '已換新便當盒！', '#38bdf8');
            }
            renderIngredientGrid();
            updateUISummary();
        }

        function filterCategory(cat) {
            bentoState.currentCategory = cat;
            sfx.playPop(580);
            ['all', 'sides', 'mains'].forEach(c => {
                const btn = document.getElementById('tab-' + c);
                if (c === cat) {
                    btn.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-orange-500/20 text-orange-300 border border-orange-500/40 transition';
                } else {
                    btn.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-medium text-slate-400 hover:text-slate-200 border border-transparent transition';
                }
            });
            renderIngredientGrid();
        }

        /******************************************************************
         * 7. AUNTIE CHALLENGE MODE ("阿姨出題挑戰")
         ******************************************************************/
        const CHALLENGES = [
            {
                title: '月底省錢學生餐：總價 $85 以下，且要有 3 樣配菜！',
                check: (p) => p.finalTotal <= 85 && p.filledSideSlots === 3
            },
            {
                title: '健身大肌肌特餐：紫米飯 + 酥炸大雞腿 + 滷蛋！',
                check: () => bentoState.rice === 'purple' && getIngredientCount('chicken_leg') >= 1 && getIngredientCount('braised_egg') >= 1
            },
            {
                title: '拒絕三色豆聯盟：選滿 3 格配菜（不能有三色豆）+ 炸排骨！',
                check: (p) => p.filledSideSlots === 3 && getIngredientCount('three_color') === 0 && getIngredientCount('pork_chop') >= 1
            },
            {
                title: '豪華雙主菜大爺餐：滷肉飯 + 任選 2 樣大肉主菜，預算 $160 內！',
                check: (p) => {
                    const meatCount = getIngredientCount('pork_chop') + getIngredientCount('chicken_leg') + getIngredientCount('braised_pork');
                    return bentoState.rice === 'braised' && meatCount >= 2 && p.finalTotal <= 160;
                }
            }
        ];

        function toggleChallengeMode() {
            bentoState.challengeMode = !bentoState.challengeMode;
            const banner = document.getElementById('challenge-banner');
            const btnText = document.getElementById('challenge-btn-text');
            sfx.playPop(640);

            if (bentoState.challengeMode) {
                banner.classList.remove('hidden');
                btnText.textContent = '自由模式';
                generateNewChallenge();
            } else {
                banner.classList.add('hidden');
                btnText.textContent = '阿姨出題';
                bentoState.currentChallenge = null;
            }
        }

        function generateNewChallenge() {
            const randomCh = CHALLENGES[Math.floor(Math.random() * CHALLENGES.length)];
            bentoState.currentChallenge = randomCh;
            document.getElementById('challenge-desc').textContent = randomCh.title;
            sfx.playPop(700);
        }

        /******************************************************************
         * 8. CHECKOUT, RECEIPT BREAKDOWN & CHANGE CALCULATOR ("算錢結帳")
         ******************************************************************/
        function openReceiptPreview() {
            sfx.playPop(500);
            populateReceiptModal(false);
            const modal = document.getElementById('receipt-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function submitBentoOrder() {
            sfx.playCashRegister();
            if (phaserScene) {
                phaserScene.playStampAnimation(() => {
                    populateReceiptModal(true);
                    const modal = document.getElementById('receipt-modal');
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                });
            } else {
                populateReceiptModal(true);
                const modal = document.getElementById('receipt-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function populateReceiptModal(isCheckout) {
            const pricing = calculateBentoPricing();
            const listEl = document.getElementById('receipt-items-list');
            listEl.innerHTML = '';

            // 1. Rice Base Line
            const riceRow = document.createElement('div');
            riceRow.className = 'py-1.5 flex justify-between items-center';
            riceRow.innerHTML = `
                <div>
                    <span class="font-bold text-slate-800">🍚 ${pricing.riceObj.name}</span>
                    <span class="text-[11px] text-slate-400 ml-1">(前大格基底)</span>
                </div>
                <span class="font-bold text-slate-800">NT$ ${pricing.riceCost}</span>
            `;
            listEl.appendChild(riceRow);

            // 2. Side Dishes Lines (Back 3 compartments)
            const slotNames = ['左後格', '中後格', '右後格'];
            bentoState.sideSlots.forEach((id, idx) => {
                const row = document.createElement('div');
                row.className = 'py-1.5 flex justify-between items-center';
                if (id) {
                    const item = INGREDIENTS.find(i => i.id === id);
                    row.innerHTML = `
                        <div>
                            <span class="font-medium text-slate-700">🥬 ${item.name}</span>
                            <span class="text-[11px] text-slate-400 ml-1">(${slotNames[idx]})</span>
                        </div>
                        <span class="font-semibold text-slate-700">NT$ ${item.price}</span>
                    `;
                } else {
                    row.innerHTML = `
                        <div>
                            <span class="text-slate-400">▫️ 空配菜格</span>
                            <span class="text-[11px] text-slate-400 ml-1">(${slotNames[idx]})</span>
                        </div>
                        <span class="text-slate-400">NT$ 0</span>
                    `;
                }
                listEl.appendChild(row);
            });

            // 3. Main Dishes & Add-ons grouped by item
            const mainCounts = {};
            bentoState.mainItems.forEach(m => {
                mainCounts[m.id] = (mainCounts[m.id] || 0) + 1;
            });
            Object.keys(mainCounts).forEach(id => {
                const item = INGREDIENTS.find(i => i.id === id);
                const count = mainCounts[id];
                const lineTotal = item.price * count;
                const row = document.createElement('div');
                row.className = 'py-1.5 flex justify-between items-center';
                row.innerHTML = `
                    <div>
                        <span class="font-bold text-orange-700">🍖 ${item.name}</span>
                        <span class="text-xs font-bold text-slate-500 ml-1">${count > 1 ? `×${count}` : ''}</span>
                    </div>
                    <span class="font-bold text-slate-800">NT$ ${lineTotal}</span>
                `;
                listEl.appendChild(row);
            });

            // Subtotal, Discount, Final Total
            document.getElementById('receipt-subtotal').textContent = `NT$ ${pricing.subtotal}`;
            const discRow = document.getElementById('receipt-discount-row');
            if (pricing.hasComboDiscount) {
                discRow.classList.remove('hidden');
                discRow.classList.add('flex');
            } else {
                discRow.classList.add('hidden');
                discRow.classList.remove('flex');
            }
            document.getElementById('receipt-final-total').textContent = `NT$ ${pricing.finalTotal}`;

            // Challenge Verification
            const chBox = document.getElementById('receipt-challenge-box');
            if (bentoState.challengeMode && bentoState.currentChallenge) {
                chBox.classList.remove('hidden');
                const passed = bentoState.currentChallenge.check(pricing);
                if (passed) {
                    chBox.className = 'mb-3 p-2.5 rounded-xl bg-emerald-50 border border-emerald-400 text-xs text-emerald-900 font-bold';
                    chBox.innerHTML = `🎉 挑戰成功！完全符合「${bentoState.currentChallenge.title}」要求！`;
                } else {
                    chBox.className = 'mb-3 p-2.5 rounded-xl bg-red-50 border border-red-300 text-xs text-red-800 font-bold';
                    chBox.innerHTML = `⚠️ 尚未達成任務：「${bentoState.currentChallenge.title}」，可以點繼續加菜調整喔！`;
                }
            } else {
                chBox.classList.add('hidden');
            }

            // Auntie's Funny Comment based on contents
            const commentEl = document.getElementById('auntie-comment-text');
            if (getIngredientCount('three_color') >= 2) {
                commentEl.textContent = `阿姨驚呼：「同學你竟然點了 ${getIngredientCount('three_color')} 格三色豆，太勇敢了吧！」（熱量約 ${pricing.totalCalories} 大卡）`;
            } else if (pricing.hasComboDiscount && pricing.finalTotal >= 120) {
                commentEl.textContent = `阿姨笑咪咪：「今天吃很澎湃喔！幫你算套餐價折 15 元！」（熱量約 ${pricing.totalCalories} 大卡）`;
            } else if (!pricing.hasMainMeat) {
                commentEl.textContent = `阿姨關心你：「怎麼沒點排骨或雞腿？多吃點肉才有力氣啦！」（熱量約 ${pricing.totalCalories} 大卡）`;
            } else {
                commentEl.textContent = `阿姨說：「帥哥美女，便當幫你裝得滿滿的，趁熱吃喔！」（熱量約 ${pricing.totalCalories} 大卡）`;
            }

            // Reset change calculator to exact
            calculateChange('exact');
        }

        function calculateChange(paidAmount) {
            const pricing = calculateBentoPricing();
            const resEl = document.getElementById('change-result');
            sfx.playPop(620);

            if (paidAmount === 'exact') {
                resEl.className = 'text-emerald-700 font-black';
                resEl.textContent = `付 NT$${pricing.finalTotal} 剛剛好免找錢！`;
                return;
            }

            if (paidAmount < pricing.finalTotal) {
                const short = pricing.finalTotal - paidAmount;
                resEl.className = 'text-red-600 font-black';
                resEl.textContent = `不夠付喔！還差 NT$ ${short}`;
            } else {
                const change = paidAmount - pricing.finalTotal;
                resEl.className = 'text-emerald-700 font-black';
                resEl.textContent = `收您 $${paidAmount}，應找零 NT$ ${change}`;
            }
        }

        function closeReceiptModal() {
            const modal = document.getElementById('receipt-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function finalizeOrderAndNew() {
            const pricing = calculateBentoPricing();
            // Save summary to completed orders bag
            const mainNames = bentoState.mainItems.map(m => {
                const item = INGREDIENTS.find(i => i.id === m.id);
                return item ? item.name : '';
            }).filter(Boolean);

            const sideNames = bentoState.sideSlots.map(id => {
                const item = INGREDIENTS.find(i => i.id === id);
                return item ? item.name : '空';
            });

            bentoState.completedOrders.push({
                orderNo: bentoState.completedOrders.length + 1,
                riceName: pricing.riceObj.name,
                mains: mainNames.length ? mainNames.join(' + ') : '無主菜(菜飯)',
                sides: sideNames.join(' / '),
                total: pricing.finalTotal
            });

            closeReceiptModal();
            resetBento();
        }

        function openHistoryModal() {
            sfx.playPop(540);
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            let grandTotal = 0;

            if (bentoState.completedOrders.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-400">目前還沒有已打包的便當喔！<br>快選好菜色點「加入訂單結帳」吧！</div>`;
            } else {
                bentoState.completedOrders.forEach(ord => {
                    grandTotal += ord.total;
                    const card = document.createElement('div');
                    card.className = 'p-3 rounded-2xl bg-slate-800/90 border border-slate-700 flex justify-between items-center';
                    card.innerHTML = `
                        <div>
                            <div class="font-bold text-amber-300">#${ord.orderNo} ${ord.riceName}・${ord.mains}</div>
                            <div class="text-[11px] text-slate-400 mt-0.5">配菜：${ord.sides}</div>
                        </div>
                        <div class="text-sm font-black text-white shrink-0 ml-2">NT$ ${ord.total}</div>
                    `;
                    list.appendChild(card);
                });
            }

            document.getElementById('history-grand-total').textContent = `NT$ ${grandTotal}`;
            const modal = document.getElementById('history-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeHistoryModal() {
            const modal = document.getElementById('history-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        /******************************************************************
         * 9. INITIALIZE PHASER 3 GAME ON WINDOW LOAD
         ******************************************************************/
        window.onload = function () {
            renderIngredientGrid();
            updateUISummary();

            const stageContainer = document.getElementById('phaser-bento-stage');
            const config = {
                type: Phaser.AUTO,
                parent: 'phaser-bento-stage',
                width: stageContainer.clientWidth || 400,
                height: stageContainer.clientHeight || 300,
                transparent: true,
                scale: {
                    mode: Phaser.Scale.RESIZE,
                    autoCenter: Phaser.Scale.CENTER_BOTH
                },
                scene: [BentoStageScene]
            };

            new Phaser.Game(config);
        };
    </script>
</body>
