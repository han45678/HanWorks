            id: 'd3-2', step: 2, time: '13:00', name: 'BIFF 廣場（黑糖餅）＋ 國際市場',
            solo: '元祖堅果黑糖餅・傳統市集', category: '南浦洞經典小吃＆日用品挖寶', lat: 35.0989, lng: 129.0285,
            address: '釜山中區 BIFF 廣場路 ＆ 國際市場（札嘎其烤魚街北側步行 3 分鐘）', naverQuery: 'BIFF광장',
            img: makeBusanBase64('hotteok', '13:00 BIFF 廣場 ＋ 國際市場', '必吃元祖堅果黑糖餅＆傳統市場漫遊', '#92400e', '#0f766e'),
            desc: '從烤魚街過馬路即達 BIFF 廣場，必吃塞滿葵花籽與堅果的現炸「元祖黑糖餅」，接著一路逛進國際市場與富平罐頭市場。',
            tips: ['💡 <strong>採買推薦：</strong>國際市場適合買韓國棉被、搓澡巾、紫菜與傳統雜貨。']
          },
          {
            id: 'd3-3', step: 3, time: '15:00', name: '樂天百貨光復店 ＆ 樂天超市',
            solo: '伴手禮採購', category: '大型超市採買・頂樓免費港灣觀景台', lat: 35.0982, lng: 129.0365,
            address: '釜山中區中央大路2（地鐵南浦站 8/10 號出口連通）', naverQuery: '롯데마트 광복점',
            img: makeBusanBase64('shopping', '15:00 樂天百貨光復店＆樂天超市', '伴手禮零食採購・滿15,000韓元現場退稅', '#065f46', '#0284c7'),
            desc: '回國前的最後一站伴手禮大採購！在樂天超市光復店一次買齊韓國海苔、HBAF 杏仁果、Zero 軟糖、拉麵與咖啡，結帳櫃檯可直接現場退稅。',
            tips: ['💡 <strong>隱藏景點：</strong>若有時間可搭電梯上樂天百貨光復店 13 樓頂樓空中花園，免費俯瞰釜山港大橋與影島全景！']
          },
          {
            id: 'd3-4', step: 4, time: '18:00', name: '回西面飯店領行李',
            solo: '整理戰利品・準備去機場', category: '領取行李・最後打包', lat: 35.1578, lng: 129.0600,
            address: '釜山廣域市釜山鎮區西面站周邊飯店', naverQuery: '서면역',
            img: makeBusanBase64('plane', '18:00 回西面飯店領行李', '整理樂天超市與醫美保養戰利品入箱', '#1e293b', '#0d9488'),
            desc: '搭乘地鐵 1 號線返回西面飯店領取行李，將剛剛在樂天超市與 Olive Young 採買的液體保養品與伴手禮收進行李箱準備托運。',
            tips: ['💡 <strong>打包提醒：</strong>超過 100ml 的醫美保濕噴霧、面膜液體與泡菜醬料務必放進托運行李箱。']
          },
          {
            id: 'd3-5', step: 5, time: '19:15', name: '抵達金海機場（辦理退稅 & 22:00 起飛）',
            solo: '辦理退稅 & 22:00 起飛', category: '機場退稅・平安返航', lat: 35.1732, lng: 128.9465,
            address: '釜山廣域市江西區空港進入路108（金海國際機場國際線航廈）', naverQuery: '김해국제공항 국제선',
            img: makeBusanBase64('plane', '19:15 抵達金海機場', '辦理退稅 ＆ 22:00 起飛返程', '#0f172a', '#0f766e'),
            desc: '19:15 抵達金海國際機場，先使用自助退稅機（Kiosk）掃描護照與尚未現場退稅的單據，完成航空公司報到托運後入關領取退稅金，搭乘 22:00 班機起飛返台。',
            tips: ['💡 <strong>退稅流程：</strong>出境大廳先掃描退稅單 ➔ 辦理行李托運 ➔ 過安檢與海關入關 ➔ 至禁區內 4 號登機門旁退稅櫃檯領取現金。']
          }
        ]
      }
    ];

    const map = L.map('map', { zoomControl: true }).setView([35.135, 129.085], 12);
    const googleLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=zh-TW&x={x}&y={y}&z={z}', { attribution: '&copy; Google Maps', subdomains: ['0','1','2','3'], maxZoom: 20 });
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 });
    googleLayer.addTo(map);
    L.control.layers({ '🗺️ Google 地圖（繁中推薦）': googleLayer, '🌐 OpenStreetMap': osmLayer }, null, { position: 'topright' }).addTo(map);

    const markersBySpotId = {};
    const layerGroupsByDay = {};
    const allBounds = [];
    let activeSpotIds = [];
    let currentSpotIdx = 0;

    function toggleHeader() {
      const header = document.getElementById('appHeader');
      const btn = document.getElementById('headerToggleBtn');
      header.classList.toggle('collapsed');
      btn.innerHTML = header.classList.contains('collapsed') ? '▼ 展開日期選單' : '▲ 收合頂部欄';
    }

    function openMapModal(titleText) {
      const modal = document.getElementById('mapModalBackdrop');
      if (titleText) document.getElementById('mapModalTitle').textContent = titleText;
      modal.classList.add('open');
      setTimeout(() => map.invalidateSize(), 60);
    }

    function closeMapModal() {
      document.getElementById('mapModalBackdrop').classList.remove('open');
    }

    function closeMapModalOnBackdrop(e) {
      if (e.target.id === 'mapModalBackdrop') closeMapModal();
    }

    function updateSwipeBar(spotId) {
      const item = markersBySpotId[spotId];
      if (!item) return;
      document.getElementById('swipeThumb').src = item.img;
      document.getElementById('swipeBadge').textContent = `${item.date} · 第 ${currentSpotIdx + 1} / ${activeSpotIds.length} 站 · ${item.time}`;
      document.getElementById('swipeName').textContent = item.name;
      document.getElementById('swipeSub').textContent = '📍 ' + item.address;
      document.getElementById('mapModalTitle').textContent = `📍 ${item.date} (${item.time})｜${item.name} (${currentSpotIdx + 1}/${activeSpotIds.length})`;
    }

    function stepSpot(delta) {
      if (!activeSpotIds.length) return;
      currentSpotIdx = (currentSpotIdx + delta + activeSpotIds.length) % activeSpotIds.length;
      const nextId = activeSpotIds[currentSpotIdx];
      const inner = document.getElementById('swipeCardInner');
      inner.style.transform = `translateX(${delta > 0 ? '-12px' : '12px'})`;
      setTimeout(() => { inner.style.transform = 'translateX(0)'; }, 160);
      focusSpot(nextId, activeSpotIds);
    }

    function initSwipeGestures() {
      let startX = 0, startY = 0;
      ['mapSwipeBar', 'mapModalHeader'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', e => {
          startX = e.changedTouches[0].screenX;
          startY = e.changedTouches[0].screenY;
        }, { passive: true });
        el.addEventListener('touchend', e => {
          const dx = e.changedTouches[0].screenX - startX;
          const dy = e.changedTouches[0].screenY - startY;
          if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0) stepSpot(1);
            else stepSpot(-1);
          }
        }, { passive: true });
      });
      document.addEventListener('keydown', e => {
        if (!document.getElementById('mapModalBackdrop').classList.contains('open')) return;
        if (e.key === 'Escape') closeMapModal();
        if (e.key === 'ArrowLeft') stepSpot(-1);
        if (e.key === 'ArrowRight') stepSpot(1);
      });
    }

    function initApp() {
      const feed = document.getElementById('itineraryFeed');
      feed.innerHTML = '';
      itineraryData.forEach(day => {
        const dayLayer = L.layerGroup().addTo(map);
        layerGroupsByDay[day.dayId] = dayLayer;
        const dayLatLngs = [];
        const section = document.createElement('section');
        section.className = 'day-section';
        section.dataset.dayId = day.dayId;
        let cardsHtml = '';

        day.spots.forEach(spot => {
          const latLng = [spot.lat, spot.lng];
          dayLatLngs.push(latLng);
          allBounds.push(latLng);

          const pinIcon = L.divIcon({
            className: '',
            html: `<div class="custom-pin" style="background:${day.color}"><span>${spot.step}</span></div>`,
            iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28]
          });

          const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('釜山 ' + spot.name)}`;
          const naverUrl = `https://map.naver.com/p/search/${encodeURIComponent(spot.naverQuery || spot.name)}`;

          const marker = L.marker(latLng, { icon: pinIcon }).addTo(dayLayer);
          marker.bindPopup(`
            <div class="popup-box">
              <div style="font-size:11px;font-weight:700;color:${day.color};margin-bottom:2px;">${day.date} · ${spot.time}</div>
              <h4>${spot.name}</h4>
              <p>${spot.address}</p>
              <div class="popup-links">
                <a href="${gmapUrl}" target="_blank" rel="noopener">🗺️ Google Maps</a>
                <a href="${naverUrl}" target="_blank" rel="noopener">🟢 Naver Map 導航</a>
              </div>
            </div>
          `);

          markersBySpotId[spot.id] = { marker, dayId: day.dayId, latLng, name: spot.name, date: day.date, time: spot.time, address: spot.address, img: spot.img };
          activeSpotIds.push(spot.id);

          const tipsBlockHtml = spot.tips && spot.tips.length > 0
            ? `<ul class="tips-list" style="border-left-color:${day.color}">${spot.tips.map(t => `<li>${t}</li>`).join('')}</ul>`
            : '';

          cardsHtml += `
            <article class="place-card" id="card-${spot.id}" onclick="focusSpot('${spot.id}')">
              <div class="card-media">
                <span class="time-tag">${spot.time}</span>
                <span class="step-number" style="background:${day.color}">${spot.step}</span>
                <img src="${spot.img}" alt="${spot.name}" />
              </div>
              <div class="card-body">
                <div>
                  <div class="place-title-group">
                    <h3>${spot.time} ｜ ${spot.name}</h3>
                    <div class="place-meta">
                      <span class="category-pill">${spot.category}</span>
                      <span class="solo-tag">✨ ${spot.solo}</span>
                    </div>
                  </div>
                  <p class="place-desc" style="margin-top:8px;">${spot.desc}</p>
                </div>
                ${tipsBlockHtml}
                <div class="card-actions" onclick="event.stopPropagation()">
                  <span class="address-text">📍 ${spot.address}</span>
                  <div class="action-btns">
                    <button class="btn-sm btn-locate" onclick="focusSpot('${spot.id}')">🎯 地圖定位</button>
                    <a class="btn-sm" href="${gmapUrl}" target="_blank" rel="noopener">Google 地圖</a>
                    <a class="btn-sm" href="${naverUrl}" target="_blank" rel="noopener">🟢 Naver Map</a>
                  </div>
                </div>
              </div>
            </article>
          `;
        });

        if (dayLatLngs.length > 1) {
          L.polyline(dayLatLngs, { color: day.color, weight: 3.5, opacity: 0.75, dashArray: '8, 8' }).addTo(dayLayer);
        }

        section.innerHTML = `
          <div class="day-header">
            <div class="day-title-wrap">
              <span class="day-badge" style="background:${day.color}">${day.date}</span>
              <div class="day-title-text"><h2>${day.title}</h2><p>${day.subtitle}</p></div>
            </div>
            <button class="day-map-btn" onclick="zoomToDay('${day.dayId}')">🗺️ 彈出當日路線地圖</button>
          </div>
          <div class="cards-container">${cardsHtml}</div>
        `;
        feed.appendChild(section);
      });
      initSwipeGestures();
    }

    function focusSpot(spotId, customList) {
      activeSpotIds = customList || Object.keys(markersBySpotId);
      currentSpotIdx = activeSpotIds.indexOf(spotId);
      if (currentSpotIdx === -1) { activeSpotIds = Object.keys(markersBySpotId); currentSpotIdx = activeSpotIds.indexOf(spotId); }

      document.querySelectorAll('.place-card').forEach(c => c.classList.remove('highlighted'));
      const cardEl = document.getElementById(`card-${spotId}`);
      if (cardEl) cardEl.classList.add('highlighted');

      const item = markersBySpotId[spotId];
      if (item) {
        openMapModal();
        updateSwipeBar(spotId);
        if (!map.hasLayer(layerGroupsByDay[item.dayId])) layerGroupsByDay[item.dayId].addTo(map);
        setTimeout(() => {
          map.invalidateSize();
          map.flyTo(item.latLng, 15, { duration: 0.6 });
          setTimeout(() => item.marker.openPopup(), 300);
        }, 100);
      }
    }

    function zoomToDay(dayId) {
      const day = itineraryData.find(d => d.dayId === dayId);
      if (!day) return;
      activeSpotIds = day.spots.map(s => s.id);
      currentSpotIdx = 0;
      openMapModal();
      updateSwipeBar(activeSpotIds[0]);
      Object.keys(layerGroupsByDay).forEach(k => {
        if (k === dayId) { if (!map.hasLayer(layerGroupsByDay[k])) layerGroupsByDay[k].addTo(map); }
        else { if (map.hasLayer(layerGroupsByDay[k])) map.removeLayer(layerGroupsByDay[k]); }
      });
      const bounds = day.spots.map(s => [s.lat, s.lng]);
      setTimeout(() => {
        map.invalidateSize();
        map.flyToBounds(bounds, { padding: [50, 50], duration: 0.6 });
      }, 100);
    }

    function openFullMapModal() {
      activeSpotIds = Object.keys(markersBySpotId);
      currentSpotIdx = 0;
      openMapModal('📍 釜山三天兩夜行程總覽地圖');
      updateSwipeBar(activeSpotIds[0]);
      setTimeout(() => resetMapView(), 120);
    }

    function filterDay(dayId, btnEl) {
      if (btnEl) {
        document.querySelectorAll('.date-tab').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }
      document.querySelectorAll('.day-section').forEach(sec => {
        sec.style.display = (dayId === 'all' || sec.dataset.dayId === dayId) ? 'block' : 'none';
      });
      if (window.innerWidth <= 768 && dayId !== 'all') {
        const header = document.getElementById('appHeader');
        if (!header.classList.contains('collapsed')) toggleHeader();
      }
    }

    function resetMapView() {
      Object.keys(layerGroupsByDay).forEach(k => {
        if (!map.hasLayer(layerGroupsByDay[k])) layerGroupsByDay[k].addTo(map);
      });
      if (allBounds.length > 0) {
        map.invalidateSize();
        map.flyToBounds(allBounds, { padding: [40, 40], duration: 0.6 });
      }
    }

    initApp();
  </script>
</body>
</html>
